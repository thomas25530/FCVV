          python3 - "$DELEGATE_M" <<'PY'
          import sys
          import re
          
          path = sys.argv[1]
          
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          
          # Recherche de toutes les méthodes didFinishLaunching
          matches = list(re.finditer(
              r'-\s*\(BOOL\)\s*application\s*:\s*'
              r'\(UIApplication\s*\*\)\s*application\s*'
              r'didFinishLaunchingWithOptions\s*:\s*'
              r'\(NSDictionary\s*\*\)\s*launchOptions\s*\{',
              text,
              re.MULTILINE
          ))
          
          print(f"didFinishLaunchingWithOptions trouvé : {len(matches)}")
          
          if not matches:
              print("❌ Aucune méthode didFinishLaunchingWithOptions")
              sys.exit(1)
          
          call = "[self fcvvConfigureFirebaseAndNotifications];"
          
          call_positions = [
              m.start()
              for m in re.finditer(
                  re.escape(call),
                  text
              )
          ]
          
          print(f"Appels FCVV trouvés : {len(call_positions)}")
          
          if len(call_positions) == 0:
              print("❌ L'appel FCVV est absent")
              sys.exit(1)
          
          if len(call_positions) > 1:
              print("⚠️ Plusieurs appels FCVV détectés")
          
          # On prend la méthode de lancement
          launch_start = matches[0].start()
          launch_body_start = matches[0].end()
          
          # Trouver approximativement la fin de la méthode
          next_method = re.search(
              r'\n-\s*\(',
              text[launch_body_start:]
          )
          
          if next_method:
              launch_end = launch_body_start + next_method.start()
          else:
              launch_end = len(text)
          
          calls_inside = [
              pos
              for pos in call_positions
              if launch_body_start <= pos < launch_end
          ]
          
          if not calls_inside:
              print("")
              print("❌ ERREUR CRITIQUE")
              print("   L'appel FCVV existe mais n'est PAS dans")
              print("   didFinishLaunchingWithOptions.")
              print("")
              sys.exit(1)
          
          print("✓ Appel FCVV situé dans didFinishLaunchingWithOptions")
          
          # Affichage du contexte
          pos = calls_inside[0]
          
          start = max(0, pos - 500)
          end = min(len(text), pos + 800)
          
          print("")
          print("============================================================")
          print("CONTEXTE")
          print("============================================================")
          print(text[start:end])
          
          print("")
          print("✓ Vérification lifecycle OK")
          PY

