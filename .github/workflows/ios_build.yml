name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios>=1.3.0" pillow requests urllib3 pyyaml

      - name: Clean kivy-ios cache
        run: |
          rm -rf ~/.kivy-ios

      - name: Create Kivy-iOS directory
        run: mkdir -p "$HOME/.kivy-ios"

      - name: Cache kivy-ios
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v4-python310
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v4-

      - name: Validate cache and Build
        run: |
          set -euxo pipefail
          echo "===== Informations kivy-ios ====="
          which toolchain
          toolchain recipes
          toolchain status || true
          echo "===== Contenu ~/.kivy-ios ====="
          ls -la "$HOME/.kivy-ios" || true
          find "$HOME/.kivy-ios" -maxdepth 3 || true
          echo "===== Compilation des recettes ====="
          toolchain build python3 kivy openssl pillow
          toolchain pip install pyyaml requests urllib3
          find ~/.kivy-ios -path "*site-packages*" -iname "*yaml*"

      - name: Inspect build output
        run: |
          set -euxo pipefail
          echo "===== Vérification des recettes ====="
          toolchain status || true
          echo "===== Répertoire courant ====="
          pwd
          ls -la
          echo "===== DIST ====="
          [ -d dist ] && du -sh dist || echo "dist absent"
          [ -d dist ] && find dist -maxdepth 3 || true
          echo "===== BUILD ====="
          [ -d build ] && du -sh build || echo "build absent"
          [ -d build ] && find build -maxdepth 3 || true
          echo "===== Recherche Python ====="
          find dist -iname "*python*" 2>/dev/null || true
          find build -iname "*python*" 2>/dev/null || true
          echo "===== Recherche site-packages ====="
          find dist -iname "site-packages" 2>/dev/null || true
          find build -iname "site-packages" 2>/dev/null || true
          echo "===== Recherche yaml ====="
          find dist -iname "*yaml*" 2>/dev/null || true
          find build -iname "*yaml*" 2>/dev/null || true
          echo "===== Recherche requests ====="
          find dist -iname "*requests*" 2>/dev/null || true
          find build -iname "*requests*" 2>/dev/null || true
          echo "===== XCFramework ====="
          find dist -iname "*.xcframework" 2>/dev/null || true
          echo "===== Librairies Python ====="
          find dist -iname "libpython*" 2>/dev/null || true
          echo "===== PYTHON LIB SEARCH ====="
          find "$HOME/.kivy-ios" -type d -name "site-packages" -o -name "python3"
          find . -type d -name "site-packages"

      - name: Prepare sources
        run: |
          rm -rf ios_src
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" --exclude="ios_src" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist
          find ios_src -name "__pycache__" -type d -exec rm -rf {} +
          find ios_src -name "*.pyc" -delete

      - name: Create Xcode project and setup Firebase
        run: |
          set -euxo pipefail
          toolchain create FCVV ios_src
          
          # Localisation précise du projet
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          PROJ_NAME=$(basename "$PROJECT_FILE")
          
          # 1. Copie du plist dans le dossier du projet
          cp ios_src/GoogleService-Info.plist "$PROJ_DIR/"
          
          # 2. Utilisation du chemin complet pour Ruby afin d'éviter les erreurs de contexte
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"
          
          ruby -e "
          require 'xcodeproj'
          # Ouverture avec le chemin complet
          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
          target = project.targets.find { |t| t.name == 'fcvv' }
          
          # Ajout du fichier situé dans PROJ_DIR
          file = project.main_group.new_file('GoogleService-Info.plist')
          target.add_resources([file])
          project.save
          "
          
      - name: Inject Firebase into files
        run: |
          set -euxo pipefail

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")

          MAIN_FILE=$(find "$PROJ_DIR" -name "main.m" | head -1)
          APPDELEGATE_FILE=$(find . -name "SDL_uikitappdelegate.m" | head -1)

          grep -n "@implementation" "$APPDELEGATE_FILE"

          echo "MAIN_FILE=$MAIN_FILE"
          echo "APPDELEGATE_FILE=$APPDELEGATE_FILE"

          # 1. Firebase imports dans main.m
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          imports = "@import FirebaseCore;\n@import FirebaseMessaging;\n"

          if "FirebaseCore" not in content:
            content = imports + content

          path.write_text(content)
          PY


          # 2. Configure Firebase dans main.m
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          code = r'''
          if ([FIRApp defaultApp] == nil) {
              [FIRApp configure];
              NSLog(@"[FCM iOS] Firebase configure");
          }

          [[UIApplication sharedApplication] registerForRemoteNotifications];
          NSLog(@"[FCM iOS] APNS registration");
          '''

          marker = "int main(int argc, char *argv[]) {"

          if "[FIRApp configure]" not in content:
            content = content.replace(
                marker,
                marker + "\n" + code
            )

          path.write_text(content)
          PY


          # 3. Imports Firebase/UserNotifications dans SDL delegate
          python3 - "$APPDELEGATE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          imports = "@import FirebaseMessaging;\n@import UserNotifications;\n"

          if "FirebaseMessaging" not in content:
            content = imports + content

          path.write_text(content)
          PY


          # 4. Injection delegate FCM + notifications foreground
          python3 - "$APPDELEGATE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          if "APNS token recu" not in content:

              injection = r'''

          #pragma mark - FCM & Notifications Push

          - (void)application:(UIApplication *)application
          didRegisterForRemoteNotificationsWithDeviceToken:(NSData *)deviceToken
          {
            NSLog(@"[FCM iOS] APNS token recu");

            [FIRMessaging messaging].APNSToken = deviceToken;

            [[FIRMessaging messaging] tokenWithCompletion:^(NSString *token, NSError *error) {
                if (error) {
                    NSLog(@"[FCM iOS] Erreur FCM %@", error);
                } else {
                    NSLog(@"[FCM iOS] Token FCM %@", token);
                }
            }];

            if (@available(iOS 10.0, *)) {
                [UNUserNotificationCenter currentNotificationCenter].delegate =
                    (id<UNUserNotificationCenterDelegate>)self;
            }
          }


          - (void)application:(UIApplication *)application
          didFailToRegisterForRemoteNotificationsWithError:(NSError *)error
          {
            NSLog(@"[FCM iOS] Erreur APNS %@", error);
          }


          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
               willPresentNotification:(UNNotification *)notification
                 withCompletionHandler:(void (^)(UNNotificationPresentationOptions options))completionHandler
          {
            NSLog(@"[FCM iOS] Notification recue au premier plan !");

            if (@available(iOS 14.0, *)) {
                completionHandler(
                    UNNotificationPresentationOptionBanner |
                    UNNotificationPresentationOptionSound |
                    UNNotificationPresentationOptionBadge
                );
            } else {
                completionHandler(
                    UNNotificationPresentationOptionAlert |
                    UNNotificationPresentationOptionSound |
                    UNNotificationPresentationOptionBadge
                );
            }
          }
          '''

          # Cherche le vrai @end de SDLUIKitDelegate
          pos = content.rfind("\n@end")

          if pos == -1:
            raise RuntimeError("Impossible de trouver @end SDLUIKitDelegate")

          content = content[:pos] + injection + content[pos:]

          path.write_text(content)
          PY
          
          # 5. Déclare UNUserNotificationCenterDelegate dans SDL_uikitappdelegate.h
          HEADER_FILE=$(find . -name "SDL_uikitappdelegate.h" | head -1)

          echo "HEADER_FILE=$HEADER_FILE"

          python3 - "$HEADER_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          # Ajoute l'import UserNotifications
          if "#import <UserNotifications/UserNotifications.h>" not in content:
              content = content.replace(
                  "#import <UIKit/UIKit.h>",
                  "#import <UIKit/UIKit.h>\n#import <UserNotifications/UserNotifications.h>"
              )

          # Ajoute le protocole UNUserNotificationCenterDelegate
          old = "@interface SDLUIKitDelegate : NSObject<UIApplicationDelegate>"
          new = "@interface SDLUIKitDelegate : NSObject<UIApplicationDelegate, UNUserNotificationCenterDelegate>"

          if old in content:
              content = content.replace(old, new)

          path.write_text(content)
          PY
          
           
          
      - name: Verify Injection
        run: |
          APPDELEGATE_FILE=$(find . -name "SDL_uikitappdelegate.m" | head -1)

          echo "--- main.m Firebase ---"
          grep -n "Firebase\|FIRApp\|registerForRemote" ./fcvv-ios/main.m || true

          echo "--- SDL Firebase imports ---"
          head -10 "$APPDELEGATE_FILE"

          echo "--- Callbacks FCM ---"
          grep -n "APNS token recu\|didRegisterForRemoteNotificationsWithDeviceToken\|willPresentNotification\|FIRMessaging" "$APPDELEGATE_FILE" || true

          echo "--- Structure fin SDLUIKitDelegate ---"
          grep -n "@implementation SDLUIKitDelegate\|@end" "$APPDELEGATE_FILE" | tail -10
          
          echo -e "\n--- Vérification SDL_uikitappdelegate.h ---"

          HEADER_FILE=$(find . -name "SDL_uikitappdelegate.h" | head -1)

          echo "HEADER_FILE=$HEADER_FILE"

          grep -n "@interface SDLUIKitDelegate" "$HEADER_FILE" || true
          grep -n "UNUserNotificationCenterDelegate" "$HEADER_FILE" || true
          grep -n "UserNotifications" "$HEADER_FILE" || true

          echo -e "\n--- Début du header ---"
          head -30 "$HEADER_FILE"
          
          echo -e "\n--- Vérification SDL_uikitappdelegate.h ---"

          grep -n "UserNotifications" "$HEADER_FILE" || true
          grep -n "@interface SDLUIKitDelegate" "$HEADER_FILE" || true

      - name: Configure Xcode Entitlements for Push
        run: |
          set -euxo pipefail

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          ENTITLEMENTS_PATH="$PROJ_DIR/fcvv.entitlements"
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          cat > "$ENTITLEMENTS_PATH" <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
            <key>aps-environment</key>
            <string>development</string>
            </dict>
            </plist>
          EOF

          echo "--- Contenu entitlements ---"
          cat "$ENTITLEMENTS_PATH"

          echo "--- Validation plist ---"
          plutil -lint "$ENTITLEMENTS_PATH"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          file = project.main_group.find_file_by_path('fcvv.entitlements') ||
          project.main_group.new_file('fcvv.entitlements')

          target.build_configurations.each do |config|
          config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'fcvv.entitlements'
          end

          project.save
          "

      - name: Verify Entitlements
        run: |
          echo "--- Contenu de fcvv.entitlements ---"
          cat ./fcvv-ios/fcvv.entitlements
          

      - name: Configure and Install Pods
        run: |
          set -euxo pipefail
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          PROJ_NAME=$(basename "$PROJECT_FILE")
          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 -name "*-Info.plist" | grep -v "GoogleService" | head -1)
          
          # Ajout d'une sécurité pour vérifier qu'on a bien trouvé le bon fichier
          echo "Plist détecté : $PLIST_FILE"
          if [[ "$PLIST_FILE" != *"Info.plist" ]]; then
            echo "Erreur : Impossible de localiser le Info.plist principal."
            exit 1
          fi
          plutil -convert xml1 "$PLIST_FILE"
          
          # --- GESTION DE LA VERSION DE L'APP ---
          # 1. Version commerciale / Marketing (ex: 1.0.0)
          /usr/libexec/PlistBuddy -c "Delete :CFBundleShortVersionString" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1.0" "$PLIST_FILE"

          # 2. Numéro de Build interne (ex: 2 ou ${{ github.run_number }})
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST_FILE"
          # --------------------------------------
          
          
          
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier org.fcvv.fcvv" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string FCVV" "$PLIST_FILE"
          
          
          # Réinstallation du catalogue d'icônes iOS
          if [ -d "assets/Images.xcassets" ]; then
            echo "[iOS] Installation Images.xcassets"
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            cp -R assets/Images.xcassets "$PROJ_DIR/fcvv/"
            
            echo "===== Vérification Images.xcassets ====="
            find "$PROJ_DIR/fcvv/Images.xcassets" -maxdepth 2
            
            echo "===== Vérification AppIcon ====="
            find "$PROJ_DIR/fcvv/Images.xcassets/AppIcon.appiconset"
          else
            echo "[iOS] Images.xcassets introuvable"
          fi
          
          cat > "$PROJ_DIR/Podfile" <<EOF
          platform :ios, '13.0'
          use_frameworks!
          use_modular_headers!
          project '$PROJ_NAME'
          target 'fcvv' do
            pod 'FirebaseCore', '10.29.0'
            pod 'FirebaseMessaging', '10.29.0'
          end
          EOF
          cd "$PROJ_DIR"
          pod deintegrate
          pod install --repo-update
          
          
          
          ls -la
          ls Pods
          ls *.xcworkspace
          sed -i '' 's/OTHER_LDFLAGS = "-all_load";/OTHER_LDFLAGS = "$(inherited) -ObjC -all_load";/g' fcvv.xcodeproj/project.pbxproj

      - name: Configure iOS Launch Screen (Presplash)
        run: |
          set -euxo pipefail

          echo "===== Configuration du Launch Screen iOS ====="

          # ------------------------------------------------------------
          # 0. Détection du projet Xcode
          # ------------------------------------------------------------

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun fichier .xcodeproj trouvé"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJECT_FILE")
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "FULL_PROJECT_PATH=$FULL_PROJECT_PATH"

          # ------------------------------------------------------------
          # 1. Définition des chemins
          # ------------------------------------------------------------

          PRESPLASH_SOURCE="$PWD/assets/logo_apk_fcvv.png"

          APP_DIR="$PROJ_DIR/fcvv"

          ASSETS_DIR="$APP_DIR/Images.xcassets"

          IMAGESET_DIR="$ASSETS_DIR/fcvv_launch_logo.imageset"

          IMAGE_DEST="$IMAGESET_DIR/fcvv_launch_logo.png"

          # IMPORTANT :
          # Le storyboard est à la RACINE de fcvv-ios
          # car Xcode le cherche ici.
          LAUNCH_STORYBOARD="$PROJ_DIR/LaunchScreen.storyboard"

          echo "PRESPLASH_SOURCE=$PRESPLASH_SOURCE"
          echo "IMAGE_DEST=$IMAGE_DEST"
          echo "LAUNCH_STORYBOARD=$LAUNCH_STORYBOARD"

          # ------------------------------------------------------------
          # 2. Vérification image source
          # ------------------------------------------------------------

          echo "===== Vérification image source ====="

          if [ ! -f "$PRESPLASH_SOURCE" ]; then
            echo "ERREUR : image source introuvable :"
            echo "$PRESPLASH_SOURCE"
            exit 1
          fi

          python3 - "$PRESPLASH_SOURCE" <<'PY'
          from PIL import Image
          import sys

          path = sys.argv[1]
          image = Image.open(path)

          print(f"Image source : {path}")
          print(f"Dimensions   : {image.size}")
          print(f"Mode         : {image.mode}")

          if image.size != (512, 512):
              raise SystemExit(
                  f"ERREUR : dimensions attendues 512x512, "
                  f"mais trouvées {image.size}"
              )
          PY

          # ------------------------------------------------------------
          # 3. Nettoyage physique des anciennes ressources
          # ------------------------------------------------------------

          echo "===== Nettoyage anciennes ressources physiques ====="

          # Anciennes images éventuelles
          rm -f "$APP_DIR/logo_apk_fcvv.png"
          rm -f "$APP_DIR/fcvv_launch_logo.png"
          rm -f "$PROJ_DIR/logo_apk_fcvv.png"
          rm -f "$PROJ_DIR/fcvv_launch_logo.png"

          # Anciennes imagesets
          rm -rf "$ASSETS_DIR/logo_apk_fcvv.imageset"
          rm -rf "$ASSETS_DIR/fcvv_launch_logo.imageset"

          # Ancien storyboard dans fcvv/
          rm -f "$APP_DIR/LaunchScreen.storyboard"

          # Ancien storyboard à la racine : on le recréera proprement
          rm -f "$PROJ_DIR/LaunchScreen.storyboard"

          # Ancien storyboard avec espace
          rm -f "$PROJ_DIR/Storyboards/Launch Screen.storyboard"

          echo "Anciennes ressources physiques supprimées."

          # ------------------------------------------------------------
          # 4. Création du imageset
          # ------------------------------------------------------------

          echo "===== Création du imageset ====="

          mkdir -p "$IMAGESET_DIR"

          cp -f "$PRESPLASH_SOURCE" "$IMAGE_DEST"

          cat > "$IMAGESET_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "fcvv_launch_logo.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          echo "Imageset créé :"
          echo "$IMAGESET_DIR"

          # ------------------------------------------------------------
          # 5. Création du LaunchScreen.storyboard
          # ------------------------------------------------------------

          echo "===== Création LaunchScreen.storyboard ====="

          cat > "$LAUNCH_STORYBOARD" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
                    version="3.0"
                    toolsVersion="23504"
                    targetRuntime="iOS.CocoaTouch"
                    propertyAccessControl="none"
                    useAutolayout="YES"
                    launchScreen="YES"
                    useTraitCollections="YES"
                    useSafeAreas="YES"
                    colorMatched="YES">

              <device id="retina6_12"
                      orientation="portrait"
                      appearance="light"/>

              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin"
                          version="23506"/>
                  <capability name="Safe area layout guides"
                              minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format"
                              minToolsVersion="8.0"/>
              </dependencies>

              <scenes>

                  <scene sceneID="LaunchScreenScene">

                      <objects>

                          <viewController
                              id="LaunchScreenViewController"
                              sceneMemberID="viewController">

                              <view
                                  key="view"
                                  contentMode="scaleToFill"
                                  id="LaunchScreenView">

                                  <rect key="frame"
                                        x="0.0"
                                        y="0.0"
                                        width="393"
                                        height="852"/>

                                  <autoresizingMask
                                      key="autoresizingMask"
                                      widthSizable="YES"
                                      heightSizable="YES"/>

                                  <subviews>

                                      <imageView
                                          clipsSubviews="YES"
                                          userInteractionEnabled="NO"
                                          contentMode="scaleAspectFit"
                                          horizontalHuggingPriority="251"
                                          verticalHuggingPriority="251"
                                          image="fcvv_launch_logo"
                                          translatesAutoresizingMaskIntoConstraints="NO"
                                          id="LaunchLogo">

                                          <rect key="frame"
                                                x="96.5"
                                                y="326"
                                                width="200"
                                                height="200"/>

                                      </imageView>

                                  </subviews>

                                  <viewLayoutGuide
                                      key="safeArea"
                                      id="SafeArea"/>

                                  <color
                                      key="backgroundColor"
                                      red="0.117647"
                                      green="0.227451"
                                      blue="0.541176"
                                      alpha="1"
                                      colorSpace="custom"
                                      customColorSpace="sRGB"/>

                                  <constraints>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerX"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerX"
                                          id="CenterX"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerY"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerY"
                                          id="CenterY"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="width"
                                          constant="200"
                                          id="LogoWidth"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="height"
                                          constant="200"
                                          id="LogoHeight"/>

                                  </constraints>

                              </view>

                              <viewControllerLayoutGuide
                                  type="top"
                                  id="TopGuide"/>

                              <viewControllerLayoutGuide
                                  type="bottom"
                                  id="BottomGuide"/>

                          </viewController>

                          <placeholder
                              placeholderIdentifier="IBFirstResponder"
                              id="FirstResponder"
                              sceneMemberID="firstResponder"/>

                      </objects>

                      <point
                          key="canvasLocation"
                          x="0.0"
                          y="0.0"/>

                  </scene>

              </scenes>

              <resources>

                  <image
                      name="fcvv_launch_logo"
                      width="512"
                      height="512"/>

              </resources>

          </document>
          EOF

          echo "LaunchScreen.storyboard créé : $LAUNCH_STORYBOARD"

          # ------------------------------------------------------------
          # 6. Nettoyage et configuration du projet Xcode
          # ------------------------------------------------------------

          echo "===== Nettoyage des références Xcode ====="

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts 'Target trouvé : ' + target.name

          # ----------------------------------------------------------
          # Supprimer toutes les anciennes références du presplash
          # ----------------------------------------------------------

          project.files.to_a.each do |file|

            path = file.path.to_s
            basename = File.basename(path)

            remove = [
              'logo_apk_fcvv.png',
              'fcvv_launch_logo.png',
              'LaunchScreen.storyboard',
              'Launch Screen.storyboard'
            ].include?(basename)

            next unless remove

            puts 'Suppression référence : ' + path

            target.resources_build_phase.files.to_a.each do |build_file|
              if build_file.file_ref == file
                target.resources_build_phase.remove_build_file(build_file)
              end
            end

            file.remove_from_project
          end

          # ----------------------------------------------------------
          # Groupe principal
          # ----------------------------------------------------------

          app_group = project.main_group.find_subpath('fcvv', true)

          raise 'Groupe fcvv introuvable' unless app_group

          # ----------------------------------------------------------
          # IMPORTANT :
          #
          # Le PNG est dans Images.xcassets.
          #
          # Il n'est donc PAS ajouté individuellement au target.
          # ----------------------------------------------------------

          # ----------------------------------------------------------
          # Ajouter le storyboard depuis la racine du projet
          # ----------------------------------------------------------

          storyboard_file = project.main_group.new_file(
            'LaunchScreen.storyboard'
          )

          target.resources_build_phase.add_file_reference(
            storyboard_file,
            true
          )

          puts 'LaunchScreen.storyboard ajouté au target.'

          # ----------------------------------------------------------
          # Configuration Build Settings
          # ----------------------------------------------------------

          target.build_configurations.each do |config|

            config.build_settings['UILAUNCHSTORYBOARDNAME'] = 'LaunchScreen'

            puts(
              config.name +
              ' : UILAUNCHSTORYBOARDNAME = ' +
              config.build_settings['UILAUNCHSTORYBOARDNAME'].to_s
            )

          end

          project.save

          puts 'Projet Xcode sauvegardé.'
          "

          # ------------------------------------------------------------
          # 7. Recherche Info.plist
          # ------------------------------------------------------------

          echo "===== Recherche Info.plist ====="

          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 \
            -name "*-Info.plist" \
            ! -name "GoogleService-Info.plist" \
            -print -quit)

          if [ -z "$PLIST_FILE" ] || [ ! -f "$PLIST_FILE" ]; then
            echo "ERREUR : Info.plist introuvable"
            exit 1
          fi

          echo "Info.plist utilisé : $PLIST_FILE"

          # ------------------------------------------------------------
          # 8. Configuration Info.plist
          # ------------------------------------------------------------

          echo "===== Configuration Info.plist ====="

          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchStoryboardName" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UILaunchStoryboardName string LaunchScreen" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchScreen" \
            "$PLIST_FILE" 2>/dev/null || true

          echo "===== Validation Info.plist ====="

          plutil -lint "$PLIST_FILE"

          # ------------------------------------------------------------
          # 9. Vérification physique du imageset
          # ------------------------------------------------------------

          echo "===== Vérification Images.xcassets ====="

          if [ ! -f "$IMAGE_DEST" ]; then
            echo "ERREUR : PNG absent : $IMAGE_DEST"
            exit 1
          fi

          if [ ! -f "$IMAGESET_DIR/Contents.json" ]; then
            echo "ERREUR : Contents.json absent"
            exit 1
          fi

          ls -lh "$IMAGE_DEST"

          python3 - "$IMAGE_DEST" <<'PY'
          from PIL import Image
          import sys

          path = sys.argv[1]
          image = Image.open(path)

          print(f"Image finale : {path}")
          print(f"Dimensions   : {image.size}")
          print(f"Mode         : {image.mode}")

          if image.size != (512, 512):
              raise SystemExit(
                  "ERREUR : image finale non 512x512"
              )
          PY

          # ------------------------------------------------------------
          # 10. Vérification storyboard
          # ------------------------------------------------------------

          echo "===== Vérification storyboard ====="

          if [ ! -f "$LAUNCH_STORYBOARD" ]; then
            echo "ERREUR : LaunchScreen.storyboard absent"
            exit 1
          fi

          grep -n "fcvv_launch_logo" "$LAUNCH_STORYBOARD"

          # ------------------------------------------------------------
          # 11. Vérification Xcode finale
          # ------------------------------------------------------------

          echo "===== Vérification Xcode ====="

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts '===== Build Settings ====='

          target.build_configurations.each do |config|

            puts(
              config.name +
              ' = ' +
              config.build_settings['UILAUNCHSTORYBOARDNAME'].to_s
            )

          end

          puts '===== Ressources target ====='

          target.resources_build_phase.files_references.each do |file|
            puts file.real_path.to_s
          end

          puts '===== Vérification LaunchScreen ====='

          storyboard_refs = target.resources_build_phase.files_references.select do |file|
            File.basename(file.path.to_s) == 'LaunchScreen.storyboard'
          end

          if storyboard_refs.empty?
            raise 'ERREUR : LaunchScreen.storyboard absent du target'
          end

          if storyboard_refs.length > 1
            raise 'ERREUR : plusieurs LaunchScreen.storyboard détectés'
          end

          storyboard_path = storyboard_refs.first.real_path.to_s

          unless File.exist?(storyboard_path)
            raise 'ERREUR : fichier physique LaunchScreen.storyboard introuvable : ' + storyboard_path
          end

          puts 'Storyboard Xcode OK : ' + storyboard_path

          puts '===== Vérification anciennes références ====='

          old_found = false

          project.files.each do |file|

            path = file.path.to_s
            basename = File.basename(path)

            if basename == 'logo_apk_fcvv.png'
              puts 'ERREUR : ancienne référence logo_apk_fcvv.png : ' + path
              old_found = true
            end

            if basename == 'Launch Screen.storyboard'
              puts 'ERREUR : ancienne référence Launch Screen.storyboard : ' + path
              old_found = true
            end

            # Le PNG physique est autorisé UNIQUEMENT dans le imageset.
            if basename == 'fcvv_launch_logo.png'
              expected = 'fcvv/Images.xcassets/fcvv_launch_logo.imageset/fcvv_launch_logo.png'

              unless path == expected
                puts 'ERREUR : fcvv_launch_logo.png hors imageset : ' + path
                old_found = true
              end
            end

          end

          raise 'Anciennes références détectées' if old_found

          puts 'Aucune ancienne référence détectée.'
          "

          # ------------------------------------------------------------
          # 12. Vérification finale des chemins
          # ------------------------------------------------------------

          echo "===== Vérification finale des chemins ====="

          echo "--- Storyboard ---"
          ls -lh "$PROJ_DIR/LaunchScreen.storyboard"

          echo "--- Imageset ---"
          find "$IMAGESET_DIR" -maxdepth 1 -type f -print

          echo "--- Recherche anciens fichiers ---"

          if find "$PROJ_DIR" \
              -name "logo_apk_fcvv.png" \
              -o -name "Launch Screen.storyboard" \
              | grep -q .; then

            echo "ERREUR : ancienne ressource encore présente"
            find "$PROJ_DIR" \
              -name "logo_apk_fcvv.png" \
              -o -name "Launch Screen.storyboard"
            exit 1
          fi

          echo "Aucune ancienne ressource trouvée."

          echo "===== Configuration Launch Screen terminée ====="

      
      - name: Debug Project State
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "===== DEBUG ÉTAT DU PROJET iOS AVANT BUILD ====="
          echo "============================================================"

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun .xcodeproj trouvé"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJECT_FILE")
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "FULL_PROJECT_PATH=$FULL_PROJECT_PATH"

          # ------------------------------------------------------------
          # 1. Arborescence projet
          # ------------------------------------------------------------

          echo ""
          echo "===== Arborescence dans le dossier projet ====="

          find "$PROJ_DIR" -maxdepth 4 -print | sort

          # ------------------------------------------------------------
          # 2. Vérification Launch Screen
          # ------------------------------------------------------------

          echo ""
          echo "===== Launch Screen ====="

          echo "--- Fichiers LaunchScreen ---"

          find "$PROJ_DIR" \
            \( -name "LaunchScreen.storyboard" \
            -o -name "Launch Screen.storyboard" \) \
            -print

          echo "--- Références launch storyboard dans project.pbxproj ---"

          grep -n -E \
            "LaunchScreen|Launch Screen|UILAUNCHSTORYBOARDNAME|UIMainStoryboardFile|NSMainStoryboardFile" \
            "$PROJECT_FILE/project.pbxproj" || true

          # ------------------------------------------------------------
          # 3. Vérification du PNG / Assets
          # ------------------------------------------------------------

          echo ""
          echo "===== Presplash / Assets ====="

          find "$PROJ_DIR" \
            \( -name "logo_apk_fcvv.png" \
            -o -name "fcvv_launch_logo.png" \
            -o -name "fcvv_launch_logo.imageset" \) \
            -print

          echo "--- Images.xcassets ---"

          find "$PROJ_DIR/fcvv/Images.xcassets" \
            -maxdepth 3 \
            -print 2>/dev/null || true

          # ------------------------------------------------------------
          # 4. Info.plist
          # ------------------------------------------------------------

          echo ""
          echo "===== Info.plist ====="

          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 \
            -name "*-Info.plist" \
            ! -name "GoogleService-Info.plist" \
            -print -quit)

          if [ -n "$PLIST_FILE" ] && [ -f "$PLIST_FILE" ]; then

            echo "Info.plist trouvé : $PLIST_FILE"

            echo ""
            echo "--- Contenu Info.plist ---"

            /usr/libexec/PlistBuddy \
              -c "Print" \
              "$PLIST_FILE" || true

            echo ""
            echo "--- Launch configuration ---"

            echo "UILaunchStoryboardName:"
            /usr/libexec/PlistBuddy \
              -c "Print :UILaunchStoryboardName" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo "UIMainStoryboardFile:"
            /usr/libexec/PlistBuddy \
              -c "Print :UIMainStoryboardFile" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo "NSMainStoryboardFile:"
            /usr/libexec/PlistBuddy \
              -c "Print :NSMainStoryboardFile" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo "UIApplicationSceneManifest:"
            /usr/libexec/PlistBuddy \
              -c "Print :UIApplicationSceneManifest" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo "UISceneConfigurations:"
            /usr/libexec/PlistBuddy \
              -c "Print :UIApplicationSceneManifest:UISceneConfigurations" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- Validation plist ---"

            plutil -lint "$PLIST_FILE"

          else

            echo "ATTENTION : aucun Info.plist trouvé"

          fi

          # ------------------------------------------------------------
          # 5. Build Settings Xcode
          # ------------------------------------------------------------

          echo ""
          echo "===== Build Settings Xcode ====="

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts 'Target : ' + target.name
          puts ''

          target.build_configurations.each do |config|

            puts '===== Configuration ' + config.name + ' ====='

            keys = [
              'PRODUCT_NAME',
              'PRODUCT_BUNDLE_IDENTIFIER',
              'INFOPLIST_FILE',
              'UILAUNCHSTORYBOARDNAME',
              'UIMAINSTORYBOARDFILE',
              'SWIFT_VERSION',
              'IPHONEOS_DEPLOYMENT_TARGET',
              'TARGETED_DEVICE_FAMILY',
              'SDKROOT',
              'OTHER_LDFLAGS',
              'OTHER_SWIFT_FLAGS',
              'GCC_PREPROCESSOR_DEFINITIONS'
            ]

            keys.each do |key|
              value = config.build_settings[key]

              puts key + ' = ' + value.to_s
            end

            puts ''
          end
          "

          # ------------------------------------------------------------
          # 6. Ressources du target
          # ------------------------------------------------------------

          echo ""
          echo "===== Ressources du target fcvv ====="

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          target.resources_build_phase.files_references.each do |file|

            puts file.real_path.to_s

          end
          "

          # ------------------------------------------------------------
          # 7. Recherche SDL
          # ------------------------------------------------------------

          echo ""
          echo "===== Recherche SDL ====="

          grep -Rni \
            -E "SDL_UIKitRunApp|SDLMain|SDL_main|SDL_SetMainReady|SDLAppDelegate" \
            "$PROJ_DIR" \
            --include="*.m" \
            --include="*.mm" \
            --include="*.h" \
            --include="*.swift" \
            --include="*.plist" \
            --exclude-dir=DerivedData \
            --exclude-dir=build \
            2>/dev/null || true

          # ------------------------------------------------------------
          # 8. Recherche UIApplication / UIScene
          # ------------------------------------------------------------

          echo ""
          echo "===== Recherche UIApplication / UIScene ====="

          grep -Rni \
            -E "UIApplicationMain|UIApplicationDelegate|UISceneDelegate|UISceneConfiguration|configurationForConnectingSceneSession" \
            "$PROJ_DIR" \
            --include="*.m" \
            --include="*.mm" \
            --include="*.h" \
            --include="*.swift" \
            --include="*.plist" \
            --exclude-dir=DerivedData \
            --exclude-dir=build \
            2>/dev/null || true

          # ------------------------------------------------------------
          # 9. Recherche Firebase
          # ------------------------------------------------------------

          echo ""
          echo "===== Recherche Firebase dans le dossier Pods ====="

          find "$PROJ_DIR/Pods" \
            -iname "*Firebase*" \
            -print 2>/dev/null || \
            echo "Dossier Pods non trouvé ou vide"

          # ------------------------------------------------------------
          # 10. LDFLAGS
          # ------------------------------------------------------------

          echo ""
          echo "===== Vérification LDFLAGS ====="

          grep -n "OTHER_LDFLAGS" \
            "$PROJECT_FILE/project.pbxproj" || true

          # ------------------------------------------------------------
          # 11. Podfile.lock
          # ------------------------------------------------------------

          echo ""
          echo "===== Podfile Lock ====="

          if [ -f "$PROJ_DIR/Podfile.lock" ]; then
            cat "$PROJ_DIR/Podfile.lock"
          else
            echo "Podfile.lock absent"
          fi

          # ------------------------------------------------------------
          # 12. Workspaces
          # ------------------------------------------------------------

          echo ""
          echo "===== Workspaces ====="

          find . -name "*.xcworkspace" -print

          # ------------------------------------------------------------
          # 13. Fichiers Swift / Objective-C principaux
          # ------------------------------------------------------------

          echo ""
          echo "===== Fichiers source iOS ====="

          find "$PROJ_DIR" \
            \( -name "*.swift" \
            -o -name "*.m" \
            -o -name "*.mm" \
            -o -name "*.h" \) \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print | sort

          # ------------------------------------------------------------
          # 14. Vérification spécifique du Launch Screen
          # ------------------------------------------------------------

          echo ""
          echo "===== Vérification finale Launch Screen ====="

          if [ -f "$PROJ_DIR/LaunchScreen.storyboard" ]; then

            echo "LaunchScreen.storyboard présent."

            echo "--- Référence image ---"

            grep -n \
              -E "fcvv_launch_logo|logo_apk_fcvv" \
              "$PROJ_DIR/LaunchScreen.storyboard" || true

          else

            echo "ERREUR : LaunchScreen.storyboard absent"

          fi

          # ------------------------------------------------------------
          # 15. Vérification imageset
          # ------------------------------------------------------------

          IMAGESET="$PROJ_DIR/fcvv/Images.xcassets/fcvv_launch_logo.imageset"

          echo ""
          echo "===== Vérification imageset ====="

          if [ -d "$IMAGESET" ]; then

            echo "Imageset : $IMAGESET"

            ls -lah "$IMAGESET"

            echo ""
            echo "--- Contents.json ---"

            cat "$IMAGESET/Contents.json"

          else

            echo "ERREUR : imageset absent : $IMAGESET"

          fi

          echo ""
          echo "============================================================"
          echo "===== FIN DEBUG ÉTAT DU PROJET ====="
          echo "============================================================"
          
      - name: Build simulator
        run: |
          set -euxo pipefail
          # 0. Installation des pods (Nécessaire avant tout build avec workspace)
          #pod install --project-directory=fcvv-ios

          WORKSPACE_PATH=$(find "$PWD/fcvv-ios" -name "*.xcworkspace" | head -1)
          
          # 1. Nettoyage
          xcrun simctl erase "iPhone 15" || true
          
          # 2. Build avec signature activée
          echo "Workspace = $WORKSPACE_PATH"

          ls -la fcvv-ios
          ls -la fcvv-ios/*.xcworkspace
          cat fcvv-ios/Podfile.lock
          
          xcodebuild -list \
            -workspace "$WORKSPACE_PATH"

          xcodebuild \
            -showBuildSettings \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv
          
          echo "===== BUILD SETTINGS ====="
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -showBuildSettings | grep CODE_SIGN_ENTITLEMENTS

          xcodebuild clean build \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CLANG_ENABLE_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -allowProvisioningUpdates
          
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "fcvv.app" -type d | grep "Debug-iphonesimulator" | head -1)
          echo "Debug: Chemin trouvé = $APP_PATH"
          
          echo "===== SIGNED ENTITLEMENTS ====="
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "fcvv.app" | head -1)

          echo "APP=$APP"
          codesign -d --entitlements :- "$APP" || true

          echo "===== EMBEDDED MOBILEPROVISION ====="
          find "$APP" -name "*.mobileprovision" -print || true

          echo "===== APP CONTENT ====="
          ls -la "$APP"
          
            
      - name: Package app
        run: |
          # 1. On cherche spécifiquement fcvv.app dans le dossier DerivedData 
          # C'est l'emplacement standard où Xcode place le build final
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "fcvv.app" -type d | grep "Build/Products/Debug-iphonesimulator" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Erreur: fcvv.app introuvable dans DerivedData"
            exit 1
          fi
          
          echo "Zippage de : $APP_PATH"
          
          # 2. On se déplace dans le dossier contenant l'app
          cd "$(dirname "$APP_PATH")"
          
          # 3. On crée le zip
          zip -r "$GITHUB_WORKSPACE/fcvv.zip" "fcvv.app"

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-app
          path: fcvv.zip
