name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios>=1.3.0" pillow requests urllib3

      - name: Create Kivy-iOS directory
        run: mkdir -p ~/.kivy-ios

      - name: Cache kivy-ios
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-kivy-ios-

      - name: Validate cache and Build
        run: |
          if [ ! -d "$HOME/.kivy-ios/build/python3" ]; then
            toolchain build python3 kivy openssl pillow pyyaml
          fi

      - name: Prepare sources
        run: |
          rm -rf ios_src
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" --exclude="ios_src" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist
          # Nettoyage des fichiers temporaires
          find ios_src -name "__pycache__" -type d -exec rm -rf {} +
          find ios_src -name "*.pyc" -delete

      - name: Create Xcode project and Pods
        run: |
          set -euxo pipefail
          toolchain create FCVV ios_src
          
          # 1. Recherche dynamique du dossier projet et du plist
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 -name "*-Info.plist" | head -n 1)
          
          echo "Dossier projet : $PROJ_DIR"
          echo "Plist détecté : $PLIST_FILE"
          
          # 2. Conversion XML et mise à jour de l'ID
          plutil -convert xml1 "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier 'org.fcvv.fcvv'" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSupportsIndirectInputEvents bool true" "$PLIST_FILE" 2>/dev/null || true
          
          # 3. Injection automatique de Firebase dans le code natif (main.m)
          # Utilisation de la syntaxe BSD sed compatible macOS
          sed -i '' '1i\
          #import <FirebaseCore/FirebaseCore.h>
          ' "$PROJ_DIR/main.m"
          
          sed -i '' '/int main/a\
              [FIRApp configure];
          ' "$PROJ_DIR/main.m"
          
          # 4. Gestion des icônes
          if [ -d "assets/Images.xcassets" ]; then
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            cp -r "assets/Images.xcassets" "$PROJ_DIR/fcvv/"
            
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string 'AppIcon'" "$PLIST_FILE" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName 'AppIcon'" "$PLIST_FILE"
          fi
          
          # 5. Création du Podfile
          cat > "$PROJ_DIR/Podfile" <<'EOF'
          platform :ios, '13.0'
          use_modular_headers! 
          project 'fcvv.xcodeproj'

          target 'fcvv' do
            pod 'FirebaseCore', '10.28.0'
            pod 'FirebaseMessaging', '10.28.0'
            pod 'GoogleUtilities', :modular_headers => true
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -ObjC -all_load -lc++'
              end
            end
          end
          EOF
          
          # 6. Installation des pods
          rm -rf "$PROJ_DIR/Pods" "$PROJ_DIR/Podfile.lock"
          cd "$PROJ_DIR" && pod install

      - name: Build simulator
        run: |
          set -euxo pipefail
          WORKSPACE_PATH=$(find "$PWD" -name "*.xcworkspace" | head -1)
          xcrun simctl erase "iPhone 15"
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme "fcvv" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     OTHER_LDFLAGS='$(inherited) -ObjC -all_load -lc++' \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package app
        run: |
          # 1. On trouve le dossier .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          
          # 2. On se déplace dans le répertoire parent pour que le zip 
          # contienne le dossier .app et non tout le chemin absolu
          cd "$(dirname "$APP_PATH")"
          
          # 3. Zip sans -j (junk paths)
          zip -r "$GITHUB_WORKSPACE/fcvv.zip" "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-app
          path: fcvv.zip