name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    env:
      IOS_DEPLOYMENT_TARGET: "15.0"
      APP_BUNDLE_ID: "org.fcvv.fcvv"
      APP_VERSION: "1.1.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PURE_PYTHON: "1"

      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          sudo xcodebuild -license accept
          xcodebuild -version
          xcode-select -p
          xcrun --find clang
          xcrun --find swift
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          
      - name: Install and verify Metal Toolchain
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== XCODE ==="
          xcodebuild -version
          xcode-select -p
          echo "=== INSTALL METAL TOOLCHAIN ==="
          xcodebuild -downloadComponent MetalToolchain
          echo "=== VERIFY METAL ==="
          xcrun --find metal
          xcrun metal --version
      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
      # ============================================================
      # 3. SYSTEM TOOLS
      # ============================================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios==2025.5.17" pillow requests urllib3 pyyaml fpdf2 fonttools plyer pyobjus
          ruby -e 'require "xcodeproj"; puts "xcodeproj OK"'
      # ============================================================
      # 4. CREATE FCVV SDL PATCHER
      # ============================================================
      - name: Create FCVV SDL patcher
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/apply_fcvv_patch.py" <<'PY'
          import re
          import sys
          from pathlib import Path

          MARKER = "FCVV_FCM_CONFIGURATION_V1"
          CALL = "[self fcvvConfigureFirebaseAndNotifications];"

          if len(sys.argv) != 2:
              raise SystemExit(
                  "Usage: apply_fcvv_patch.py SDL_uikitappdelegate.m"
              )

          m_path = Path(sys.argv[1]).resolve()

          if not m_path.is_file():
              raise SystemExit(f"❌ Fichier introuvable : {m_path}")

          if m_path.name != "SDL_uikitappdelegate.m":
              raise SystemExit(
                  f"❌ Fichier inattendu : {m_path.name}"
              )

          # ============================================================
          # RECHERCHE DU HEADER COMPAGNON
          # ============================================================

          h_path = m_path.with_suffix(".h")

          if not h_path.is_file():
              candidates = list(
                  m_path.parent.rglob("SDL_uikitappdelegate.h")
              )

              if not candidates:
                  raise SystemExit(
                      "❌ SDL_uikitappdelegate.h introuvable"
                  )

              h_path = candidates[0].resolve()

          print(f"✓ SDL .m : {m_path}")
          print(f"✓ SDL .h : {h_path}")

          # ============================================================
          # LECTURE
          # ============================================================

          h_text = h_path.read_text(encoding="utf-8")
          m_text = m_path.read_text(encoding="utf-8")

          # ============================================================
          # VERIFICATION SDLUIKitDelegate
          # ============================================================

          if not re.search(
              r"@interface\s+SDLUIKitDelegate\b",
              h_text
          ):
              raise SystemExit(
                  "❌ SDLUIKitDelegate absent du header"
              )

          if not re.search(
              r"@implementation\s+SDLUIKitDelegate\b",
              m_text
          ):
              raise SystemExit(
                  "❌ SDLUIKitDelegate absent du .m"
              )

          if "didFinishLaunchingWithOptions" not in m_text:
              raise SystemExit(
                  "❌ didFinishLaunchingWithOptions absent du .m"
              )

          # ============================================================
          # HEADER
          #
          # IMPORTANT :
          # NE PAS importer Firebase dans SDL_uikitappdelegate.h.
          #
          # Ce header est inclus par plusieurs fichiers SDL :
          # SDL_uikitwindow.m
          # SDL_uikitview.m
          # SDL_uikitvideo.m
          # etc.
          #
          # Les imports Firebase doivent rester exclusivement dans .m.
          # ============================================================

          header_imports_to_remove = [
              "#import <FirebaseCore/FirebaseCore.h>",
              "#import <FirebaseMessaging/FirebaseMessaging.h>",
          ]

          for imp in header_imports_to_remove:
              h_text = h_text.replace(imp + "\n", "")
              h_text = h_text.replace(imp, "")

          # UIKit est normalement déjà présent dans le header SDL.
          # On le conserve s'il existe et on l'ajoute uniquement
          # s'il est nécessaire.
          if "#import <UIKit/UIKit.h>" not in h_text:
              h_text = (
                  "#import <UIKit/UIKit.h>\n"
                  + h_text
              )

          # ============================================================
          # FORWARD DECLARATIONS DES PROTOCOLES
          # ============================================================

          protocol_declarations = (
              "@protocol UNUserNotificationCenterDelegate;\n"
              "@protocol FIRMessagingDelegate;\n"
          )

          if "@protocol UNUserNotificationCenterDelegate;" not in h_text:
              h_text = (
                  protocol_declarations
                  + "\n"
                  + h_text
              )

          elif "@protocol FIRMessagingDelegate;" not in h_text:
              h_text = (
                  "@protocol FIRMessagingDelegate;\n"
                  + h_text
              )

          # ============================================================
          # PROTOCOLES SDLUIKitDelegate
          # ============================================================

          interface_match = re.search(
              r"(@interface\s+SDLUIKitDelegate\b[^\n]*)(\n)",
              h_text
          )

          if not interface_match:
              raise SystemExit(
                  "❌ Interface SDLUIKitDelegate introuvable"
              )

          interface_line = interface_match.group(1)

          protocol_match = re.search(
              r"<([^>]*)>",
              interface_line
          )

          protocols = []

          if protocol_match:
              protocols = [
                  p.strip()
                  for p in protocol_match.group(1).split(",")
                  if p.strip()
              ]

          for protocol in [
              "UNUserNotificationCenterDelegate",
              "FIRMessagingDelegate",
          ]:
              if protocol not in protocols:
                  protocols.append(protocol)

          # Supprime une éventuelle ancienne liste de protocoles
          # avant de la reconstruire proprement.
          interface_without_protocols = re.sub(
              r"\s*<[^>]*>",
              "",
              interface_line
          ).rstrip()

          new_interface = (
              interface_without_protocols
              + " <"
              + ", ".join(protocols)
              + ">"
          )

          h_text = (
              h_text[:interface_match.start(1)]
              + new_interface
              + h_text[interface_match.end(1):]
          )

          # ============================================================
          # IMPLEMENTATION (.m)
          #
          # Les imports Firebase sont UNIQUEMENT ici.
          # ============================================================

          implementation_imports = [
              "#import <UIKit/UIKit.h>",
              "#import <UserNotifications/UserNotifications.h>",
              "#import <FirebaseCore/FirebaseCore.h>",
              "#import <FirebaseMessaging/FirebaseMessaging.h>",
          ]

          for imp in implementation_imports:
              if imp not in m_text:
                  m_text = imp + "\n" + m_text

          # ============================================================
          # BLOC FIREBASE / APNs
          # ============================================================

          if MARKER not in m_text:

              block = r'''
          // ==========================================================
          // FCVV_FCM_CONFIGURATION_V1
          // ==========================================================

          - (void)fcvvConfigureFirebaseAndNotifications {

              NSLog(@"[FCVV] Configuration Firebase/APNs");

              if ([FIRApp defaultApp] == nil) {
                  [FIRApp configure];
                  NSLog(@"[FCVV] Firebase configuré");
              }

              [FIRMessaging messaging].delegate = self;

              UNUserNotificationCenter *center =
                  [UNUserNotificationCenter currentNotificationCenter];

              center.delegate = self;

              [center requestAuthorizationWithOptions:
                  (UNAuthorizationOptionAlert |
                   UNAuthorizationOptionSound |
                   UNAuthorizationOptionBadge)

                  completionHandler:^(BOOL granted,
                                      NSError * _Nullable error) {

                      if (error) {
                          NSLog(
                              @"[FCVV] ❌ Erreur autorisation notifications : %@",
                              error
                          );
                      }

                      NSLog(
                          @"[FCVV] Autorisation notifications : %@",
                          granted ? @"GRANTED" : @"DENIED"
                      );

                      dispatch_async(
                          dispatch_get_main_queue(),
                          ^{

                              [[UIApplication sharedApplication]
                                  registerForRemoteNotifications];

                          }
                      );
                  }
              ];
          }

          - (void)messaging:(FIRMessaging *)messaging
              didReceiveRegistrationToken:(NSString *)fcmToken {

              NSLog(
                  @"[FCVV] FCM token reçu : %@",
                  fcmToken
              );

              if (fcmToken.length > 0) {

                  [[NSNotificationCenter defaultCenter]
                      postNotificationName:@"FCVV_FCM_TOKEN"
                      object:nil
                      userInfo:@{
                          @"token": fcmToken
                      }
                  ];
              }
          }

          - (void)application:(UIApplication *)application
              didRegisterForRemoteNotificationsWithDeviceToken:(NSData *)deviceToken {

              NSLog(
                  @"[FCVV] APNs device token reçu"
              );

              if (deviceToken) {

                  [[FIRMessaging messaging]
                      setAPNSToken:deviceToken];
              }
          }

          - (void)application:(UIApplication *)application
              didFailToRegisterForRemoteNotificationsWithError:(NSError *)error {

              NSLog(
                  @"[FCVV] ❌ Échec APNs : %@",
                  error
              );
          }

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
              willPresentNotification:(UNNotification *)notification
              withCompletionHandler:
                  (void (^)(UNNotificationPresentationOptions options))
                      completionHandler {

              NSLog(
                  @"[FCVV] Notification reçue au premier plan"
              );

              completionHandler(
                  UNNotificationPresentationOptionAlert |
                  UNNotificationPresentationOptionSound |
                  UNNotificationPresentationOptionBadge
              );
          }

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
              didReceiveNotificationResponse:(UNNotificationResponse *)response
              withCompletionHandler:(void (^)(void))completionHandler {

              NSLog(
                  @"[FCVV] Réponse à une notification reçue"
              );

              completionHandler();
          }

          - (void)application:(UIApplication *)application
              didReceiveRemoteNotification:(NSDictionary *)userInfo
              fetchCompletionHandler:
                  (void (^)(UIBackgroundFetchResult))
                      completionHandler {

              NSLog(
                  @"[FCVV] Notification distante reçue"
              );

              completionHandler(
                  UIBackgroundFetchResultNoData
              );
          }
          '''

              # --------------------------------------------------------
              # Insérer avant le @end FINAL.
              # --------------------------------------------------------

              end_matches = list(
                  re.finditer(
                      r"\n@end\s*$",
                      m_text,
                      re.MULTILINE
                  )
              )

              if not end_matches:
                  raise SystemExit(
                      "❌ @end final introuvable dans SDLUIKitDelegate"
                  )

              end_match = end_matches[-1]

              m_text = (
                  m_text[:end_match.start()]
                  + "\n"
                  + block
                  + "\n"
                  + m_text[end_match.start():]
              )

              print("✓ Bloc Firebase/APNs injecté")

          else:
              print("✓ Bloc Firebase déjà présent")

          # ============================================================
          # APPEL DEPUIS didFinishLaunchingWithOptions
          # ============================================================

          if CALL not in m_text:

              launch_pattern = re.compile(
                  r"("
                  r"-\s*\(BOOL\)\s*application\s*:"
                  r"\s*\(UIApplication\s*\*\)\s*application"
                  r"\s*didFinishLaunchingWithOptions\s*:"
                  r"\s*\(NSDictionary\s*\*\)\s*launchOptions"
                  r"\s*\{"
                  r")",
                  re.MULTILINE
              )

              match = launch_pattern.search(m_text)

              if not match:
                  raise SystemExit(
                      "❌ Signature didFinishLaunchingWithOptions "
                      "introuvable"
                  )

              m_text = (
                  m_text[:match.end()]
                  + "\n    "
                  + CALL
                  + "\n"
                  + m_text[match.end():]
              )

              print("✓ Appel Firebase ajouté au lancement")

          else:
              print("✓ Appel Firebase déjà présent")

          # ============================================================
          # ECRITURE
          # ============================================================

          h_path.write_text(
              h_text,
              encoding="utf-8"
          )

          m_path.write_text(
              m_text,
              encoding="utf-8"
          )

          # ============================================================
          # VERIFICATIONS FINALES
          # ============================================================

          final_h = h_path.read_text(
              encoding="utf-8"
          )

          final_m = m_path.read_text(
              encoding="utf-8"
          )

          # Firebase NE DOIT PAS être dans le header.
          if "FirebaseCore/FirebaseCore.h" in final_h:
              raise SystemExit(
                  "❌ ERREUR : FirebaseCore est encore importé dans le .h"
              )

          if "FirebaseMessaging/FirebaseMessaging.h" in final_h:
              raise SystemExit(
                  "❌ ERREUR : FirebaseMessaging est encore importé dans le .h"
              )

          # Firebase DOIT être dans le .m.
          if "FirebaseCore/FirebaseCore.h" not in final_m:
              raise SystemExit(
                  "❌ ERREUR : FirebaseCore absent du .m"
              )

          if "FirebaseMessaging/FirebaseMessaging.h" not in final_m:
              raise SystemExit(
                  "❌ ERREUR : FirebaseMessaging absent du .m"
              )

          if MARKER not in final_m:
              raise SystemExit(
                  "❌ ERREUR : marqueur Firebase absent du .m"
              )

          if CALL not in final_m:
              raise SystemExit(
                  "❌ ERREUR : appel Firebase absent du lancement"
              )

          if "UNUserNotificationCenterDelegate" not in final_h:
              raise SystemExit(
                  "❌ ERREUR : UNUserNotificationCenterDelegate absent du .h"
              )

          if "FIRMessagingDelegate" not in final_h:
              raise SystemExit(
                  "❌ ERREUR : FIRMessagingDelegate absent du .h"
              )

          print("✓ Header : aucun import Firebase")
          print("✓ Header : protocoles Firebase/APNs déclarés")
          print("✓ .m : FirebaseCore importé")
          print("✓ .m : FirebaseMessaging importé")
          print("✓ Bloc Firebase/APNs présent")
          print("✓ Appel Firebase au lancement présent")
          print("✓ SDLUIKitDelegate patché avec succès")
          PY

          chmod +x "$GITHUB_WORKSPACE/apply_fcvv_patch.py"

          python3 -m py_compile \
            "$GITHUB_WORKSPACE/apply_fcvv_patch.py"

          echo "✓ apply_fcvv_patch.py prêt"

      # ============================================================
      # 5. BUILD KIVY-IOS + CREATE XCODE PROJECT
      # ============================================================
      - name: Build kivy-ios and create Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "  BUILD KIVY-IOS RECIPES"
          echo "============================================================"

          rm -rf build dist
          rm -rf ~/Library/Caches/pip

          toolchain build \
            hostpython3 \
            python3 \
            kivy \
            openssl \
            pillow \
            pyobjus

          echo "============================================================"
          echo "  INSTALL PYTHON PACKAGES"
          echo "============================================================"

          toolchain pip install \
            pyyaml \
            requests \
            urllib3 \
            plyer \
            defusedxml

          toolchain pip install \
            --no-deps \
            fpdf2 \
            fonttools

          echo "============================================================"
          echo "  CLEANUP PYTHON NATIVE EXTENSIONS"
          echo "============================================================"

          find dist/root/python3/lib/python3.11/site-packages/ \
            -name "_yaml*.so" \
            -delete \
            -o \
            -name "*.so" \
            -delete

          rm -rf \
            dist/root/python3/lib/python3.11/site-packages/plyer/platforms/ios/frameworks

          echo "  FIX FONTTOOLS BEZIERTOOLS CYTHON CRASH ON IOS"
          find dist/root/python3/lib/python3.11/site-packages/fontTools/misc/ -name "bezierTools*" -not -name "*.py" -delete
          rm -f dist/root/python3/lib/python3.11/site-packages/fontTools/misc/*bezierTools*.so

          echo "============================================================"
          echo "  PREPARE IOS SOURCES"
          echo "============================================================"

          rm -rf ios_src
          mkdir -p ios_src

          rsync -a \
            --exclude={.git,.github,.buildozer,bin,build,dist,ios_src,__pycache__,*.pyc} \
            ./ \
            ios_src/

          echo "✓ ios_src préparé"

          echo "============================================================"
          echo "  CREATE FCVV XCODE PROJECT"
          echo "============================================================"

          toolchain create FCVV ios_src

          PROJECT_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -name "*.xcodeproj" \
              -type d \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ Aucun .xcodeproj trouvé"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -name "*.xcodeproj" \
              -print
            exit 1
          fi

          echo "✓ Xcode project : $PROJECT_FILE"

          PROJ_DIR="$(dirname "$PROJECT_FILE")"

          echo "✓ Project directory : $PROJ_DIR"

          echo "============================================================"
          echo "  VERIFY TARGET"
          echo "============================================================"

          xcodebuild \
            -project "$PROJECT_FILE" \
            -list
      # ============================================================
      # 6. FIREBASE + GOOGLE SERVICE + COCOAPODS
      # ============================================================
      - name: Configure Firebase and install Pods
        shell: bash
        env:
          FIREBASE_IOS_CONFIG: ${{ secrets.FIREBASE_IOS_CONFIG }}
          TARGET_NAME: fcvv
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "  FIREBASE + COCOAPODS"
          echo "============================================================"

          # ========================================================
          # 6.0 RECHERCHE DU PROJET XCODE
          # ========================================================

          PROJECT_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -name "fcvv.xcodeproj" \
              -type d \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ fcvv.xcodeproj introuvable"
            exit 1
          fi

          PROJ_DIR="$(dirname "$PROJECT_FILE")"

          echo "✓ PROJECT_FILE = $PROJECT_FILE"
          echo "✓ PROJ_DIR     = $PROJ_DIR"

          cd "$PROJ_DIR"

          # ========================================================
          # 6.1 GOOGLE SERVICE INFO
          # ========================================================

          if [ -z "${FIREBASE_IOS_CONFIG:-}" ]; then
            echo "❌ FIREBASE_IOS_CONFIG est vide"
            exit 1
          fi

          GOOGLE_PLIST="$PROJ_DIR/GoogleService-Info.plist"

          printf '%s\n' \
            "$FIREBASE_IOS_CONFIG" \
            > "$GOOGLE_PLIST"

          if [ ! -s "$GOOGLE_PLIST" ]; then
            echo "❌ GoogleService-Info.plist vide"
            exit 1
          fi

          plutil -lint "$GOOGLE_PLIST"

          echo "✓ GoogleService-Info.plist créé"

          # ========================================================
          # 6.2 AJOUT GOOGLE SERVICE AU PROJET XCODE
          # ========================================================

          export PROJECT_FILE
          export PROJ_DIR
          export GOOGLE_PLIST
          export TARGET_NAME

          ruby <<'RUBY'
          require 'xcodeproj'
          require 'pathname'

          project_path = ENV['PROJECT_FILE']
          project_dir  = ENV['PROJ_DIR']
          plist_path   = ENV['GOOGLE_PLIST']
          target_name  = ENV['TARGET_NAME']

          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find do |t|
            t.name == target_name
          end

          abort "❌ Target #{target_name} introuvable" unless target

          puts "✓ Target trouvé : #{target.name}"

          relative_plist =
            Pathname.new(plist_path)
              .relative_path_from(Pathname.new(project_dir))
              .to_s

          file_ref = project.files.find do |file|
            file.path == relative_plist ||
            file.path == File.basename(plist_path)
          end

          unless file_ref
            file_ref = project.main_group.new_file(
              relative_plist
            )

            puts "✓ GoogleService-Info.plist ajouté au projet"
          else
            puts "✓ GoogleService-Info.plist déjà référencé"
          end

          resources_phase = target.resources_build_phase

          unless resources_phase.files.any? do |build_file|
            build_file.file_ref == file_ref
          end
            resources_phase.add_file_reference(file_ref)
            puts "✓ GoogleService-Info.plist ajouté aux Resources"
          else
            puts "✓ GoogleService-Info.plist déjà dans Resources"
          end

          project.save

          puts "✓ Projet Xcode sauvegardé"
          RUBY

          # ========================================================
          # 6.3 INFO.PLIST
          # ========================================================

          PLIST_FILE="$(
            find "$PROJ_DIR" \
              -maxdepth 1 \
              -name "*-Info.plist" \
              ! -name "GoogleService-Info.plist" \
              -type f \
              -print \
              -quit
          )"

          if [ -z "$PLIST_FILE" ]; then
            echo "❌ Info.plist principal introuvable"
            exit 1
          fi

          echo "✓ Info.plist = $PLIST_FILE"

          plutil -convert xml1 "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :UIStatusBarHidden" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIStatusBarHidden bool false" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :UIViewControllerBasedStatusBarAppearance" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIViewControllerBasedStatusBarAppearance bool false" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleShortVersionString" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string ${APP_VERSION}" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleVersion" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Camera access may be used by an integrated component of this app." \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string ${APP_BUNDLE_ID}" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string FCVV" \
            "$PLIST_FILE"

          plutil -lint "$PLIST_FILE"

          # ========================================================
          # 6.4 KIVY WINDOWED MODE
          # ========================================================

          MAIN_M_FILE="$(
            find "$PROJ_DIR" \
              -name "main.m" \
              -type f \
              -print \
              -quit
          )"

          if [ -z "$MAIN_M_FILE" ]; then
            echo "❌ main.m introuvable"
            exit 1
          fi

          python3 - "$MAIN_M_FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = (
              r'putenv\(\s*"IOS_IS_WINDOWED\s*=\s*(?:True|False)"\s*\);'
          )

          replacement = 'putenv("IOS_IS_WINDOWED=True");'

          content, count = re.subn(
              pattern,
              replacement,
              content
          )

          if count == 0:
              marker = '#import <UIKit/UIKit.h>'

              if marker not in content:
                  raise SystemExit(
                      "❌ UIKit import absent dans main.m"
                  )

              content = content.replace(
                  marker,
                  marker
                  + '\n\n'
                  + '// Force Kivy/SDL status bar\n'
                  + 'putenv("IOS_IS_WINDOWED=True");',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

          grep -q \
            'putenv("IOS_IS_WINDOWED=True");' \
            "$MAIN_M_FILE"

          echo "✓ IOS_IS_WINDOWED=True"

          # ========================================================
          # 6.5 IMAGES
          # ========================================================

          if [ -d "$GITHUB_WORKSPACE/assets/Images.xcassets" ]; then
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            mkdir -p "$PROJ_DIR/fcvv"

            cp -R \
              "$GITHUB_WORKSPACE/assets/Images.xcassets" \
              "$PROJ_DIR/fcvv/Images.xcassets"

            echo "✓ Images.xcassets installées"
          fi

          # ========================================================
          # 6.6 CORRECTION DES BUILD SETTINGS DU TARGET FCVV
          #
          # IMPORTANT :
          # CocoaPods génère ensuite ses propres xcconfig.
          # Le target fcvv doit conserver $(inherited).
          # ========================================================

          export PROJECT_FILE
          export TARGET_NAME

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = ENV['PROJECT_FILE']
          target_name  = ENV['TARGET_NAME']

          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find do |t|
            t.name == target_name
          end

          abort "❌ Target #{target_name} introuvable" unless target

          puts
          puts "=== CORRECTION DES BUILD SETTINGS FCVV ==="

          target.build_configurations.each do |config|

            puts
            puts "Configuration : #{config.name}"

            # ------------------------------------------------------
            # HEADER_SEARCH_PATHS
            # ------------------------------------------------------

            current =
              config.build_settings['HEADER_SEARCH_PATHS']

            values =
              case current
              when Array
                current.dup
              when String
                [current]
              else
                []
              end

            unless values.any? do |value|
              value.to_s.include?('$(inherited)')
            end
              values.unshift('$(inherited)')
            end

            config.build_settings['HEADER_SEARCH_PATHS'] = values

            puts "✓ HEADER_SEARCH_PATHS conserve $(inherited)"

            # ------------------------------------------------------
            # OTHER_LDFLAGS
            # ------------------------------------------------------

            current =
              config.build_settings['OTHER_LDFLAGS']

            values =
              case current
              when Array
                current.dup
              when String
                [current]
              else
                []
              end

            unless values.any? do |value|
              value.to_s.include?('$(inherited)')
            end
              values.unshift('$(inherited)')
            end

            config.build_settings['OTHER_LDFLAGS'] = values

            puts "✓ OTHER_LDFLAGS conserve $(inherited)"

            # ------------------------------------------------------
            # GCC_PREPROCESSOR_DEFINITIONS
            # ------------------------------------------------------

            current =
              config.build_settings['GCC_PREPROCESSOR_DEFINITIONS']

            values =
              case current
              when Array
                current.dup
              when String
                [current]
              else
                []
              end

            unless values.any? do |value|
              value.to_s.include?('$(inherited)')
            end
              values.unshift('$(inherited)')
            end

            config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] = values

            puts "✓ GCC_PREPROCESSOR_DEFINITIONS conserve $(inherited)"
          end

          project.save

          puts
          puts "✓ Build settings FCVV corrigés"
          RUBY

          # ========================================================
          # 6.7 PODFILE
          # ========================================================

          cat > "$PROJ_DIR/Podfile" <<'EOF'
          platform :ios, '15.0'

          use_frameworks! :linkage => :static

          project 'fcvv.xcodeproj'

          target 'fcvv' do
            pod 'FirebaseCore', '12.19.0'
            pod 'FirebaseMessaging', '12.19.0'
          end

          post_install do |installer|

            default_toolchain =
              '/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain'

            default_swift_lib =
              "#{default_toolchain}/usr/lib/swift/$(PLATFORM_NAME)"

            installer.pods_project.targets.each do |target|

              target.build_configurations.each do |config|

                config.build_settings['LIBRARY_SEARCH_PATHS'] = [
                  '$(inherited)',
                  default_swift_lib
                ]

                config.build_settings.delete(
                  'PROVISIONING_PROFILE_SPECIFIER'
                )

                config.build_settings.delete(
                  'PROVISIONING_PROFILE'
                )

                config.build_settings['CODE_SIGN_STYLE'] =
                  'Automatic'

                config.build_settings.delete(
                  'DEVELOPMENT_TEAM'
                )

                config.build_settings.delete(
                  'CODE_SIGN_IDENTITY'
                )

                config.build_settings['CODE_SIGNING_ALLOWED'] =
                  'NO'

                config.build_settings['CODE_SIGNING_REQUIRED'] =
                  'NO'
              end
            end
          end
          EOF

          # ========================================================
          # 6.8 POD INSTALL
          # ========================================================

          pod deintegrate || true

          rm -rf Pods Podfile.lock

          pod install --repo-update

          # ========================================================
          # 6.9 VERIFICATIONS
          # ========================================================

          test -d "$PROJ_DIR/Pods/FirebaseCore"
          test -d "$PROJ_DIR/Pods/FirebaseMessaging"
          test -f "$PROJ_DIR/Podfile.lock"
          test -f "$PROJ_DIR/fcvv.xcworkspace/contents.xcworkspacedata"

          echo
          echo "✓ FirebaseCore installé"
          echo "✓ FirebaseMessaging installé"
          echo "✓ Podfile.lock présent"
          echo "✓ fcvv.xcworkspace présent"

          echo
          echo "=== HEADERS FIREBASE INSTALLES ==="

          find "$PROJ_DIR/Pods" \
            -type f \
            \( \
              -name "FirebaseCore.h" \
              -o \
              -name "FirebaseMessaging.h" \
            \) \
            -print \
            | sort

          echo
          echo "=== VERIFICATION BUILD SETTINGS FCVV ==="

          grep -n \
            -E \
            'HEADER_SEARCH_PATHS|OTHER_LDFLAGS|GCC_PREPROCESSOR_DEFINITIONS' \
            "$PROJECT_FILE/project.pbxproj" \
            | head -n 100 || true

          echo
          echo "============================================================"
          echo "  FIREBASE / COCOAPODS TERMINÉ"
          echo "============================================================"
      # ============================================================
      # 7. PATCH SDLUIKitDelegate
      # ============================================================
      - name: Apply FCVV Firebase patch to SDL
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "  PATCH SDLUIKitDelegate"
          echo "============================================================"

          SDL_FILES="$(
            find "$GITHUB_WORKSPACE/build/sdl2" \
              -name "SDL_uikitappdelegate.m" \
              -type f
          )"

          if [ -z "$SDL_FILES" ]; then
            echo "❌ SDL_uikitappdelegate.m introuvable"
            exit 1
          fi

          while IFS= read -r FILE
          do
            echo ""
            echo "============================================================"
            echo "PATCH : $FILE"
            echo "============================================================"

            cp "$FILE" "$FILE.before-fcvv"

            HEADER="${FILE%.m}.h"

            if [ ! -f "$HEADER" ]; then
              echo "❌ Header compagnon introuvable : $HEADER"
              exit 1
            fi

            python3 \
              "$GITHUB_WORKSPACE/apply_fcvv_patch.py" \
              "$FILE"

            grep -n \
              "FCVV_FCM_CONFIGURATION_V1" \
              "$FILE"

            grep -n \
              "FirebaseMessaging" \
              "$FILE"

          done <<< "$SDL_FILES"

          echo ""
          echo "✓ Tous les SDLUIKitDelegate ont été patchés"

      # ============================================================
      # 8. REBUILD SDL2 + SYNCHRONISATION DU LIBSDL2.A FINAL
      # ============================================================
      - name: Rebuild SDL2 and sync libSDL2.a with fcvv.xcodeproj
        shell: bash
        env:
          TARGET_NAME: fcvv
          IOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " REBUILD SDL2 + SYNCHRONISATION DU LIBSDL2.A FINAL"
          echo "============================================================"

          # ========================================================
          # 8.1 RECHERCHE DU PROJET FCVV
          # ========================================================

          echo
          echo "=== RECHERCHE DU PROJET XCODE ==="

          PROJECT_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "fcvv.xcodeproj" \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ ERREUR : fcvv.xcodeproj introuvable."

            echo
            echo "Projets Xcode présents :"

            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*.xcodeproj" \
              -print \
              | sort || true

            exit 1
          fi

          PROJ_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_PBXPROJ="$PROJECT_FILE/project.pbxproj"
          PODS_DIR="$PROJ_DIR/Pods"

          echo "✓ PROJECT_FILE :"
          echo "  $PROJECT_FILE"

          echo "✓ PROJ_DIR :"
          echo "  $PROJ_DIR"

          echo "✓ PODS_DIR :"
          echo "  $PODS_DIR"

          if [ ! -f "$PROJECT_PBXPROJ" ]; then
            echo "❌ project.pbxproj introuvable :"
            echo "  $PROJECT_PBXPROJ"
            exit 1
          fi

          if [ ! -d "$PODS_DIR" ]; then
            echo "❌ Répertoire Pods introuvable :"
            echo "  $PODS_DIR"
            exit 1
          fi


          # ========================================================
          # 8.2 RECHERCHE REELLE DES HEADERS FIREBASE
          # ========================================================

          echo
          echo "=== RECHERCHE DES HEADERS FIREBASE ==="

          FIREBASE_CORE_HEADER="$(
            find "$PODS_DIR" \
              -type f \
              -path "*/FirebaseCore/Sources/Public/FirebaseCore/FirebaseCore.h" \
              -print \
              -quit
          )"

          FIREBASE_MESSAGING_HEADER="$(
            find "$PODS_DIR" \
              -type f \
              -path "*/FirebaseMessaging/Sources/Public/FirebaseMessaging/FirebaseMessaging.h" \
              -print \
              -quit
          )"

          if [ -z "$FIREBASE_CORE_HEADER" ]; then
            echo
            echo "❌ FirebaseCore.h introuvable."

            echo
            echo "Headers Firebase disponibles :"

            find "$PODS_DIR" \
              -type f \
              -name "*.h" \
              -print \
              | grep -Ei 'Firebase|FIR' \
              | sort \
              | head -n 200 || true

            exit 1
          fi

          if [ -z "$FIREBASE_MESSAGING_HEADER" ]; then
            echo
            echo "❌ FirebaseMessaging.h introuvable."

            echo
            echo "Headers Firebase disponibles :"

            find "$PODS_DIR" \
              -type f \
              -name "*.h" \
              -print \
              | grep -Ei 'Firebase|FIR' \
              | sort \
              | head -n 200 || true

            exit 1
          fi


          # --------------------------------------------------------
          # IMPORTANT
          #
          # Pour :
          #
          #   #import <FirebaseCore/FirebaseCore.h>
          #
          # le SEARCH PATH doit être :
          #
          #   .../FirebaseCore/Sources/Public
          #
          # et NON :
          #
          #   .../FirebaseCore/Sources/Public/FirebaseCore
          #
          # Même principe pour FirebaseMessaging.
          # --------------------------------------------------------

          FIREBASE_CORE_PUBLIC_DIR="$(
            dirname "$(dirname "$FIREBASE_CORE_HEADER")"
          )"

          FIREBASE_MESSAGING_PUBLIC_DIR="$(
            dirname "$(dirname "$FIREBASE_MESSAGING_HEADER")"
          )"

          echo
          echo "✓ FirebaseCore.h :"
          echo "  $FIREBASE_CORE_HEADER"

          echo "✓ FirebaseCore PUBLIC DIR :"
          echo "  $FIREBASE_CORE_PUBLIC_DIR"

          echo
          echo "✓ FirebaseMessaging.h :"
          echo "  $FIREBASE_MESSAGING_HEADER"

          echo "✓ FirebaseMessaging PUBLIC DIR :"
          echo "  $FIREBASE_MESSAGING_PUBLIC_DIR"


          # ========================================================
          # 8.2.1 VERIFICATION DES CHEMINS D'INCLUDE
          # ========================================================

          echo
          echo "=== VERIFICATION DES INCLUDE FIREBASE ==="

          EXPECTED_CORE_HEADER="$FIREBASE_CORE_PUBLIC_DIR/FirebaseCore/FirebaseCore.h"
          EXPECTED_MESSAGING_HEADER="$FIREBASE_MESSAGING_PUBLIC_DIR/FirebaseMessaging/FirebaseMessaging.h"

          if [ ! -f "$EXPECTED_CORE_HEADER" ]; then
            echo "❌ FirebaseCore include target introuvable :"
            echo "  $EXPECTED_CORE_HEADER"
            exit 1
          fi

          if [ ! -f "$EXPECTED_MESSAGING_HEADER" ]; then
            echo "❌ FirebaseMessaging include target introuvable :"
            echo "  $EXPECTED_MESSAGING_HEADER"
            exit 1
          fi

          echo "✓ FirebaseCore include target :"
          echo "  $EXPECTED_CORE_HEADER"

          echo "✓ FirebaseMessaging include target :"
          echo "  $EXPECTED_MESSAGING_HEADER"


          # ========================================================
          # 8.2.2 AFFICHAGE DES HEADERS FIREBASE
          # ========================================================

          echo
          echo "=== HEADERS FIREBASE TROUVES ==="

          find "$PODS_DIR" \
            -type f \
            \( \
              -name "FirebaseCore.h" \
              -o \
              -name "FirebaseMessaging.h" \
            \) \
            -print \
            | sort


          # ========================================================
          # 8.2.3 VERIFICATION DU LAYOUT PODS
          # ========================================================

          echo
          echo "=== LAYOUT FIREBASE PODS ==="

          echo
          echo "FirebaseCore :"

          find "$PODS_DIR/FirebaseCore" \
            -maxdepth 6 \
            -type f \
            -name "FirebaseCore.h" \
            -print \
            2>/dev/null || true

          echo
          echo "FirebaseMessaging :"

          find "$PODS_DIR/FirebaseMessaging" \
            -maxdepth 6 \
            -type f \
            -name "FirebaseMessaging.h" \
            -print \
            2>/dev/null || true


          # ========================================================
          # 8.3 REBUILD DEVICE + SIMULATOR
          # ========================================================

          for sdk in iphoneos iphonesimulator; do

            echo
            echo "============================================================"
            echo " SDK : $sdk"
            echo "============================================================"


            # ======================================================
            # 8.3.1 DETERMINATION ARCHITECTURE ATTENDUE
            # ======================================================

            EXPECTED_ARCH="arm64"

            echo
            echo "✓ Architecture attendue :"
            echo "  $EXPECTED_ARCH"


            # ======================================================
            # 8.3.2 RECHERCHE DU PROJET SDL
            # ======================================================

            SDL_PROJECT="$(
              find "$GITHUB_WORKSPACE/build/sdl2" \
                -type d \
                -path "*/${sdk}-arm64/SDL2-*/Xcode/SDL/SDL.xcodeproj" \
                -print \
                -quit
            )"

            if [ -z "$SDL_PROJECT" ]; then

              echo "❌ Projet SDL introuvable pour $sdk."

              echo
              echo "Projets SDL disponibles :"

              find "$GITHUB_WORKSPACE/build/sdl2" \
                -type d \
                -name "SDL.xcodeproj" \
                -print \
                | sort || true

              exit 1
            fi

            SDL_DIR="$(dirname "$SDL_PROJECT")"
            SDL_PBXPROJ="$SDL_PROJECT/project.pbxproj"

            echo
            echo "✓ SDL_PROJECT :"
            echo "  $SDL_PROJECT"

            echo "✓ SDL_DIR :"
            echo "  $SDL_DIR"

            if [ ! -f "$SDL_PBXPROJ" ]; then
              echo "❌ project.pbxproj SDL introuvable :"
              echo "  $SDL_PBXPROJ"
              exit 1
            fi


            # ======================================================
            # 8.3.3 RECHERCHE DU SDLUIKitDelegate
            # ======================================================

            SDL_M="$(
              find "$GITHUB_WORKSPACE/build/sdl2" \
                -type f \
                -name "SDL_uikitappdelegate.m" \
                -path "*/${sdk}-arm64/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -z "$SDL_M" ]; then
              echo "❌ SDL_uikitappdelegate.m introuvable pour $sdk."
              exit 1
            fi

            SDL_H="$(dirname "$SDL_M")/SDL_uikitappdelegate.h"

            if [ ! -f "$SDL_H" ]; then
              echo "❌ SDL_uikitappdelegate.h introuvable :"
              echo "  $SDL_H"
              exit 1
            fi

            echo
            echo "=== VERIFICATION SDLUIKitDelegate ==="

            echo "✓ .m :"
            echo "  $SDL_M"

            echo "✓ .h :"
            echo "  $SDL_H"


            # ======================================================
            # 8.3.4 VERIFICATION DES IMPORTS FIREBASE
            # ======================================================

            echo
            echo "=== VERIFICATION DES IMPORTS FIREBASE ==="

            if grep -q \
              "FirebaseCore/FirebaseCore.h" \
              "$SDL_H"; then

              echo "❌ FirebaseCore est encore importé dans le .h."
              exit 1
            fi

            if grep -q \
              "FirebaseMessaging/FirebaseMessaging.h" \
              "$SDL_H"; then

              echo "❌ FirebaseMessaging est encore importé dans le .h."
              exit 1
            fi

            grep -q \
              "FirebaseCore/FirebaseCore.h" \
              "$SDL_M" || {

              echo "❌ FirebaseCore absent du .m."
              exit 1
            }

            grep -q \
              "FirebaseMessaging/FirebaseMessaging.h" \
              "$SDL_M" || {

              echo "❌ FirebaseMessaging absent du .m."
              exit 1
            }

            echo "✓ Aucun import Firebase dans SDL_uikitappdelegate.h"
            echo "✓ FirebaseCore présent dans SDL_uikitappdelegate.m"
            echo "✓ FirebaseMessaging présent dans SDL_uikitappdelegate.m"


            # ======================================================
            # 8.3.5 VERIFICATION PHYSIQUE DES HEADERS
            # ======================================================

            echo
            echo "=== TEST PHYSIQUE DES HEADERS FIREBASE ==="

            echo
            echo "FirebaseCore :"
            ls -la "$FIREBASE_CORE_PUBLIC_DIR/FirebaseCore/FirebaseCore.h"

            echo
            echo "FirebaseMessaging :"
            ls -la "$FIREBASE_MESSAGING_PUBLIC_DIR/FirebaseMessaging/FirebaseMessaging.h"


            # ======================================================
            # 8.3.6 RECOMPILATION SDL2
            # ======================================================

            echo
            echo "=== RECOMPILATION SDL2 : $sdk ==="

            echo
            echo "HEADER_SEARCH_PATHS utilisés :"

            echo "  $FIREBASE_CORE_PUBLIC_DIR"
            echo "  $FIREBASE_MESSAGING_PUBLIC_DIR"

            xcodebuild \
              -project "$SDL_PROJECT" \
              -target "Static Library-iOS" \
              -configuration Release \
              -sdk "$sdk" \
              IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
              HEADER_SEARCH_PATHS="\
                \$(inherited) \
                \"$FIREBASE_CORE_PUBLIC_DIR\" \
                \"$FIREBASE_MESSAGING_PUBLIC_DIR\" \
              " \
              USER_HEADER_SEARCH_PATHS="\
                \$(inherited) \
                \"$FIREBASE_CORE_PUBLIC_DIR\" \
                \"$FIREBASE_MESSAGING_PUBLIC_DIR\" \
              " \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO


            echo
            echo "✓ SDL2 compilé avec succès pour $sdk"


            # ======================================================
            # 8.3.7 RECHERCHE DU LIBSDL2.A RECOMPILE
            # ======================================================

            echo
            echo "=== RECHERCHE DU LIBSDL2.A RECOMPILE ==="

            SDL_LIB_CANDIDATES="$(
              find "$GITHUB_WORKSPACE/build/sdl2" \
                -type f \
                -name "libSDL2.a" \
                -path "*/${sdk}-arm64/*" \
                -print \
                | sort
            )"

            if [ -z "$SDL_LIB_CANDIDATES" ]; then

              echo "❌ libSDL2.a recompilé introuvable pour $sdk."

              echo
              echo "Tous les libSDL2.a trouvés :"

              find "$GITHUB_WORKSPACE/build/sdl2" \
                -type f \
                -name "libSDL2.a" \
                -print \
                | sort || true

              exit 1
            fi

            SDL_LIB="$(
              printf '%s\n' "$SDL_LIB_CANDIDATES" \
                | head -n 1
            )"

            echo
            echo "✓ libSDL2.a recompilé :"
            echo "  $SDL_LIB"


            # ======================================================
            # 8.3.8 VERIFICATION ARCHITECTURE LIBSDL2
            # ======================================================

            echo
            echo "=== ARCHITECTURES DU LIBSDL2.A RECOMPILE ==="

            SDL_LIPO_INFO="$(lipo -info "$SDL_LIB")"

            echo "$SDL_LIPO_INFO"

            if ! echo "$SDL_LIPO_INFO" | grep -q "$EXPECTED_ARCH"; then
              echo
              echo "❌ Architecture $EXPECTED_ARCH absente du libSDL2.a."
              exit 1
            fi

            echo
            echo "✓ Architecture $EXPECTED_ARCH présente"


            # ======================================================
            # 8.3.9 HASH DU SDL RECOMPILE
            # ======================================================

            SHA_REBUILT="$(
              shasum -a 256 "$SDL_LIB" \
                | awk '{print $1}'
            )"

            echo
            echo "✓ SHA256 SDL recompilé :"
            echo "  $SHA_REBUILT"


            # ======================================================
            # 8.3.10 RECHERCHE DES LIBSDL2.A DU PROJET
            # ======================================================

            echo
            echo "=== RECHERCHE DES LIBSDL2.A DANS FCVV ==="

            PROJECT_LIBS=()

            # ------------------------------------------------------
            # Recherche physique classique
            # ------------------------------------------------------

            while IFS= read -r PROJECT_LIB; do
              [ -n "$PROJECT_LIB" ] || continue
              PROJECT_LIBS+=("$PROJECT_LIB")
            done < <(
              find "$PROJ_DIR" \
                -type f \
                -name "libSDL2.a" \
                ! -path "*/build/*" \
                ! -path "*/DerivedData/*" \
                -print \
                | sort
            )

            echo
            echo "Nombre de libSDL2.a physiques trouvés : ${#PROJECT_LIBS[@]}"

            for PROJECT_LIB in "${PROJECT_LIBS[@]}"; do
              echo "  ✓ $PROJECT_LIB"
            done


            # ======================================================
            # 8.3.11 SI AUCUN FICHIER PHYSIQUE :
            #        ANALYSE DU PROJECT.PBXPROJ
            # ======================================================

            if [ "${#PROJECT_LIBS[@]}" -eq 0 ]; then

              echo
              echo "⚠ Aucun libSDL2.a physique trouvé dans le projet."

              echo
              echo "=== RECHERCHE DES REFERENCES LIBSDL2.A DANS PBXPROJ ==="

              PBX_LIB_REFERENCES="$(
                grep -n \
                  -B 12 \
                  -A 12 \
                  "libSDL2.a" \
                  "$PROJECT_PBXPROJ" \
                  || true
              )"

              if [ -z "$PBX_LIB_REFERENCES" ]; then

                echo
                echo "❌ Aucune référence libSDL2.a trouvée dans :"
                echo "  $PROJECT_PBXPROJ"

                echo
                echo "Recherche générale SDL :"

                grep -ni \
                  "SDL2\|SDL" \
                  "$PROJECT_PBXPROJ" \
                  | head -n 200 \
                  || true

                exit 1
              fi

              echo
              echo "$PBX_LIB_REFERENCES"


              # ==================================================
              # Extraction des lignes :
              #
              # path = ".../libSDL2.a";
              #
              # ou :
              #
              # path = libSDL2.a;
              # ==================================================

              PBX_PATHS=()

              while IFS= read -r PBX_PATH; do

                [ -n "$PBX_PATH" ] || continue

                # Nettoyage
                PBX_PATH="${PBX_PATH#*=}"
                PBX_PATH="${PBX_PATH%;}"
                PBX_PATH="$(printf '%s' "$PBX_PATH" | sed 's/^[[:space:]]*//')"
                PBX_PATH="$(printf '%s' "$PBX_PATH" | sed 's/[[:space:]]*$//')"

                # Suppression des guillemets
                PBX_PATH="${PBX_PATH#\"}"
                PBX_PATH="${PBX_PATH%\"}"

                case "$PBX_PATH" in
                  *libSDL2.a)
                    PBX_PATHS+=("$PBX_PATH")
                    ;;
                esac

              done < <(
                grep \
                  "path = .*libSDL2\.a" \
                  "$PROJECT_PBXPROJ" \
                  | sed 's/.*path = /path = /' \
                  | sed 's/^path = //'
              )


              echo
              echo "=== CHEMINS SDL TROUVES DANS PBXPROJ ==="

              if [ "${#PBX_PATHS[@]}" -eq 0 ]; then

                echo "❌ Aucun path = ...libSDL2.a détecté."

                echo
                echo "Références brutes :"

                grep -n \
                  "libSDL2.a" \
                  "$PROJECT_PBXPROJ" \
                  || true

                exit 1
              fi

              for PBX_PATH in "${PBX_PATHS[@]}"; do
                echo "  → $PBX_PATH"
              done


              # ==================================================
              # 8.3.12 RESOLUTION DES CHEMINS PBX
              # ==================================================

              echo
              echo "=== RESOLUTION DES CHEMINS LIBSDL2.A ==="

              for PBX_PATH in "${PBX_PATHS[@]}"; do

                RESOLVED_LIB=""

                # ------------------------------------------------
                # Cas 1 :
                # chemin absolu
                # ------------------------------------------------

                case "$PBX_PATH" in

                  /*)

                    RESOLVED_LIB="$PBX_PATH"

                    ;;

                  *)

                    # --------------------------------------------
                    # Cas 2 :
                    # chemin relatif au projet Xcode
                    # --------------------------------------------

                    RESOLVED_LIB="$PROJ_DIR/$PBX_PATH"

                    ;;

                esac


                echo
                echo "Référence PBX :"
                echo "  $PBX_PATH"

                echo "Chemin résolu :"
                echo "  $RESOLVED_LIB"


                # ------------------------------------------------
                # On mémorise la destination même si elle
                # n'existe pas encore.
                # ------------------------------------------------

                case "$RESOLVED_LIB" in

                  *libSDL2.a)

                    PROJECT_LIBS+=("$RESOLVED_LIB")

                    echo "  ✓ Destination libSDL2.a retenue"

                    ;;

                esac

              done

            fi


            # ======================================================
            # 8.3.13 VERIFICATION DES DESTINATIONS
            # ======================================================

            echo
            echo "=== DESTINATIONS LIBSDL2.A ==="

            if [ "${#PROJECT_LIBS[@]}" -eq 0 ]; then

              echo
              echo "❌ Aucune destination libSDL2.a déterminée."

              echo
              echo "project.pbxproj :"
              echo "  $PROJECT_PBXPROJ"

              exit 1

            fi


            # ------------------------------------------------------
            # Suppression des doublons
            # Compatible Bash 3.2
            # ------------------------------------------------------

            UNIQUE_PROJECT_LIBS=()

            for PROJECT_LIB in "${PROJECT_LIBS[@]}"; do

              ALREADY_PRESENT=0

              for EXISTING_LIB in "${UNIQUE_PROJECT_LIBS[@]}"; do

                if [ "$PROJECT_LIB" = "$EXISTING_LIB" ]; then
                  ALREADY_PRESENT=1
                  break
                fi

              done

              if [ "$ALREADY_PRESENT" -eq 0 ]; then
                UNIQUE_PROJECT_LIBS+=("$PROJECT_LIB")
              fi

            done

            PROJECT_LIBS=("${UNIQUE_PROJECT_LIBS[@]}")


            echo
            echo "✓ ${#PROJECT_LIBS[@]} destination(s) trouvée(s)"

            for PROJECT_LIB in "${PROJECT_LIBS[@]}"; do

              echo
              echo "→ $PROJECT_LIB"

              if [ -f "$PROJECT_LIB" ]; then

                PROJECT_LIPO_INFO="$(
                  lipo -info "$PROJECT_LIB" 2>/dev/null || true
                )"

                echo "  Architecture actuelle :"
                echo "  $PROJECT_LIPO_INFO"

              else

                echo "  ⚠ Le fichier n'existe pas encore."
                echo "  ✓ Il sera créé par la synchronisation."

              fi

            done


            # ======================================================
            # 8.3.14 VERIFICATION DEVICE / SIMULATOR
            # ======================================================

            echo
            echo "=== VERIFICATION DE LA DESTINATION POUR $sdk ==="

            SDK_PROJECT_LIBS=()

            for PROJECT_LIB in "${PROJECT_LIBS[@]}"; do

              DEST_MATCH=0

              # --------------------------------------------------
              # Si le chemin contient explicitement le SDK,
              # on l'utilise.
              # --------------------------------------------------

              case "$sdk" in

                iphoneos)

                  case "$PROJECT_LIB" in
                    *iphoneos*|*iPhoneOS*|*IPHONEOS*|*device*|*Device*)
                      DEST_MATCH=1
                      ;;
                  esac

                  ;;

                iphonesimulator)

                  case "$PROJECT_LIB" in
                    *iphonesimulator*|*iPhoneSimulator*|*IPHONESIMULATOR*|*simulator*|*Simulator*)
                      DEST_MATCH=1
                      ;;
                  esac

                  ;;

              esac


              # --------------------------------------------------
              # Si le fichier existe déjà, on peut aussi vérifier
              # son architecture.
              #
              # Attention :
              # arm64 seul ne distingue PAS device/simulator.
              # --------------------------------------------------

              if [ -f "$PROJECT_LIB" ]; then

                DEST_LIPO="$(
                  lipo -info "$PROJECT_LIB" 2>/dev/null || true
                )"

                if echo "$DEST_LIPO" | grep -q "$EXPECTED_ARCH"; then

                  echo
                  echo "libSDL2.a :"
                  echo "  $PROJECT_LIB"

                  echo "Architecture :"
                  echo "  $DEST_LIPO"

                  if [ "$DEST_MATCH" -eq 1 ]; then
                    echo "  ✓ Chemin compatible avec $sdk"
                  else
                    echo "  ⚠ Architecture compatible mais SDK non explicite"
                  fi

                fi

              else

                echo
                echo "Destination inexistante :"
                echo "  $PROJECT_LIB"

                if [ "$DEST_MATCH" -eq 1 ]; then
                  echo "  ✓ Chemin compatible avec $sdk"
                else
                  echo "  ⚠ SDK non identifiable dans le chemin"
                fi

              fi


              # --------------------------------------------------
              # Pour une destination explicitement liée au SDK :
              # --------------------------------------------------

              if [ "$DEST_MATCH" -eq 1 ]; then
                SDK_PROJECT_LIBS+=("$PROJECT_LIB")
              fi

            done


            # ======================================================
            # 8.3.15 FALLBACK SECURISE
            # ======================================================

            if [ "${#SDK_PROJECT_LIBS[@]}" -eq 0 ]; then

              if [ "${#PROJECT_LIBS[@]}" -eq 1 ]; then

                echo
                echo "⚠ Une seule destination libSDL2.a existe."

                echo "  Destination utilisée :"
                echo "  ${PROJECT_LIBS[0]}"

                SDK_PROJECT_LIBS=("${PROJECT_LIBS[0]}")

              else

                echo
                echo "❌ Plusieurs destinations libSDL2.a existent,"
                echo "   mais aucune ne permet d'identifier le SDK."

                echo
                echo "Destinations détectées :"

                for PROJECT_LIB in "${PROJECT_LIBS[@]}"; do
                  echo "  $PROJECT_LIB"
                done

                echo
                echo "Pour éviter de mélanger device et simulator,"
                echo "la synchronisation est arrêtée."

                exit 1

              fi

            fi


            # ======================================================
            # 8.3.16 SYNCHRONISATION DU LIBSDL2.A
            # ======================================================

            echo
            echo "=== SYNCHRONISATION DU LIBSDL2.A POUR $sdk ==="

            SYNC_COUNT=0

            for DEST in "${SDK_PROJECT_LIBS[@]}"; do

              echo
              echo "============================================================"
              echo " SYNCHRONISATION"
              echo "============================================================"

              echo
              echo "→ SOURCE :"
              echo "  $SDL_LIB"

              echo
              echo "→ DESTINATION :"
              echo "  $DEST"


              # ----------------------------------------------------
              # Création du dossier destination si nécessaire
              # ----------------------------------------------------

              DEST_DIR="$(dirname "$DEST")"

              if [ ! -d "$DEST_DIR" ]; then

                echo
                echo "Création du dossier destination :"
                echo "  $DEST_DIR"

                mkdir -p "$DEST_DIR"

              fi


              # ----------------------------------------------------
              # Copie
              # ----------------------------------------------------

              if [ -f "$DEST" ] && cmp -s "$SDL_LIB" "$DEST"; then

                echo
                echo "✓ libSDL2.a déjà identique"

              else

                cp -f "$SDL_LIB" "$DEST"

                echo
                echo "✓ libSDL2.a copié"

              fi


              # ----------------------------------------------------
              # Vérification existence
              # ----------------------------------------------------

              if [ ! -f "$DEST" ]; then

                echo
                echo "❌ libSDL2.a absent après copie :"
                echo "  $DEST"

                exit 1

              fi


              # ----------------------------------------------------
              # Vérification SHA256
              # ----------------------------------------------------

              DEST_SHA="$(
                shasum -a 256 "$DEST" \
                  | awk '{print $1}'
              )"

              echo
              echo "SHA256 destination :"
              echo "  $DEST_SHA"

              echo "SHA256 source :"
              echo "  $SHA_REBUILT"


              if [ "$DEST_SHA" != "$SHA_REBUILT" ]; then

                echo
                echo "❌ ERREUR : hash destination incorrect."

                exit 1

              fi

              echo
              echo "✓ SHA256 vérifié"


              # ----------------------------------------------------
              # Vérification architecture finale
              # ----------------------------------------------------

              DEST_FINAL_LIPO="$(
                lipo -info "$DEST"
              )"

              echo
              echo "Architecture finale :"
              echo "  $DEST_FINAL_LIPO"

              if ! echo "$DEST_FINAL_LIPO" | grep -q "$EXPECTED_ARCH"; then

                echo
                echo "❌ Architecture finale incorrecte."

                echo "SDK :"
                echo "  $sdk"

                echo "Architecture attendue :"
                echo "  $EXPECTED_ARCH"

                exit 1

              fi

              echo
              echo "✓ Architecture finale vérifiée"
              echo "✓ SDL final identique au SDL recompilé"

              SYNC_COUNT=$((SYNC_COUNT + 1))

            done


            # ======================================================
            # 8.3.17 VERIFICATION FINALE DU SDK
            # ======================================================

            echo
            echo "=== VERIFICATION FINALE $sdk ==="

            if [ "$SYNC_COUNT" -eq 0 ]; then

              echo "❌ Aucune synchronisation effectuée."
              exit 1

            fi

            for DEST in "${SDK_PROJECT_LIBS[@]}"; do

              FINAL_SHA="$(
                shasum -a 256 "$DEST" \
                  | awk '{print $1}'
              )"

              FINAL_LIPO="$(
                lipo -info "$DEST"
              )"

              echo
              echo "✓ libSDL2.a :"
              echo "  $DEST"

              echo
              echo "✓ SHA256 :"
              echo "  $FINAL_SHA"

              echo
              echo "✓ Architecture :"
              echo "  $FINAL_LIPO"

              if [ "$FINAL_SHA" != "$SHA_REBUILT" ]; then

                echo "❌ libSDL2.a final différent du rebuild."
                exit 1

              fi

              if ! echo "$FINAL_LIPO" | grep -q "$EXPECTED_ARCH"; then

                echo "❌ Architecture finale incorrecte."
                exit 1

              fi

              echo
              echo "✓ SDL final identique au SDL recompilé"

            done


            # ======================================================
            # 8.3.14 VERIFICATION FINALE DU SDK
            # ======================================================

            echo
            echo "=== VERIFICATION FINALE $sdk ==="

            if [ "$SYNC_COUNT" -eq 0 ]; then

              echo "❌ Aucune synchronisation effectuée."
              exit 1

            fi

            for DEST in "${SDK_PROJECT_LIBS[@]}"; do

              FINAL_SHA="$(
                shasum -a 256 "$DEST" \
                  | awk '{print $1}'
              )"

              FINAL_LIPO="$(
                lipo -info "$DEST"
              )"

              echo
              echo "✓ libSDL2.a :"
              echo "  $DEST"

              echo "✓ SHA256 :"
              echo "  $FINAL_SHA"

              echo "✓ Architecture :"
              echo "  $FINAL_LIPO"

              if [ "$FINAL_SHA" != "$SHA_REBUILT" ]; then
                echo "❌ libSDL2.a final différent du rebuild."
                exit 1
              fi

              if ! echo "$FINAL_LIPO" | grep -q "$EXPECTED_ARCH"; then
                echo "❌ Architecture finale incorrecte."
                exit 1
              fi

              echo "✓ SDL final identique au SDL recompilé"

            done

          done


          # ========================================================
          # 8.4 VERIFICATION FINALE DU PROJET
          # ========================================================

          echo
          echo "============================================================"
          echo " VERIFICATION FINALE DU PROJET FCVV"
          echo "============================================================"

          echo
          echo "Projet :"
          echo "  $PROJECT_FILE"


          # ========================================================
          # 8.4.1 VERIFICATION WORKSPACE COCOAPODS
          # ========================================================

          echo
          echo "Workspace CocoaPods :"

          if [ -d "$PROJ_DIR/fcvv.xcworkspace" ]; then

            echo "  ✓ $PROJ_DIR/fcvv.xcworkspace"

          else

            echo "  ⚠ fcvv.xcworkspace introuvable"

            echo
            echo "  Les Pods existent cependant :"
            echo "  $PODS_DIR"

          fi


          # ========================================================
          # 8.4.2 VERIFICATION FIREBASE
          # ========================================================

          echo
          echo "Firebase Pods :"

          if [ -d "$PODS_DIR/FirebaseCore" ]; then
            echo "  ✓ FirebaseCore"
          else
            echo "  ❌ FirebaseCore absent"
            exit 1
          fi

          if [ -d "$PODS_DIR/FirebaseMessaging" ]; then
            echo "  ✓ FirebaseMessaging"
          else
            echo "  ❌ FirebaseMessaging absent"
            exit 1
          fi


          # ========================================================
          # 8.4.3 VERIFICATION FINALE DES HEADERS
          # ========================================================

          echo
          echo "Headers Firebase finaux :"

          echo "  ✓ FirebaseCore :"
          echo "    $EXPECTED_CORE_HEADER"

          echo "  ✓ FirebaseMessaging :"
          echo "    $EXPECTED_MESSAGING_HEADER"


          # ========================================================
          # 8.4.4 FIN
          # ========================================================

          echo
          echo "============================================================"
          echo " ✓ ETAPE 8 TERMINEE AVEC SUCCES"
          echo "============================================================"
      # ============================================================
      # 9. APNs ENTITLEMENTS + CODE SIGNING
      # ============================================================
      - name: Configure APNs entitlements
        shell: bash
        env:
          TARGET_NAME: fcvv
          APNS_ENVIRONMENT: production
        run: |
          set -euo pipefail
          echo "=== CONFIGURATION APNs & ENTITLEMENTS ==="

          # Validation de l'environnement APNs
          [[ "$APNS_ENVIRONMENT" =~ ^(production|development)$ ]] || {
            echo "❌ APNS_ENVIRONMENT invalide : $APNS_ENVIRONMENT (valeurs : production ou development)"
            exit 1
          }

          XCODEPROJ="$(find . -name "*.xcodeproj" -print -quit)"
          [ -n "$XCODEPROJ" ] || { echo "❌ Aucun .xcodeproj trouvé"; exit 1; }
          PROJECT_DIR="$(dirname "$XCODEPROJ")"
          ENTITLEMENTS="$PROJECT_DIR/fcvv.entitlements"

          export XCODEPROJ PROJECT_DIR ENTITLEMENTS TARGET_NAME APNS_ENVIRONMENT

          # Création du fichier entitlements
          cat > "$ENTITLEMENTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>${APNS_ENVIRONMENT}</string>
          </dict>
          </plist>
          EOF
          echo "✓ fcvv.entitlements créé"

          # Configuration via Ruby (xcodeproj)
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open(ENV['XCODEPROJ'])
          target = project.targets.find { |t| t.name == ENV['TARGET_NAME'] } || abort("❌ Target '#{ENV['TARGET_NAME']}' introuvable")

          entitlements_path = ENV['ENTITLEMENTS']
          relative_entitlements = Pathname.new(entitlements_path).relative_path_from(Pathname.new(ENV['PROJECT_DIR'])).to_s

          unless project.files.any? { |f| f.path == relative_entitlements || f.path == File.basename(entitlements_path) }
            project.main_group.new_file(entitlements_path)
          end

          target.build_configurations.each do |config|
            config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "fcvv.entitlements"
            config.build_settings["CODE_SIGNING_ALLOWED"] = "YES"
          end

          project.save
          puts "✓ Projet Xcode mis à jour et sauvegardé"
          RUBY

          # Vérifications finales
          [ -f "$ENTITLEMENTS" ] || { echo "❌ Entitlements introuvable"; exit 1; }
          CURRENT_APNS="$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS" 2>/dev/null || echo "")"
          [ "$CURRENT_APNS" == "$APNS_ENVIRONMENT" ] || { echo "❌ Environnement APNs incorrect ($CURRENT_APNS attendu: $APNS_ENVIRONMENT)"; exit 1; }

          BUILD_SETTINGS="$(xcodebuild -project "$XCODEPROJ" -target "$TARGET_NAME" -showBuildSettings 2>/dev/null)"
          echo "$BUILD_SETTINGS" | grep -q "CODE_SIGN_ENTITLEMENTS = fcvv.entitlements" || { echo "❌ CODE_SIGN_ENTITLEMENTS incorrect dans Xcode"; exit 1; }

          echo "✓ Configuration APNs terminée avec succès (Environment: $APNS_ENVIRONMENT)"
      # ============================================================
      # 12. CONFIGURE LAUNCH SCREEN
      # ============================================================
      - name: Configure iOS Launch Screen
        shell: bash
        env:
          TARGET_NAME: fcvv
        run: |
          set -euo pipefail
          echo "=== CONFIGURE LAUNCH SCREEN ==="

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.xcodeproj" -type d -print -quit)"
          [ -n "$PROJECT_FILE" ] || { echo "❌ Aucun .xcodeproj trouvé"; exit 1; }

          PROJ_DIR="$(dirname "$PROJECT_FILE")"
          APP_DIR="$PROJ_DIR/$TARGET_NAME"
          ASSETS_DIR="$APP_DIR/Images.xcassets"
          IMAGESET_DIR="$ASSETS_DIR/fcvv_launch_logo.imageset"
          IMAGE_DEST="$IMAGESET_DIR/fcvv_launch_logo.png"
          PRESPLASH_SOURCE="$GITHUB_WORKSPACE/assets/logo_apk_fcvv.png"
          LAUNCH_STORYBOARD="$PROJ_DIR/LaunchScreen.storyboard"

          # 1. Vérification de l'image source
          [ -f "$PRESPLASH_SOURCE" ] || { echo "❌ Image source introuvable : $PRESPLASH_SOURCE"; exit 1; }
          python3 - "$PRESPLASH_SOURCE" <<'PY'
          from PIL import Image
          import sys
          img = Image.open(sys.argv[1])
          if img.size != (512, 512):
              sys.exit(f"❌ Dimensions attendues 512x512, trouvées {img.size}")
          PY

          # 2. Nettoyage des anciens fichiers/références de storyboard ou d'images
          rm -f "$APP_DIR"/*.png "$PROJ_DIR"/*.png "$APP_DIR"/LaunchScreen.storyboard "$PROJ_DIR"/LaunchScreen.storyboard
          rm -rf "$ASSETS_DIR"/*.imageset
          mkdir -p "$IMAGESET_DIR"

          # 3. Création des Contents.json et copie des assets
          if [ ! -f "$ASSETS_DIR/Contents.json" ]; then
            echo '{"info": {"author": "xcode", "version": 1}}' > "$ASSETS_DIR/Contents.json"
          fi
          cp "$PRESPLASH_SOURCE" "$IMAGE_DEST"
          cat > "$IMAGESET_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "fcvv_launch_logo.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          # 4. Génération du LaunchScreen.storyboard
          cat > "$LAUNCH_STORYBOARD" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="23504" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" colorMatched="YES" initialViewController="LaunchScreenViewController">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23506"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="LaunchScreenScene">
                      <objects>
                          <viewController id="LaunchScreenViewController" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="LaunchScreenView">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <imageView clipsSubviews="YES" userInteractionEnabled="NO" contentMode="scaleAspectFit" horizontalHuggingPriority="251" verticalHuggingPriority="251" image="fcvv_launch_logo" translatesAutoresizingMaskIntoConstraints="NO" id="LaunchLogo">
                                          <rect key="frame" x="96.5" y="326" width="200" height="200"/>
                                      </imageView>
                                  </subviews>
                                  <color key="backgroundColor" red="0.117647" green="0.227451" blue="0.541176" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint firstItem="LaunchLogo" firstAttribute="centerX" secondItem="LaunchScreenView" secondAttribute="centerX" id="CenterX"/>
                                      <constraint firstItem="LaunchLogo" firstAttribute="centerY" secondItem="LaunchScreenView" secondAttribute="centerY" id="CenterY"/>
                                      <constraint firstItem="LaunchLogo" firstAttribute="width" constant="200" id="LogoWidth"/>
                                      <constraint firstItem="LaunchLogo" firstAttribute="height" constant="200" id="LogoHeight"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="FirstResponder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="100" y="100"/>
                  </scene>
              </scenes>
              <resources>
                  <image name="fcvv_launch_logo" width="512" height="512"/>
              </resources>
          </document>
          EOF

          # 5. Validation syntaxique rapide du storyboard
          [ "$(grep -c '<viewController' "$LAUNCH_STORYBOARD")" -eq 1 ] || { echo "❌ Le storyboard doit contenir exactement 1 viewController"; exit 1; }

          # 6. Configuration du projet Xcode via Ruby
          ruby - "$PROJECT_FILE" "$TARGET_NAME" <<'RUBY'
          require 'xcodeproj'
          project_path = ARGV[0]
          target_name = ARGV[1]
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == target_name } || abort("❌ Target '#{target_name}' introuvable")

          # Nettoyage des anciennes références obsolètes liées au launch screen / logos
          project.files.to_a.each do |file|
            basename = File.basename(file.path.to_s)
            next unless %w[logo_apk_fcvv.png fcvv_launch_logo.png LaunchScreen.storyboard Launch Screen.storyboard].include?(basename)
            target.resources_build_phase.files.to_a.each do |bf|
              target.resources_build_phase.remove_build_file(bf) if bf.file_ref == file
            end
            file.remove_from_project
          end

          storyboard_file = project.files.find { |f| File.basename(f.path.to_s) == 'LaunchScreen.storyboard' } || project.main_group.new_file('LaunchScreen.storyboard')
          
          unless target.resources_build_phase.files.to_a.any? { |bf| bf.file_ref == storyboard_file }
            target.resources_build_phase.add_file_reference(storyboard_file, true)
          end

          target.build_configurations.each do |config|
            config.build_settings['UILAUNCHSTORYBOARDNAME'] = 'LaunchScreen'
            config.build_settings.delete('UIMAINSTORYBOARDFILE')
          end

          project.save
          puts "✓ Projet Xcode mis à jour avec le LaunchScreen"
          RUBY

          # 7. Mise à jour de l'Info.plist
          PLIST_FILE="$(find "$PROJ_DIR" -maxdepth 1 -name "*-Info.plist" ! -name "GoogleService-Info.plist" -type f -print -quit)"
          [ -n "$PLIST_FILE" ] || { echo "❌ Info.plist introuvable"; exit 1; }

          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST_FILE" 2>/dev/null || true
          plutil -lint "$PLIST_FILE"

          # 8. Validation finale et compilation via ibtool
          [ -f "$IMAGE_DEST" ] && [ -f "$IMAGESET_DIR/Contents.json" ] && [ -f "$LAUNCH_STORYBOARD" ] || { echo "❌ Fichiers requis manquants"; exit 1; }

          xcrun ibtool --warnings --errors --notices "$LAUNCH_STORYBOARD"
          TEST_DIR="/tmp/FCVV-LaunchScreen.storyboardc"
          rm -rf "$TEST_DIR"
          xcrun ibtool --compile "$TEST_DIR" "$LAUNCH_STORYBOARD"
          
          [ -f "$TEST_DIR/Info.plist" ] || { echo "❌ Échec de la compilation du storyboard"; exit 1; }
          plutil -lint "$TEST_DIR/Info.plist"
          
          echo "✓ Launch Screen configuré et compilé avec succès."

      # ============================================================
      # 13bis. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # ============================================================
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      
      # ============================================================
      # 13ter. INSTALL PROVISIONING PROFILE
      # ============================================================
      - name: Install App Store provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision"
          if [ ! -s "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision" ]; then
            echo "ERREUR : provisioning profile vide."
            exit 1
          fi
          echo "Provisioning profile installé."
          # --------------------------------------------------------
          # Extraction des informations du profil
          # --------------------------------------------------------
          security cms \
            -D \
            -i "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision" \
            > "$RUNNER_TEMP/fcvv-profile.plist"
          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          
          
          PROFILE_APS_ENVIRONMENT=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$RUNNER_TEMP/fcvv-profile.plist" \
              2>/dev/null || true
          )
          
          echo "Profile APNs Environment = $PROFILE_APS_ENVIRONMENT"
          
          if [ "$PROFILE_APS_ENVIRONMENT" != "production" ]; then
            echo "ERREUR : le provisioning profile n'est pas configuré pour APNs production."
            exit 1
          fi
          echo "Profile Name = $PROFILE_NAME"
          echo "Profile UUID = $PROFILE_UUID"
          echo "Profile App ID = $PROFILE_APP_ID"
          if [ "$PROFILE_NAME" != "FCVV AppStore Distribution" ]; then
            echo "ERREUR : nom du provisioning profile inattendu."
            exit 1
          fi
          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}" ]; then
            echo "ERREUR : App ID du provisioning profile incorrect."
            exit 1
          fi
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Provisioning profile validé."
      
      # ============================================================
      # 13quater. CONFIGURE RELEASE CODE SIGNING
      # ============================================================
      - name: Configure Release code signing
        shell: bash
        env:
          TARGET_NAME: fcvv
        run: |
          set -euo pipefail
          echo "=== CONFIGURE RELEASE CODE SIGNING ==="

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.xcodeproj" -type d -print -quit)"
          [ -n "$PROJECT_FILE" ] || { echo "❌ Aucun .xcodeproj trouvé"; exit 1; }

          WORKSPACE_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.xcworkspace" -type d -print -quit)"
          [ -n "$WORKSPACE_PATH" ] || { echo "❌ Aucun .xcworkspace trouvé"; exit 1; }

          echo "✓ Projet : $PROJECT_FILE"
          echo "✓ Workspace : $WORKSPACE_PATH"

          # Configuration via Ruby
          ruby - "$PROJECT_FILE" "$TARGET_NAME" "$APPLE_TEAM_ID" "$APP_BUNDLE_ID" "$PROVISIONING_PROFILE_NAME" <<'RUBY'
          require 'xcodeproj'

          project_path = ARGV[0]
          target_name  = ARGV[1]
          team_id      = ARGV[2]
          bundle_id    = ARGV[3]
          profile_name = ARGV[4]

          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == target_name } || abort("❌ Target '#{target_name}' introuvable")

          puts "✓ Target application trouvé : #{target.name}"

          target.build_configurations.each do |config|
            puts "\n--- Configuration : #{config.name} ---"
            
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
            config.build_settings['DEVELOPMENT_TEAM'] = team_id
            config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'

            if config.name == 'Release'
              puts "↳ Application des paramètres de signature Distribution (Manuel)"
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = profile_name
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = "#{target_name}.entitlements"
            else
              puts "↳ Nettoyage des profils manuels pour la configuration non-release"
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]')
              config.build_settings.delete('CODE_SIGN_IDENTITY[sdk=iphoneos*]')
            end
          end

          project.save
          puts "\n✓ Configuration Xcode enregistrée avec succès."
          RUBY

          # Vérification du fichier project.pbxproj
          echo ""
          echo "=== VÉRIFICATION DU PROJECT.PBXPROJ ==="
          grep -n -E 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER' "$PROJECT_FILE/project.pbxproj" || true

          # Vérification finale de la signature via xcodebuild
          echo ""
          echo "=== VÉRIFICATION SIGNATURE APPLICATION ==="
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -showBuildSettings \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE|CODE_SIGN_ENTITLEMENTS|CLANG_ENABLE_MODULES' \
            || true

          # Vérification des Pods
          echo ""
          echo "=== VÉRIFICATION PODS ==="
          PODS_DIR="$(dirname "$PROJECT_FILE")/Pods"
          if [ -d "$PODS_DIR" ] && grep -R -n -E 'PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE[[:space:]]*=' "$PODS_DIR" --include="*.xcconfig" --include="project.pbxproj" 2>/dev/null; then
            echo "❌ ERREUR : un provisioning profile est encore présent dans les Pods."
            exit 1
          else
            echo "✓ OK : aucun provisioning profile manuel trouvé dans les Pods."
          fi

      # ============================================================
      # 18. ARCHIVE DEVICE / IPHONEOS
      # ============================================================
      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_PATH="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcworkspace"
          PROJECT_FILE="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcodeproj/project.pbxproj"
          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/FCVV.xcarchive"
          ARCHIVE_LOG="$GITHUB_WORKSPACE/build/archive.log"

          # ============================================================
          # NETTOYAGE
          # ============================================================
          echo "============================================================"
          echo "          NETTOYAGE DERIVED DATA"
          echo "============================================================"

          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          echo "✓ DerivedData nettoyé"
          echo "✓ build/ CONSERVÉ"

          cd "$GITHUB_WORKSPACE/fcvv-ios"

          # ============================================================
          # INFORMATIONS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             ARCHIVE IPHONEOS FCVV"
          echo "============================================================"

          echo ""
          echo "===== IDENTITÉS DE SIGNATURE ====="

          security find-identity \
            -v \
            -p codesigning \
            signing_temp.keychain

          # ============================================================
          # BUILD SETTINGS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                 BUILD SETTINGS FCVV"
          echo "============================================================"

          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_NAME}" \
            CLANG_ENABLE_MODULES=YES \
            | grep -E \
              'TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS|CLANG_ENABLE_MODULES|SDKROOT|IPHONEOS_DEPLOYMENT_TARGET|LIBRARY_SEARCH_PATHS|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS' \
            || true

          # ============================================================
          # RSYNC
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     VERIFICATION RSYNC"
          echo "============================================================"

          echo "PATH = $PATH"

          command -v rsync || true
          rsync --version || true
          /usr/bin/rsync --version || true
          type -a rsync || true

          # ============================================================
          # SDL SOURCE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL SOURCE AVANT ARCHIVE"
          echo "============================================================"

          echo ""
          echo "===== TOUTES LES COPIES SDL_uikitappdelegate.m ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -print

          echo ""
          echo "===== FCVV DANS LES SOURCES SDL ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -exec grep -Hn \
              "fcvvConfigureFirebaseAndNotifications" {} \; \
            || true

          echo ""
          echo "===== STRINGS [FCVV] DANS LES SOURCES SDL ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -exec grep -Hn \
              "\[FCVV\]" {} \; \
            || true

          # ============================================================
          # OBJET SDL_uikitappdelegate.o
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL_UKITAPPDELEGATE.O"
          echo "============================================================"

          SDL_OBJ="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64/SDL2-2.28.5/Xcode/SDL/build/SDL.build/Release-iphoneos/Static Library-iOS.build/Objects-normal/arm64/SDL_uikitappdelegate.o"

          if [ -f "$SDL_OBJ" ]; then

            echo ""
            echo "Objet trouvé :"
            echo "$SDL_OBJ"

            echo ""
            echo "===== CHAÎNES FCVV DANS .O ====="

            strings "$SDL_OBJ" \
              | grep -E "\[FCVV\]|fcvvConfigureFirebaseAndNotifications|Firebase|APNs" \
              || true

            echo ""
            echo "===== SYMBOLES FCVV DANS .O ====="

            nm "$SDL_OBJ" \
              | grep -i fcvv \
              || true

          else
            echo "⚠️ SDL_uikitappdelegate.o introuvable"
          fi

          # ============================================================
          # ARTEFACTS SDL2
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             ARTEFACTS SDL2 IPHONEOS"
          echo "============================================================"

          SDL_DEVICE_DIR="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64"

          if [ -d "$SDL_DEVICE_DIR" ]; then

            echo ""
            echo "Répertoire SDL device :"
            echo "$SDL_DEVICE_DIR"

            echo ""
            echo "===== FICHIERS SDL ====="

            find "$SDL_DEVICE_DIR" \
              -type f \
              \( \
                -name "*.a" \
                -o -name "*.framework" \
                -o -name "*.xcframework" \
                -o -name "*.dylib" \
                -o -name "*.o" \
              \) \
              -print

          else
            echo "⚠️ Répertoire SDL device introuvable :"
            echo "$SDL_DEVICE_DIR"
          fi

          # ============================================================
          # RECHERCHE LIBSDL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             RECHERCHE LIBRAIRIES SDL"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/build" \
            -type f \
            \( \
              -name "libSDL*.a" \
              -o -name "SDL*.framework" \
              -o -name "SDL*.xcframework" \
              -o -name "libSDL*.dylib" \
            \) \
            -print \
            || true

          # ============================================================
          # STRINGS FCVV DANS LES ARTEFACTS SDL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "       [FCVV] DANS LES ARTEFACTS SDL2"
          echo "============================================================"

          SDL_ARTIFACT_FOUND=0
          SDL_FCVV_FOUND=0

          while IFS= read -r SDL_ARTIFACT; do

            SDL_ARTIFACT_FOUND=1

            echo ""
            echo "------------------------------------------------------------"
            echo "Artefact : $SDL_ARTIFACT"
            echo "------------------------------------------------------------"

            file "$SDL_ARTIFACT" || true

            if strings "$SDL_ARTIFACT" 2>/dev/null \
              | grep -E \
                "\[FCVV\]|Initialisation Firebase|Autorisation notifications|registerForRemoteNotifications|fcvvConfigureFirebaseAndNotifications" \
              | sort -u
            then
              echo "✓✓✓ FCVV TROUVÉ DANS CET ARTEFACT SDL ✓✓✓"
              SDL_FCVV_FOUND=1
            else
              echo "⚠️ aucune chaîne FCVV dans cet artefact"
            fi

          done < <(
            find "$GITHUB_WORKSPACE/build" \
              -type f \
              \( \
                -name "libSDL*.a" \
                -o -name "libSDL*.dylib" \
              \) \
              -print
          )

          if [ "$SDL_ARTIFACT_FOUND" -eq 0 ]; then
            echo ""
            echo "⚠️ Aucun libSDL*.a / libSDL*.dylib trouvé."
            echo "Il faut probablement chercher un framework SDL2."
          fi

          # ============================================================
          # XCFRAMEWORK SDL UTILISÉ PAR XCODE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             XCFRAMEWORK UTILISÉ PAR XCODE"
          echo "============================================================"

          SDL_XCFRAMEWORK="$GITHUB_WORKSPACE/dist/xcframework/libSDL2.xcframework"

          echo ""
          echo "===== CONTENU XCFRAMEWORK ====="

          find "$SDL_XCFRAMEWORK" \
            -type f \
            | sort \
            || true

          echo ""
          echo "===== FCVV DANS LES .A DU XCFRAMEWORK ====="

          find "$SDL_XCFRAMEWORK" \
            -type f \
            -name "*.a" \
            | while read -r LIB; do

                echo ""
                echo "------------------------------------------------------------"
                echo "$LIB"
                echo "------------------------------------------------------------"

                strings "$LIB" \
                  | grep -E "\[FCVV\]|fcvvConfigureFirebaseAndNotifications|registerForRemoteNotifications" \
                  || true

              done

          # ============================================================
          # REFERENCES SDL DANS XCODE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             REFERENCES SDL DANS XCODE"
          echo "============================================================"

          echo ""
          echo "===== SDL DANS project.pbxproj ====="

          grep -n \
            -E "SDL2|libSDL|SDL.framework|SDL2.framework" \
            "$PROJECT_FILE" \
            | head -100 \
            || true

          echo ""
          echo "===== build/sdl2 DANS LE PROJET ====="

          grep -Rni \
            "build/sdl2" \
            "$GITHUB_WORKSPACE/fcvv-ios" \
            | head -100 \
            || true

          echo ""
          echo "===== SDL_uikitappdelegate.m DANS project.pbxproj ====="

          grep -n \
            "SDL_uikitappdelegate.m" \
            "$PROJECT_FILE" \
            || true

          # ============================================================
          # ARCHIVE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     XCODEBUILD ARCHIVE"
          echo "============================================================"

          echo "Log complet : $ARCHIVE_LOG"

          mkdir -p "$(dirname "$ARCHIVE_LOG")"

          xcodebuild archive \
            -verbose \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            MARKETING_VERSION="${APP_VERSION}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_NAME}" \
            CLANG_ENABLE_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$ARCHIVE_LOG"

          # ============================================================
          # VERIFICATION ARCHIVE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION ARCHIVE"
          echo "============================================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ ERREUR : archive absente."
            exit 1
          fi

          if [ ! -d "$ARCHIVE_PATH/Products/Applications/fcvv.app" ]; then
            echo "❌ ERREUR : fcvv.app absente."
            exit 1
          fi

          echo "✓ Archive créée : $ARCHIVE_PATH"
          echo "✓ fcvv.app présente"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

          # ============================================================
          # SDL DANS ARCHIVE.LOG
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL DANS ARCHIVE.LOG"
          echo "============================================================"

          echo ""
          echo "===== SDL_uikitappdelegate.m ====="

          grep -n \
            "SDL_uikitappdelegate.m" \
            "$ARCHIVE_LOG" \
            || true

          echo ""
          echo "===== build/sdl2 ====="

          grep -n \
            "build/sdl2" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          echo ""
          echo "===== iphoneos-arm64 ====="

          grep -n \
            "iphoneos-arm64" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          echo ""
          echo "===== libSDL ====="

          grep -n \
            -E "libSDL|SDL2.framework|SDL2.xcframework" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          # ============================================================
          # BINAIRE FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION BINAIRE FINAL"
          echo "============================================================"

          APP_PATH="$ARCHIVE_PATH/Products/Applications/fcvv.app"
          APP_BINARY="$APP_PATH/fcvv"

          if [ ! -f "$APP_BINARY" ]; then
            echo "❌ ERREUR : binaire final introuvable :"
            echo "$APP_BINARY"
            exit 1
          fi

          echo "✓ Binaire final trouvé :"
          echo "$APP_BINARY"

          file "$APP_BINARY"

          # ============================================================
          # FCVV DANS BINAIRE FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                 FCVV DANS BINAIRE FINAL"
          echo "============================================================"

          FCVV_STRINGS=$(
            strings "$APP_BINARY" \
              | grep -E \
                "\[FCVV\]|Initialisation Firebase|Autorisation notifications|registerForRemoteNotifications|fcvvConfigureFirebaseAndNotifications" \
              | sort -u \
              || true
          )

          if [ -z "$FCVV_STRINGS" ]; then
            echo "⚠️ AUCUNE chaîne FCVV dans le binaire final."
          else
            echo "✓✓✓ FCVV TROUVÉ DANS LE BINAIRE FINAL ✓✓✓"
            echo ""
            echo "$FCVV_STRINGS"
          fi

          # ============================================================
          # FIREBASE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     FIREBASE FINAL"
          echo "============================================================"

          strings "$APP_BINARY" \
            | grep -E \
              "Firebase|FIRApp|FIRMessaging" \
            | head -50 \
            || true

          # ============================================================
          # NOTIFICATIONS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                NOTIFICATIONS FINAL"
          echo "============================================================"

          strings "$APP_BINARY" \
            | grep -E \
              "registerForRemoteNotifications|requestAuthorization|UNUserNotificationCenter|UNUserNotificationCenterDelegate" \
            | head -50 \
            || true

          # ============================================================
          # DIAGNOSTIC FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     DIAGNOSTIC FINAL"
          echo "============================================================"

          echo ""
          echo "SDL_FCVV_FOUND = $SDL_FCVV_FOUND"

          if [ "$SDL_FCVV_FOUND" -eq 1 ]; then
            echo "✓ Le code FCVV est présent dans un artefact SDL2."
            echo "→ Le problème est probablement le linkage de cet artefact dans fcvv."
          else
            echo "⚠️ Le code FCVV n'est présent dans aucun artefact SDL2 détecté."
            echo "→ Le .m modifié n'est probablement pas recompilé dans SDL2."
          fi

          if [ -n "$FCVV_STRINGS" ]; then
            echo "✓ Le code FCVV est présent dans le binaire final."
          else
            echo "⚠️ Le code FCVV n'est PAS présent dans le binaire final."
          fi

          echo ""
          echo "============================================================"
          echo "                      CHEMINS FINAUX"
          echo "============================================================"

          echo ""
          echo "============================================================"
          echo "               COMPARAISON SDL COMPLETE"
          echo "============================================================"
          echo ""
          echo "source SDL_uikitappdelegate.m : OUI"

          echo ""
          echo "Recherche FCVV dans SDL_uikitappdelegate.o"

          strings "$SDL_OBJ" 2>/dev/null \
            | grep -q "\[FCVV\]"

          if [ $? -eq 0 ]; then
            echo "✓ FCVV présent dans SDL_uikitappdelegate.o"
          else
            echo "❌ FCVV absent de SDL_uikitappdelegate.o"
          fi

          echo ""
          echo "Recherche FCVV dans libSDL2.a"

          SDL_LIB="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64/SDL2-2.28.5/Xcode/SDL/build/Release-iphoneos/libSDL2.a"
          strings "$SDL_LIB" 2>/dev/null \
            | grep -q "\[FCVV\]"

          if [ $? -eq 0 ]; then
            echo "✓ FCVV présent dans libSDL2.a"
          else
            echo "❌ FCVV absent de libSDL2.a"
          fi

          echo ""
          echo "Recherche FCVV dans le binaire final"

          if [ -n "$FCVV_STRINGS" ]; then
            echo "✓ FCVV présent dans fcvv.app"
          else
            echo "❌ FCVV absent dans fcvv.app"
          fi

          echo ""
          echo "Archive :"
          echo "$ARCHIVE_PATH"

          echo ""
          echo "Binaire :"
          echo "$APP_BINARY"

          echo ""
          echo "Log Xcode :"
          echo "$ARCHIVE_LOG"

          echo ""
          echo "============================================================"
          echo "                     FIN ÉTAPE 18"
          echo "============================================================"
          
      
      # ============================================================
      # 19. EXPORT IPA
      # ============================================================
      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail

          # ==========================================================
          # IMPORTANT :
          # Utiliser uniquement les outils système Apple pour
          # le processus d'export Xcode.
          # ==========================================================
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"

          echo "============================================================"
          echo "              ENVIRONNEMENT EXPORT XCODE"
          echo "============================================================"

          echo "PATH=$PATH"

          echo ""
          echo "===== RSYNC UTILISÉ ====="
          command -v rsync
          rsync --version | head -n 5

          echo ""
          echo "===== RSYNC APPLE EXPLICITE ====="
          /usr/bin/rsync --version | head -n 5

          echo ""
          echo "===== XCODEBUILD ====="
          command -v xcodebuild
          xcodebuild -version

          echo ""
          echo "===== TYPE RSYNC ====="
          type -a rsync || true

          # ==========================================================
          # Variables
          # ==========================================================
          EXPORT_DIR="$GITHUB_WORKSPACE/build/export"
          EXPORT_OPTIONS="$GITHUB_WORKSPACE/build/ExportOptions.plist"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          # ==========================================================
          # Vérification de l'archive
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION ARCHIVE"
          echo "============================================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERREUR : archive introuvable : $ARCHIVE_PATH"
            exit 1
          fi

          APP_PATH="$ARCHIVE_PATH/Products/Applications/fcvv.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERREUR : application introuvable dans l'archive :"
            echo "$APP_PATH"

            find "$ARCHIVE_PATH" \
              -maxdepth 5 \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Archive : $ARCHIVE_PATH"
          echo "Application : $APP_PATH"

          # ==========================================================
          # Signature
          # ==========================================================
          echo ""
          echo "===== CODE SIGNATURE DE L'ARCHIVE ====="

          codesign -dvvv "$APP_PATH" 2>&1 | \
            grep -E \
              'Identifier=|Authority=|TeamIdentifier=|Signature=' \
              || true

          # ==========================================================
          # Entitlements
          # ==========================================================
          echo ""
          echo "===== ENTITLEMENTS DE L'ARCHIVE ====="

          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true

          # ==========================================================
          # Provisioning profile
          # ==========================================================
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then

            echo ""
            echo "===== PROVISIONING PROFILE DE L'ARCHIVE ====="

            PROFILE_PLIST="$RUNNER_TEMP/archive-profile.plist"

            security cms \
              -D \
              -i "$APP_PATH/embedded.mobileprovision" \
              -o "$PROFILE_PLIST"

            echo "Profile Name :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$PROFILE_PLIST" \
              || true

            echo "Application Identifier :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$PROFILE_PLIST" \
              || true

            echo "Team Identifier :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.team-identifier' \
              "$PROFILE_PLIST" \
              || true

            echo "Expiration :"
            /usr/libexec/PlistBuddy \
              -c 'Print :ExpirationDate' \
              "$PROFILE_PLIST" \
              || true

          else
            echo "ATTENTION : aucun embedded.mobileprovision trouvé."
          fi

          # ==========================================================
          # Création ExportOptions.plist
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "              CREATION EXPORT OPTIONS"
          echo "============================================================"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>

              <key>uploadSymbols</key>
              <true/>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          # ==========================================================
          # Validation plist
          # ==========================================================
          echo ""
          echo "===== VALIDATION EXPORT OPTIONS ====="

          plutil -lint "$EXPORT_OPTIONS"

          echo ""
          echo "===== EXPORT OPTIONS ====="
          cat "$EXPORT_OPTIONS"

          # ==========================================================
          # Export
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "                    EXPORT IPA"
          echo "============================================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          EXPORT_STATUS=${PIPESTATUS[0]}

          set -e

          # ==========================================================
          # DIAGNOSTIC EN CAS D'ÉCHEC
          # ==========================================================
          if [ "$EXPORT_STATUS" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "              EXPORT IPA EN ECHEC"
            echo "============================================================"

            echo ""
            echo "===== CODE RETOUR XCODEBUILD ====="
            echo "$EXPORT_STATUS"

            echo ""
            echo "===== LOG XCODEBUILD ====="
            cat "$GITHUB_WORKSPACE/build/export.log" || true

            echo ""
            echo "===== DISTRIBUTION LOGS SOUS RUNNER_TEMP ====="

            find "$RUNNER_TEMP" \
              -type d \
              -name "*.xcdistributionlogs" \
              -print \
              2>/dev/null || true

            echo ""
            echo "===== DISTRIBUTION LOGS SOUS /var/folders ====="

            find /var/folders \
              -type d \
              -name "*.xcdistributionlogs" \
              -print \
              2>/dev/null || true

            # ======================================================
            # Recherche du dernier distribution log Xcode
            # ======================================================
            echo ""
            echo "===== RECHERCHE DU DISTRIBUTION LOG XCODE ====="

            DISTRIBUTION_LOG=$(
              find /var/folders \
                -type d \
                -name "*.xcdistributionlogs" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1
            )

            if [ -n "$DISTRIBUTION_LOG" ] && [ -d "$DISTRIBUTION_LOG" ]; then

              echo ""
              echo "Distribution log trouvé :"
              echo "$DISTRIBUTION_LOG"

              echo ""
              echo "===== CONTENU DU DISTRIBUTION LOG ====="

              find "$DISTRIBUTION_LOG" \
                -maxdepth 3 \
                -type f \
                -print \
                2>/dev/null \
                || true

              echo ""
              echo "===== ERREURS DISTRIBUTION ====="

              grep -RniE \
                'error|failed|failure|invalid|provision|signing|certificate|codesign|copy|rsync|extended-attributes|permission|operation not permitted' \
                "$DISTRIBUTION_LOG" \
                2>/dev/null \
                | head -n 300 \
                || true

              echo ""
              echo "===== IDEDistributionPipeline.log ====="

              PIPELINE_LOG="$DISTRIBUTION_LOG/IDEDistributionPipeline.log"

              if [ -f "$PIPELINE_LOG" ]; then
                cat "$PIPELINE_LOG"
              else
                echo "IDEDistributionPipeline.log introuvable."
              fi

            else

              echo "Aucun .xcdistributionlogs trouvé sous /var/folders."

            fi

          fi

          # ==========================================================
          # Recherche IPA
          # ==========================================================
          IPA_PATH=$(
            find "$EXPORT_DIR" \
              -maxdepth 1 \
              -name "*.ipa" \
              -type f \
              -print \
              -quit
          )

          if [ -z "$IPA_PATH" ]; then

            echo ""
            echo "ERREUR : aucun .ipa généré."

            echo ""
            echo "===== CONTENU DE EXPORT_DIR ====="

            find "$EXPORT_DIR" \
              -maxdepth 3 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo ""
          echo "IPA = $IPA_PATH"

          # ==========================================================
          # Copie finale
          # ==========================================================
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          FINAL_IPA="$GITHUB_WORKSPACE/artifacts/FCVV-${APP_VERSION}-${GITHUB_RUN_NUMBER}.ipa"

          cp "$IPA_PATH" "$FINAL_IPA"

          echo "FINAL_IPA=$FINAL_IPA" >> "$GITHUB_ENV"

          echo ""
          echo "============================================================"
          echo "              IPA CRÉÉ AVEC SUCCÈS"
          echo "============================================================"

          ls -lh "$FINAL_IPA"

      # ============================================================
      # 21. UPLOAD SIGNED IPA ARTIFACT
      # ============================================================
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcvv-ipa-${{ github.run_number }}
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
      
      # ============================================================
      # 22. INSTALL TRANSPORTER
      # ============================================================
      - name: Install Transporter
        run: |
          curl -fsSL \
            "https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/" \
            -o /tmp/itmstransporter.pkg
      
          sudo installer \
            -pkg /tmp/itmstransporter.pkg \
            -target /
      
          /usr/local/itms/bin/iTMSTransporter -help
      
      # ============================================================
      # 23. UPLOAD TESTFLIGHT
      # ============================================================
      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.FINAL_IPA }}
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          backend: transporter
          wait-for-processing: true
          uses-non-exempt-encryption: false
