name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios>=1.3.0" pillow requests urllib3 pyyaml

      - name: Clean kivy-ios cache
        run: |
          rm -rf ~/.kivy-ios
      
      
      - name: Create Kivy-iOS directory
        run: mkdir -p "$HOME/.kivy-ios"

      - name: Cache kivy-ios
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v4-python310
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v4-
            
      - name: Validate cache and Build
        run: |
          set -euxo pipefail
          
          echo "===== Informations kivy-ios ====="
          which toolchain
          toolchain recipes
          toolchain status || true
          
          echo "===== Contenu ~/.kivy-ios ====="
          ls -la "$HOME/.kivy-ios" || true
          find "$HOME/.kivy-ios" -maxdepth 3 || true
          
          echo "===== Compilation des recettes ====="
          toolchain build python3 kivy openssl pillow
          
          toolchain pip install pyyaml requests urllib3
          
          find ~/.kivy-ios -path "*site-packages*" -iname "*yaml*"
           
      
      - name: Inspect build output
        run: |
          set -euxo pipefail
          echo "===== Vérification des recettes ====="
          toolchain status || true
          
          echo "===== Répertoire courant ====="
          pwd
          ls -la
          
          echo "===== DIST ====="
          [ -d dist ] && du -sh dist || echo "dist absent"
          [ -d dist ] && find dist -maxdepth 3 || true
          
          echo "===== BUILD ====="
          [ -d build ] && du -sh build || echo "build absent"
          [ -d build ] && find build -maxdepth 3 || true
          
          echo "===== Recherche Python ====="
          find dist -iname "*python*" 2>/dev/null || true
          find build -iname "*python*" 2>/dev/null || true
          
          echo "===== Recherche site-packages ====="
          find dist -iname "site-packages" 2>/dev/null || true
          find build -iname "site-packages" 2>/dev/null || true
          
          echo "===== Recherche yaml ====="
          find dist -iname "*yaml*" 2>/dev/null || true
          find build -iname "*yaml*" 2>/dev/null || true
          
          echo "===== Recherche requests ====="
          find dist -iname "*requests*" 2>/dev/null || true
          find build -iname "*requests*" 2>/dev/null || true
          
          echo "===== XCFramework ====="
          find dist -iname "*.xcframework" 2>/dev/null || true
          
          echo "===== Librairies Python ====="
          find dist -iname "libpython*" 2>/dev/null || true
          
          echo "===== PYTHON LIB SEARCH ====="
          
          find "$HOME/.kivy-ios" \
            -type d \
            -name "site-packages" \
            -o -name "python3"
          
          find . \
            -type d \
            -name "site-packages"
          
          

      - name: Prepare sources
        run: |
          rm -rf ios_src
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" --exclude="ios_src" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist
          # Nettoyage des fichiers temporaires
          find ios_src -name "__pycache__" -type d -exec rm -rf {} +
          find ios_src -name "*.pyc" -delete

      - name: Create Xcode project and Pods
        run: |
          set -euxo pipefail
          
          echo "===== Toolchain info ====="
          toolchain status || true
          
          echo "===== Dist avant create ====="
          find dist -maxdepth 2 2>/dev/null || true
          
          echo "===== Build avant create ====="
          find build -maxdepth 2 2>/dev/null || true

          toolchain create FCVV ios_src
          
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          [ -n "$PROJECT_FILE" ] || { echo "Projet Xcode introuvable"; exit 1; }
          
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          
          echo "===== Arborescence ====="
          find "$PROJ_DIR" -maxdepth 3
          echo "===== Recherche Python ====="
          find "$PROJ_DIR" -iname "*python*"
          echo "===== Recherche site-packages ====="
          find "$PROJ_DIR" -iname "site-packages"
          
          echo "===== Recherche yaml ====="
          find "$PROJ_DIR" -iname "*yaml*" || true
          echo "===== Recherche requests ====="
          find "$PROJ_DIR" -iname "*requests*" || true
          echo "===== Recherche lib ====="
          find "$PROJ_DIR" -type d -name "lib"
          echo "===== Taille du projet ====="
          du -sh "$PROJ_DIR"
          
          echo "===== Vérification du bundle Python ====="
          find "$PROJ_DIR" -type d -name "site-packages"
          find "$PROJ_DIR" -iname "yaml"
          find "$PROJ_DIR" -iname "_yaml*"
          find "$PROJ_DIR" -iname "PyYAML*"
          
          echo "===== FIN DEBUG ====="

          PROJ_NAME=$(basename "$PROJECT_FILE")

          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 -name "*-Info.plist" | head -1)

          echo "Projet : $PROJECT_FILE"

          plutil -convert xml1 "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier org.fcvv.fcvv" \
            "$PLIST_FILE"
            
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string FCVV" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName FCVV" "$PLIST_FILE" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string FCVV" "$PLIST_FILE"

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 9.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' \
            "$PROJECT_FILE/project.pbxproj"

          if [ -d assets/Images.xcassets ]; then
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            cp -R assets/Images.xcassets "$PROJ_DIR/fcvv/"
          fi

          cat > "$PROJ_DIR/Podfile" <<EOF
          platform :ios, '13.0'
          
          use_modular_headers!

          project '$PROJ_NAME'

          target 'fcvv' do
            pod 'FirebaseCore', '10.29.0'
            pod 'FirebaseMessaging', '10.29.0'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          end
          EOF

          cd "$PROJ_DIR"

          rm -rf Pods
          rm -f Podfile.lock
          rm -rf *.xcworkspace

          pod deintegrate || true
          
          rm -rf Pods
          rm -f Podfile.lock
          rm -rf *.xcworkspace
          
          pod repo update
          pod --version
          ruby --version
          xcodebuild -version
          pod install
          
          echo "===== OTHER_LDFLAGS ====="
          grep -n "OTHER_LDFLAGS" fcvv.xcodeproj/project.pbxproj || true
          
          echo "===== HEADER_SEARCH_PATHS ====="
          grep -n "HEADER_SEARCH_PATHS" fcvv.xcodeproj/project.pbxproj || true
          
          echo "===== GCC_PREPROCESSOR_DEFINITIONS ====="
          grep -n "GCC_PREPROCESSOR_DEFINITIONS" fcvv.xcodeproj/project.pbxproj || true

          echo "===== PODFILE LOCK ====="
          cat Podfile.lock

          echo "===== WORKSPACE ====="
          find . -name "*.xcworkspace"
          
          echo "===== FIREBASE PODS ====="
          find Pods -iname "*Firebase*"
          
          echo "===== GOOGLE SERVICE (PROJET) ====="
          find . -name "GoogleService-Info.plist" || true
          
          

      - name: Build simulator
        run: |
          set -euxo pipefail

          WORKSPACE_PATH=$(find "$PWD" -name "*.xcworkspace" | head -1)

          echo "Workspace : $WORKSPACE_PATH"

          xcrun simctl erase "iPhone 15" || true

          xcodebuild \
            clean build \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          echo "===== GOOGLE SERVICE (APP GENEREE) ====="
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          find "$APP_PATH" -name "GoogleService-Info.plist" || true

      - name: Package app
        run: |
          # 1. On trouve le dossier .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          
          # 2. On se déplace dans le répertoire parent pour que le zip 
          # contienne le dossier .app et non tout le chemin absolu
          cd "$(dirname "$APP_PATH")"
          
          # 3. Zip sans -j (junk paths)
          zip -r "$GITHUB_WORKSPACE/fcvv.zip" "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-app
          path: fcvv.zip