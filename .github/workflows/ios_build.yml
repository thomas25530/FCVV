name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Utilisation de macOS 14 (recommandé en 2026 pour Xcode récent)

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11' # Aligné exactement sur ta version de développement

    - name: Installer les outils système macOS
      run: |
        brew install autoconf automake libtool pkg-config cmake
        brew link libtool

    - name: Installer Kivy-ios et Cython
      run: |
        # Cython 0.29.x ou 3.0.x selon les besoins de Kivy-ios, 3.0.11 est très stable pour Kivy 2.3+
        pip install "Cython>=3.0.0,<3.1.0"
        pip install kivy-ios
        pip install pillow # Requis par l'outil de création d'icônes de kivy-ios

    - name: Compiler les recettes Kivy-ios
      run: |
        # On compile uniquement les packages compatibles iOS (on retire 'android' et 'pyjnius')
        # Note : 'openssl' et 'pillow' ont leurs propres recettes dans kivy-ios
        toolchain build python3==3.10.11
        toolchain build kivy openssl pillow

    - name: Installer les dépendances Python pures via Pip (iOS)
      run: |
        # Les modules qui ne contiennent pas de code C/C++ (purs Python) peuvent être installés directement
        # dans le dossier de distribution de la toolchain.
        cd dist/root/python3/lib/python3.10/site-packages
        pip install requests urllib3 charset-normalizer idna certifi pyyaml chardet plyer setuptools --target .

    - name: Créer le projet Xcode
      run: |
        # Création du projet Xcode nommé FCVV à partir du répertoire courant
        toolchain create FCVV .

    - name: Configurer l'icône de l'application
      run: |
        # Utilise l'icône définie dans ton buildozer.spec pour l'injecter dans Xcode
        if [ -f "assets/logo_apk_fcvv.png" ]; then
          toolchain icon FCVV assets/logo_apk_fcvv.png
        else
          echo "Attention : assets/logo_apk_fcvv.png introuvable, l'icône par défaut sera utilisée."
        fi

    - name: Archiver le projet Xcode généré
      uses: actions/upload-artifact@v4
      with:
        name: FCVV-iOS-Xcode-Project
        path: FCVV-ios/