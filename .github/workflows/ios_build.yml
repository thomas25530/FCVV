name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios>=1.3.0" pillow requests urllib3

      - name: Cache kivy-ios
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-${{ hashFiles('buildozer.spec') }}

      - name: Build kivy-ios recipes
        if: steps.cache.outputs.cache-hit != 'true'
        run: toolchain build python3 kivy openssl pillow

      - name: Prepare sources
        run: |
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist

      - name: Create Xcode project and Pods
        run: |
          set -euxo pipefail
          toolchain create FCVV ios_src
          echo "========== TOOLCHAIN =========="
          toolchain --version || true
          echo "========== TREE =========="
          find . -maxdepth 3 | sort
          echo "========== PROJECTS =========="
          find . -name "*.xcodeproj"
          echo "========== WORKSPACES =========="
          find . -name "*.xcworkspace"
          echo "========== PLISTS =========="
          find . -name "*.plist"
          
          PROJ=$(find . -name "*.xcodeproj" | head -1)
          DIR=$(dirname "$PROJ")
          if [ -z "$PROJ" ]; then echo "Aucun projet Xcode trouvé."; exit 1; fi
          
          cat > "$DIR/Podfile" <<EOF
          platform :ios, '13.0'
          project '$PROJ'
          target 'fcvv' do
            pod 'FirebaseCore'
            pod 'FirebaseMessaging'
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['ENABLE_MODULE_VERIFIER'] = 'NO'
              end
            end
          end
          EOF
          cd "$DIR" && pod install
          
          echo "========== PODS =========="
          ls -la
          echo "========== POD VERSION =========="
          pod --version
          echo "========== POD ENV =========="
          pod env || true
          echo "========== CONTENT =========="
          find . -maxdepth 3 | sort

      - name: Full Xcode diagnostics
        run: |
          set -euxo pipefail
          echo "========== XCODE PROJECTS =========="
          find . -name "*.xcodeproj"
          echo "========== WORKSPACES =========="
          find . -name "*.xcworkspace"
          echo "========== PLIST =========="
          find . -name "*.plist"
          PBX=$(find . -name project.pbxproj | head -1)
          if [ -f "$PBX" ]; then
            echo "========== TARGETS =========="
            grep "name =" "$PBX" | sort | uniq || true
            echo "========== BUNDLE ID =========="
            grep "PRODUCT_BUNDLE_IDENTIFIER" "$PBX" | sort | uniq || true
            echo "========== PRODUCT NAME =========="
            grep "productName" "$PBX" || true
            echo "========== INFOPLIST =========="
            grep "INFOPLIST_FILE" "$PBX" || true
          fi
          PROJ=$(find . -name "*.xcodeproj" | head -1)
          [ -n "$PROJ" ] && xcodebuild -list -project "$PROJ"
          WS=$(find . -name "*.xcworkspace" | head -1)
          [ -n "$WS" ] && xcodebuild -list -workspace "$WS"
          echo "========== PODFILE =========="
          find . -name Podfile -exec cat {} \;

      - name: Build simulator
        run: |
          set -euxo pipefail
          WS=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WS" ]; then echo "Workspace introuvable."; exit 1; fi
          SCHEME=$(xcodebuild -list -workspace "$WS" | awk '/^Schemes:/ {getline; gsub(/^[ \t]+/, ""); print; exit}')
          echo "========== SCHEME DETECTE: $SCHEME =========="
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild -workspace "$WS" \
                     -scheme "$SCHEME" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     EXCLUDED_ARCHS=x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          cd "$(dirname "$APP")"
          zip -r "$GITHUB_WORKSPACE/fcvv.zip" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-app
          path: fcvv.zip