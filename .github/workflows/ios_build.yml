          # --------------------------------------------------------

          relative_plist = Pathname.new(plist_path)
            .relative_path_from(Pathname.new(project_dir))
            .to_s

          file_ref = project.files.find do |f|
            f.path == relative_plist ||
            f.path == File.basename(plist_path)
          end

          unless file_ref
            file_ref = project.main_group.new_file(plist_path)
            puts "✓ GoogleService-Info.plist ajouté au projet"
          else
            puts "✓ GoogleService-Info.plist déjà dans le projet"
          end

          resources_phase = target.resources_build_phase

          unless resources_phase.files.any? do |build_file|
            build_file.file_ref == file_ref
          end
            resources_phase.add_file_reference(file_ref)
            puts "✓ GoogleService-Info.plist ajouté aux ressources"
          else
            puts "✓ GoogleService-Info.plist déjà dans les ressources"
          end

          project.save

          puts "✓ Projet Xcode sauvegardé"
          RUBY

          # --------------------------------------------------------
