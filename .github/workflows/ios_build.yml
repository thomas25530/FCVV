name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Installer les outils système macOS
      run: |
        brew install autoconf automake libtool pkg-config cmake
        brew link libtool

    - name: Installer Kivy-ios, Cython et dépendances de l'application
      run: |
        python -m pip install --upgrade pip
        pip install "Cython>=3.0.0,<3.1.0"
        pip install "kivy-ios>=1.3.0"
        pip install pillow
        pip install requests urllib3 charset-normalizer idna certifi pyyaml chardet plyer setuptools

    - name: Gestion du Cache pour la Toolchain Kivy
      id: cache-kivy-ios
      uses: actions/cache@v4
      with:
        path: ~/.kivy-ios
        key: ${{ runner.os }}-kivy-ios-v1-python3-kivy-openssl-pillow

    - name: Compiler les recettes Kivy-ios (uniquement si pas de cache)
      if: steps.cache-kivy-ios.outputs.cache-hit != 'true'
      run: |
        toolchain build python3 kivy openssl pillow

    - name: Préparer un dossier source propre pour iOS
      run: |
        # 1. Création du conteneur de l'app
        mkdir ios_src
        
        # 2. Copie stricte des fichiers de code à la racine
        cp main.py ios_src/
        cp constants.py ios_src/
        
        # 3. Alignement avec buildozer.spec : Copie de tous les fichiers de données à la racine (*.kv, *.json, *.yaml, *.txt)
        cp *.kv *.json *.yaml *.txt ios_src/ 2>/dev/null || true
        
        # 4. Copie stricte des dossiers requis
        if [ -d "ui" ]; then cp -r ui ios_src/; fi
        if [ -d "core" ]; then cp -r core ios_src/; fi
        if [ -d "assets" ]; then cp -r assets ios_src/; fi

        # 5. Installation des dépendances externes requises par le code
        pip install --target=./ios_src requests urllib3 charset-normalizer idna pyyaml chardet plyer

    - name: Créer le projet Xcode
      run: |
        toolchain create FCVV ./ios_src

    - name: Détecter le dossier Xcode et configurer l'icône
      run: |
        XCODEPROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        XCODEDIR=$(basename $(dirname "$XCODEPROJ_PATH"))
        
        echo "Chemin trouvé : $XCODEPROJ_PATH"
        echo "Dossier cible pour l'icône : $XCODEDIR"
        
        if [ -f "assets/logo_apk_fcvv.png" ] && [ ! -z "$XCODEDIR" ]; then
          toolchain icon "$XCODEDIR" assets/logo_apk_fcvv.png
        else
          echo "Icône manquante ou dossier introuvable, configuration ignorée."
        fi

    - name: Configurer l'orientation en mode Portrait (comme sur Android)
      run: |
        XCODEPROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        INFOPLIST_PATH="$(dirname "$XCODEPROJ_PATH")/fcvv-Info.plist"
        
        if [ -f "$INFOPLIST_PATH" ]; then
          echo "Configuration de l'orientation Portrait unique dans $INFOPLIST_PATH..."
          
          # 1. On vide le tableau des orientations existantes
          plutil -remove UISupportedInterfaceOrientations "$INFOPLIST_PATH" 2>/dev/null || true
          
          # 2. On recrée le tableau avec uniquement la valeur Portrait
          plutil -insert UISupportedInterfaceOrientations -array "$INFOPLIST_PATH"
          plutil -insert UISupportedInterfaceOrientations.0 -string "UIInterfaceOrientationPortrait" "$INFOPLIST_PATH"
        else
          echo "Fichier Info.plist introuvable, utilisation des orientations par défaut."
        fi

    - name: Compiler le projet Xcode pour Simulateur (Génération du .app)
      run: |
        XCODEPROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        XCODENAME=$(basename "$XCODEPROJ_PATH" .xcodeproj)
        
        echo "Compilation de $XCODENAME pour le simulateur..."
        
        xcodebuild -project "$XCODEPROJ_PATH" \
                   -scheme "$XCODENAME" \
                   -configuration Debug \
                   -sdk iphonesimulator \
                   -arch arm64 \
                   CODE_SIGNING_ALLOWED=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=13.0

    - name: Localiser et compresser le fichier .app pour Appetize
      run: |
        # 1. On trouve où Xcode a caché le fichier .app construit
        APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
        echo "Application trouvée à l'emplacement : $APP_PATH"
        
        # 2. On se déplace dans le dossier parent pour zipper proprement uniquement le .app
        cd "$(dirname "$APP_PATH")"
        zip -r "$GITHUB_WORKSPACE/fcvv.zip" "$(basename "$APP_PATH")"
        
        echo "Fichier fcvv.zip créé avec succès à la racine du projet."

    - name: Archiver le fichier zip final pour le téléchargement
      uses: actions/upload-artifact@v4
      with:
        name: fcvv.app.zip
        path: fcvv.zip