name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Installer les outils système macOS
      run: |
        brew install autoconf automake libtool pkg-config cmake
        brew link libtool

    - name: Installer Kivy-ios, Cython et dépendances de l'application
      run: |
        python -m pip install --upgrade pip
        pip install "Cython>=3.0.0,<3.1.0"
        pip install "kivy-ios>=1.3.0"
        pip install pillow
        pip install requests urllib3 charset-normalizer idna certifi pyyaml chardet plyer setuptools

    - name: Compiler les recettes Kivy-ios
      run: |
        toolchain build python3 kivy openssl pillow

    - name: Créer le projet Xcode
      run: |
        toolchain create FCVV .

    - name: Détecter le dossier Xcode et configurer l'icône
      run: |
        XCODEDIR=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1 | cut -d'/' -f2)
        XCODENAME=$(basename "$XCODEDIR" .xcodeproj)
        
        echo "Dossier Xcode détecté : $XCODEDIR"
        echo "Nom du projet détecté : $XCODENAME"
        
        if [ -f "assets/logo_apk_fcvv.png" ] && [ ! -z "$XCODENAME" ]; then
          toolchain icon "$XCODENAME" assets/logo_apk_fcvv.png
        else
          echo "Icône manquante ou projet introuvable."
        fi

    - name: Compiler le projet Xcode pour Simulateur (Génération du .app)
      run: |
        XCODEPROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        XCODENAME=$(basename "$XCODEPROJ_PATH" .xcodeproj)
        
        echo "Compilation de $XCODENAME..."
        
        # On retire CONFIGURATION_BUILD_DIR pour laisser Xcode travailler dans ses dossiers natifs
        xcodebuild -project "$XCODEPROJ_PATH" \
                   -scheme "$XCODENAME" \
                   -configuration Debug \
                   -sdk iphonesimulator \
                   CODE_SIGNING_ALLOWED=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=13.0
                   
    - name: Archiver l'application .app finale
      uses: actions/upload-artifact@v4
      with:
        name: FCVV-iOS-Simulator-App
        # Xcode range le .app dans son dossier "DerivedData" secret, on va le chercher là-bas
        path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app