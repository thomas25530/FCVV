name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Installer les outils système macOS
      run: |
        brew install autoconf automake libtool pkg-config cmake
        brew link libtool

    - name: Installer Kivy-ios, Cython et dépendances de l'application
      run: |
        python -m pip install --upgrade pip
        pip install "Cython>=3.0.0,<3.1.0"
        pip install "kivy-ios>=1.3.0"
        pip install pillow
        # On installe tes modules requis sur l'environnement de build 
        # pour que la toolchain puisse les analyser et les packager
        pip install requests urllib3 charset-normalizer idna certifi pyyaml chardet plyer setuptools

    - name: Compiler les recettes Kivy-ios
      run: |
        toolchain build python3 kivy openssl pillow

    - name: Créer le projet Xcode
      run: |
        toolchain create FCVV .

    - name: Configurer l'icône de l'application
      run: |
        if [ -f "assets/logo_apk_fcvv.png" ]; then
          toolchain icon fcvv assets/logo_apk_fcvv.png
        else
          echo "Attention : assets/logo_apk_fcvv.png introuvable."
        fi

    - name: Archiver le projet Xcode généré
      uses: actions/upload-artifact@v4
      with:
        name: FCVV-iOS-Xcode-Project
        path: fcvv-ios/