name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    env:
      IOS_DEPLOYMENT_TARGET: "15.0"
      APP_BUNDLE_ID: "org.fcvv.fcvv"
      APP_VERSION: "1.1.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PURE_PYTHON: "1"

      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          sudo xcodebuild -license accept
          
          xcodebuild -version
          xcode-select -p
          xcrun --find clang
          xcrun --find swift
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Install and verify Metal Toolchain
        shell: bash
        run: |
          set -euxo pipefail
      
          echo "=== XCODE ==="
          xcodebuild -version
          xcode-select -p
      
          echo "=== INSTALL METAL TOOLCHAIN ==="
          xcodebuild -downloadComponent MetalToolchain
      
          echo "=== VERIFY METAL ==="
          xcrun --find metal
          xcrun metal --version

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      # ============================================================
      # 3. SYSTEM TOOLS
      # ============================================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            cocoapods \
            rsync
          python -m pip install --upgrade pip
          pip install \
            "Cython>=3.0,<3.1" \
            "kivy-ios==2025.5.17" \
            pillow \
            requests \
            urllib3 \
            pyyaml \
            fpdf2 \
            fonttools \
            plyer \
            pyobjus
            
          ruby -e 'require "xcodeproj"; puts "xcodeproj OK"'
      # ============================================================
      # 4. CACHE KIVY-IOS
      # ============================================================
      #- name: Cache kivy-ios
      #  uses: actions/cache@v4
      #  with:
      #    path: |
      #      ~/.kivy-ios
      #    key: ${{ runner.os }}-kivy-ios-v5-python310-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
      #    restore-keys: |
      #      ${{ runner.os }}-kivy-ios-v5-python310-
      #      ${{ runner.os }}-kivy-ios-v5-

      # ============================================================
      # 4B. PATCH SDL RECIPE AVANT COMPILATION
      # ============================================================
      - name: Patch SDL recipe
        shell: bash
        run: |
          set -euo pipefail
      
          echo "===== Recherche SDL_uikitappdelegate.m ====="
      
          find ~/.kivy-ios -name SDL_uikitappdelegate.m -print || true
      
          python3 - <<'PY'
          import kivy_ios
          import pathlib
      
          root = pathlib.Path(kivy_ios.__file__).parent
      
          print("kivy-ios =", root)
      
          for f in root.rglob("SDL_uikitappdelegate.m"):
              print("FOUND:", f)
          PY

          exit 1
      
      # ============================================================
      # 5. BUILD KIVY-IOS RECIPES
      # ============================================================
      - name: Build kivy-ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          rm -rf dist
          rm -rf ~/Library/Caches/pip
          
          toolchain build hostpython3 python3 kivy openssl pillow pyobjus
          toolchain pip install pyyaml requests urllib3 plyer
          
          toolchain pip install defusedxml
          toolchain pip install --no-deps fpdf2

          toolchain pip install --no-deps fonttools

          find dist/root/python3/lib/python3.11/site-packages/yaml \
            -name "_yaml*.so" \
            -delete

          find dist/root/python3/lib/python3.11/site-packages/fontTools \
            -name "*.so" \
            -delete
            
          rm -rf dist/root/python3/lib/python3.11/site-packages/plyer/platforms/ios/frameworks
            

      # ============================================================
      # 6. PREPARE IOS SOURCES
      # ============================================================
      - name: Prepare sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios_src
          mkdir -p ios_src
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".buildozer" \
            --exclude="bin" \
            --exclude="build" \
            --exclude="dist" \
            --exclude="ios_src" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            ./ ios_src/
          if [ -z "${{ secrets.FIREBASE_IOS_CONFIG }}" ]; then
            echo "ERREUR : FIREBASE_IOS_CONFIG est vide."
            exit 1
          fi
          printf '%s\n' '${{ secrets.FIREBASE_IOS_CONFIG }}' \
            > ios_src/GoogleService-Info.plist
          if [ ! -s ios_src/GoogleService-Info.plist ]; then
            echo "ERREUR : GoogleService-Info.plist vide."
            exit 1
          fi
          plutil -lint ios_src/GoogleService-Info.plist
          find ios_src -name "__pycache__" -type d -prune -exec rm -rf {} +
          find ios_src -name "*.pyc" -delete
          echo "Sources iOS préparées."
      
      - name: Check native binaries
        run: |
          find . -type f \( -name "*.dylib" -o -name "*.so" \) -print | sort
      
      
      
      # ============================================================
      # 7. CREATE XCODE PROJECT
      # ============================================================
      - name: Create Xcode project and setup Firebase
        shell: bash
        run: |
          set -euo pipefail
          echo "Création du projet Xcode avec kivy-ios..."
          toolchain create FCVV ios_src
          PROJECT_FILE=$(
            find . \
              -maxdepth 3 \
              -name "*.xcodeproj" \
              -print \
              -quit
          )
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun fichier .xcodeproj trouvé après toolchain create."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"
          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          if [ ! -d "$PROJ_DIR" ]; then
            echo "ERREUR : dossier projet introuvable."
            exit 1
          fi
          cp ios_src/GoogleService-Info.plist \
            "$PROJ_DIR/GoogleService-Info.plist"
          plutil -lint \
            "$PROJ_DIR/GoogleService-Info.plist"
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
            target = project.targets.find do |t|
              t.name == 'fcvv'
            end
            raise 'Target fcvv introuvable' unless target
            existing = project.files.find do |f|
              File.basename(f.path.to_s) == 'GoogleService-Info.plist'
            end
            unless existing
              file = project.main_group.new_file('GoogleService-Info.plist')
              target.resources_build_phase.add_file_reference(file, true)
            else
              unless target.resources_build_phase.files_references.include?(existing)
                target.resources_build_phase.add_file_reference(existing, true)
              end
            end
            project.save
          "
          echo "Firebase plist ajouté au projet."
      # ============================================================
      # 8. VERIFY PROJECT / TARGET
      # ============================================================
      - name: Verify generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE=$(
            find . \
              -maxdepth 3 \
              -name "*.xcodeproj" \
              -print \
              -quit
          )
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : .xcodeproj introuvable."
            exit 1
          fi
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
            puts '===== TARGETS ====='
            project.targets.each do |target|
              puts \"- #{target.name}\"
            end
            target = project.targets.find { |t| t.name == 'fcvv' }
            raise 'ERREUR : target fcvv introuvable' unless target
            puts 'Target fcvv OK.'
          "
      # ============================================================
      # 9. FIREBASE FCM + APNs
      #    Injection sécurisée dans SDLUIKitDelegate
      # ============================================================
      - name: Configure Firebase FCM and APNs
        shell: bash
        env:
          TARGET_NAME: fcvv
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "  CONFIGURATION FIREBASE / FCM / APNs"
          echo "============================================================"

          # --------------------------------------------------------
          # Recherche du projet Xcode
          # --------------------------------------------------------

          XCODEPROJ="$(find . -name "*.xcodeproj" -print -quit)"

          if [ -z "$XCODEPROJ" ]; then
            echo "❌ Aucun fichier .xcodeproj trouvé"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$XCODEPROJ")"

          echo "✓ Projet Xcode : $XCODEPROJ"

          # --------------------------------------------------------
          # Recherche des fichiers SDL
          # --------------------------------------------------------
          
          echo "→ Recherche de SDL_uikitappdelegate.m..."
          
          DELEGATE_M="$(
            find . \
              -type f \
              -name "SDL_uikitappdelegate.m" \
              -print \
              -quit
          )"
          
          DELEGATE_H="$(
            find . \
              -type f \
              -name "SDL_uikitappdelegate.h" \
              -print \
              -quit
          )"
          
          if [ -z "$DELEGATE_M" ]; then
            echo ""
            echo "❌ SDL_uikitappdelegate.m introuvable"
            echo ""
            echo "Fichiers SDL/UIKit trouvés :"
            find . \
              -type f \
              \( \
                -name "*uikit*delegate*" \
                -o \
                -name "*SDL*delegate*" \
              \) \
              -print \
              | head -50
          
            echo ""
            echo "Arborescence des fichiers Objective-C :"
            find . \
              -type f \
              \( -name "*.m" -o -name "*.h" \) \
              -print \
              | grep -Ei 'SDL|UIKit|delegate' \
              | head -100 || true
          
            exit 1
          fi
          
          if [ -z "$DELEGATE_H" ]; then
            echo ""
            echo "❌ SDL_uikitappdelegate.h introuvable"
            exit 1
          fi
          
          echo "✓ Delegate Objective-C : $DELEGATE_M"
          echo "✓ Header Objective-C   : $DELEGATE_H"
          
          export XCODEPROJ
          export PROJECT_DIR
          export DELEGATE_M
          export DELEGATE_H
          export TARGET_NAME

          # --------------------------------------------------------
          # Sauvegarde avant modification
          # --------------------------------------------------------

          cp "$DELEGATE_M" "$DELEGATE_M.before-fcvv"
          cp "$DELEGATE_H" "$DELEGATE_H.before-fcvv"

          echo "✓ Sauvegardes créées"

          # --------------------------------------------------------
          # Vérification de SDLUIKitDelegate
          # --------------------------------------------------------

          if ! grep -qE '@interface[[:space:]]+SDLUIKitDelegate' "$DELEGATE_H"; then
            echo "❌ SDLUIKitDelegate absent du header"
            exit 1
          fi

          if ! grep -qE '@implementation[[:space:]]+SDLUIKitDelegate' "$DELEGATE_M"; then
            echo "❌ SDLUIKitDelegate absent du .m"
            exit 1
          fi

          echo "✓ SDLUIKitDelegate trouvé"

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          python3 <<'PY'
          import os
          from pathlib import Path

          header = Path(os.environ["DELEGATE_H"])
          implementation = Path(os.environ["DELEGATE_M"])

          header_imports = [
              "#import <UIKit/UIKit.h>",
              "#import <UserNotifications/UserNotifications.h>",
              "#import <FirebaseMessaging/FirebaseMessaging.h>",
          ]

          implementation_imports = [
              "#import <UIKit/UIKit.h>",
              "#import <UserNotifications/UserNotifications.h>",
              "#import <FirebaseCore/FirebaseCore.h>",
              "#import <FirebaseMessaging/FirebaseMessaging.h>",
          ]

          def add_imports(path, imports):
              text = path.read_text()

              for imp in imports:
                  if imp not in text:
                      text = imp + "\n" + text

              path.write_text(text)

          add_imports(header, header_imports)
          add_imports(implementation, implementation_imports)

          print("✓ Imports Firebase / APNs vérifiés")
          PY

          # --------------------------------------------------------
          # Ajout des protocoles au header
          #
          # IMPORTANT :
          # on ne remplace pas aveuglément toute la déclaration.
          # --------------------------------------------------------

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          
          path = Path(os.environ["DELEGATE_H"])
          text = path.read_text()
          
          # ----------------------------------------------------------
          # Vérification préalable
          # ----------------------------------------------------------
          
          if "UNUserNotificationCenterDelegate" in text:
              has_un = True
          else:
              has_un = False
          
          if "FIRMessagingDelegate" in text:
              has_fcm = True
          else:
              has_fcm = False
          
          if has_un and has_fcm:
              print("✓ Delegates déjà déclarés")
              raise SystemExit(0)
          
          # ----------------------------------------------------------
          # Recherche souple de @interface SDLUIKitDelegate
          #
          # On ne suppose PAS que la classe hérite directement de
          # NSObject ni que tout soit sur une seule ligne.
          # ----------------------------------------------------------
          
          pattern = re.compile(
              r'(@interface\s+SDLUIKitDelegate\b[^\n]*)(\n)',
              re.MULTILINE
          )
          
          match = pattern.search(text)
          
          if not match:
              print("")
              print("❌ Impossible de localiser @interface SDLUIKitDelegate")
              print("")
              print("Déclarations @interface trouvées dans le header :")
          
              for line in text.splitlines():
                  if "@interface" in line:
                      print("  " + line)
          
              raise RuntimeError(
                  "Impossible de localiser @interface SDLUIKitDelegate"
              )
          
          interface_line = match.group(1)
          
          # ----------------------------------------------------------
          # Ajouter les protocoles sans casser ceux déjà présents
          # ----------------------------------------------------------
          
          protocols_to_add = []
          
          if not has_un:
              protocols_to_add.append("UNUserNotificationCenterDelegate")
          
          if not has_fcm:
              protocols_to_add.append("FIRMessagingDelegate")
          
          # ----------------------------------------------------------
          # Si une liste <...> existe déjà, on l'étend.
          # Sinon on en crée une.
          # ----------------------------------------------------------
          
          protocol_match = re.search(
              r'<([^>]*)>',
              interface_line
          )
          
          if protocol_match:
              existing = [
                  p.strip()
                  for p in protocol_match.group(1).split(",")
                  if p.strip()
              ]
          
              for protocol in protocols_to_add:
                  if protocol not in existing:
                      existing.append(protocol)
          
              new_protocols = "<" + ", ".join(existing) + ">"
          
              new_interface_line = (
                  interface_line[:protocol_match.start()]
                  + new_protocols
                  + interface_line[protocol_match.end():]
              )
          
          else:
              new_interface_line = (
                  interface_line
                  + " <"
                  + ", ".join(protocols_to_add)
                  + ">"
              )
          
          # ----------------------------------------------------------
          # Remplacement uniquement de la ligne @interface
          # ----------------------------------------------------------
          
          text = (
              text[:match.start(1)]
              + new_interface_line
              + text[match.end(1):]
          )
          
          path.write_text(text)
          
          print("✓ Déclaration SDLUIKitDelegate trouvée")
          
          if "UNUserNotificationCenterDelegate" in text:
              print("✓ UNUserNotificationCenterDelegate déclaré")
          
          if "FIRMessagingDelegate" in text:
              print("✓ FIRMessagingDelegate déclaré")
          PY

          # --------------------------------------------------------
          # Vérification CRITIQUE :
          # didFinishLaunchingWithOptions doit exister.
          #
          # Nous NE créons PAS cette méthode automatiquement.
          # Cela évite de casser le cycle de vie SDL.
          # --------------------------------------------------------

          if ! grep -q "didFinishLaunchingWithOptions" "$DELEGATE_M"; then
            echo ""
            echo "❌ ERREUR DE SÉCURITÉ"
            echo "   didFinishLaunchingWithOptions n'a pas été trouvé."
            echo ""
            echo "   Le workflow s'arrête volontairement plutôt que"
            echo "   de créer une méthode SDL au mauvais endroit."
            echo ""
            exit 1
          fi

          echo "✓ didFinishLaunchingWithOptions trouvé"

          # --------------------------------------------------------
          # Bloc Firebase / APNs
          # --------------------------------------------------------

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["DELEGATE_M"])
          text = path.read_text()

          MARKER = "FCVV_FCM_CONFIGURATION_V1"

          if MARKER in text:
              print("✓ Bloc FCVV déjà présent")
              raise SystemExit(0)

          block = r'''

          // ==========================================================
          // FCVV_FCM_CONFIGURATION_V1
          // Firebase Cloud Messaging + APNs
          // ==========================================================

          - (void)fcvvConfigureFirebaseAndNotifications
          {
              NSLog(@"[FCVV] Initialisation Firebase/APNs");

              // ------------------------------------------------------
              // Firebase
              // ------------------------------------------------------

              if ([FIRApp defaultApp] == nil) {
                  [FIRApp configure];
                  NSLog(@"[FCVV] Firebase configuré");
              } else {
                  NSLog(@"[FCVV] Firebase déjà configuré");
              }

              // ------------------------------------------------------
              // Delegate Firebase Messaging
              // ------------------------------------------------------

              [FIRMessaging messaging].delegate = self;

              // ------------------------------------------------------
              // Delegate notifications iOS
              // ------------------------------------------------------

              UNUserNotificationCenter *center =
                  [UNUserNotificationCenter currentNotificationCenter];

              center.delegate = self;

              NSLog(@"[FCVV] Delegates Firebase/APNs configurés");

              // ------------------------------------------------------
              // Autorisation notifications
              // ------------------------------------------------------

              UNAuthorizationOptions options =
                  UNAuthorizationOptionAlert |
                  UNAuthorizationOptionSound |
                  UNAuthorizationOptionBadge;

              [center requestAuthorizationWithOptions:options
                                    completionHandler:^(BOOL granted,
                                                        NSError * _Nullable error) {

                  if (error != nil) {
                      NSLog(@"[FCVV] Erreur autorisation notifications: %@",
                            error);
                  } else {
                      NSLog(@"[FCVV] Autorisation notifications: %d",
                            granted);
                  }

                  // registerForRemoteNotifications doit être exécuté
                  // sur le thread principal.
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [[UIApplication sharedApplication]
                          registerForRemoteNotifications];

                      NSLog(@"[FCVV] registerForRemoteNotifications appelé");
                  });
              }];
          }


          // ==========================================================
          // Token FCM
          // ==========================================================

          - (void)messaging:(FIRMessaging *)messaging
              didReceiveRegistrationToken:(NSString *)fcmToken
          {
              NSLog(@"[FCVV] ==========================================");
              NSLog(@"[FCVV] TOKEN FCM : %@", fcmToken);
              NSLog(@"[FCVV] ==========================================");

              if (fcmToken == nil || fcmToken.length == 0) {
                  NSLog(@"[FCVV] Token FCM vide");
                  return;
              }

              NSDictionary *userInfo = @{
                  @"token": fcmToken
              };

              [[NSNotificationCenter defaultCenter]
                  postNotificationName:@"FCVV_FCM_TOKEN"
                                object:nil
                              userInfo:userInfo];
          }


          // ==========================================================
          // Token APNs
          // ==========================================================

          - (void)application:(UIApplication *)application
              didRegisterForRemoteNotificationsWithDeviceToken:(NSData *)deviceToken
          {
              NSLog(@"[FCVV] Token APNs reçu");

              if (deviceToken == nil) {
                  NSLog(@"[FCVV] ❌ Token APNs nil");
                  return;
              }

              [[FIRMessaging messaging] setAPNSToken:deviceToken];

              NSLog(@"[FCVV] Token APNs transmis à Firebase");
          }


          // ==========================================================
          // Erreur APNs
          // ==========================================================

          - (void)application:(UIApplication *)application
              didFailToRegisterForRemoteNotificationsWithError:(NSError *)error
          {
              NSLog(@"[FCVV] ❌ Échec enregistrement APNs : %@", error);
          }


          // ==========================================================
          // Notification au premier plan
          // ==========================================================

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
              willPresentNotification:(UNNotification *)notification
              withCompletionHandler:(void (^)(UNNotificationPresentationOptions options))completionHandler
          {
              NSDictionary *userInfo =
                  notification.request.content.userInfo;

              NSLog(@"[FCVV] Notification foreground : %@", userInfo);

              NSString *notifType = userInfo[@"notif_type"];
              NSString *categorie = userInfo[@"categorie"];

              if ([notifType isKindOfClass:[NSString class]] &&
                  [notifType isEqualToString:@"validation"] &&
                  [categorie isKindOfClass:[NSString class]] &&
                  categorie.length > 0)
              {
                  NSLog(@"[FCVV] Validation catégorie : %@",
                        categorie);

                  [[FIRMessaging messaging]
                      subscribeToTopic:categorie
                              completion:^(NSError * _Nullable error) {

                      if (error != nil) {
                          NSLog(@"[FCVV] ❌ Abonnement topic %@ : %@",
                                categorie,
                                error);
                      } else {
                          NSLog(@"[FCVV] ✓ Topic %@ souscrit",
                                categorie);
                      }
                  }];
              }

              completionHandler(
                  UNNotificationPresentationOptionAlert |
                  UNNotificationPresentationOptionSound |
                  UNNotificationPresentationOptionBadge
              );
          }


          // ==========================================================
          // Notification ouverte
          // ==========================================================

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
              didReceiveNotificationResponse:(UNNotificationResponse *)response
              withCompletionHandler:(void (^)(void))completionHandler
          {
              NSDictionary *userInfo =
                  response.notification.request.content.userInfo;

              NSLog(@"[FCVV] Notification ouverte : %@", userInfo);

              NSString *notifType = userInfo[@"notif_type"];
              NSString *categorie = userInfo[@"categorie"];

              if ([notifType isKindOfClass:[NSString class]] &&
                  [notifType isEqualToString:@"validation"] &&
                  [categorie isKindOfClass:[NSString class]] &&
                  categorie.length > 0)
              {
                  NSLog(@"[FCVV] Validation ouverte : %@",
                        categorie);

                  [[FIRMessaging messaging]
                      subscribeToTopic:categorie
                              completion:^(NSError * _Nullable error) {

                      if (error != nil) {
                          NSLog(@"[FCVV] ❌ Abonnement topic %@ : %@",
                                categorie,
                                error);
                      } else {
                          NSLog(@"[FCVV] ✓ Topic %@ souscrit",
                                categorie);
                      }
                  }];
              }

              completionHandler();
          }


          // ==========================================================
          // Notification background
          // ==========================================================

          - (void)application:(UIApplication *)application
              didReceiveRemoteNotification:(NSDictionary *)userInfo
              fetchCompletionHandler:(void (^)(UIBackgroundFetchResult result))completionHandler
          {
              NSLog(@"[FCVV] Notification background : %@", userInfo);

              NSString *notifType = userInfo[@"notif_type"];
              NSString *categorie = userInfo[@"categorie"];

              if ([notifType isKindOfClass:[NSString class]] &&
                  [notifType isEqualToString:@"validation"] &&
                  [categorie isKindOfClass:[NSString class]] &&
                  categorie.length > 0)
              {
                  NSLog(@"[FCVV] Validation background : %@",
                        categorie);

                  [[FIRMessaging messaging]
                      subscribeToTopic:categorie
                              completion:^(NSError * _Nullable error) {

                      if (error != nil) {
                          NSLog(@"[FCVV] ❌ Topic %@ : %@",
                                categorie,
                                error);
                      } else {
                          NSLog(@"[FCVV] ✓ Topic %@ souscrit",
                                categorie);
                      }
                  }];
              }

              completionHandler(UIBackgroundFetchResultNoData);
          }

          '''

          # ----------------------------------------------------------
          # Localiser précisément @implementation SDLUIKitDelegate
          # ----------------------------------------------------------

          impl = re.search(
              r'@implementation\s+SDLUIKitDelegate\b',
              text
          )

          if not impl:
              raise RuntimeError(
                  "@implementation SDLUIKitDelegate introuvable"
              )

          impl_start = impl.end()

          # ----------------------------------------------------------
          # Trouver la fin de cette implementation.
          #
          # On compte les blocs { } afin de ne pas prendre un @end
          # appartenant à une autre structure.
          # ----------------------------------------------------------

          # ----------------------------------------------------------
          # Trouver le @end correspondant à l'implementation
          # ----------------------------------------------------------
          
          end_match = re.search(
              r'\n@end\s*$',
              text[impl_start:],
              re.MULTILINE
          )
          
          if not end_match:
              raise RuntimeError(
                  "@end de SDLUIKitDelegate introuvable"
              )
          
          end_pos = impl_start + end_match.start()

          text = text[:end_pos] + block + text[end_pos:]

          path.write_text(text)

          print("✓ Méthodes Firebase/APNs injectées")
          PY

          # --------------------------------------------------------
          # Ajout de l'appel dans didFinishLaunchingWithOptions
          # --------------------------------------------------------

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["DELEGATE_M"])
          text = path.read_text()

          CALL = "[self fcvvConfigureFirebaseAndNotifications];"

          if CALL in text:
              print("✓ Appel Firebase déjà présent")
              raise SystemExit(0)

          # Signature Objective-C standard, tolérante aux espaces
          pattern = re.compile(
              r'(-\s*\(BOOL\)\s*application\s*:\s*'
              r'\(UIApplication\s*\*\)\s*application\s*'
              r'didFinishLaunchingWithOptions\s*:\s*'
              r'\(NSDictionary\s*\*\)\s*launchOptions\s*\{)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if not match:
              raise RuntimeError(
                  "didFinishLaunchingWithOptions existe mais "
                  "sa signature n'a pas pu être analysée automatiquement"
              )

          insertion = (
              match.group(1)
              + "\n"
              + "    " + CALL + "\n"
          )

          text = (
              text[:match.start()]
              + insertion
              + text[match.end():]
          )

          path.write_text(text)

          print("✓ Appel Firebase ajouté à didFinishLaunchingWithOptions")
          PY

