name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync
          python -m pip install --upgrade pip
          pip install "Cython>=3.0,<3.1" "kivy-ios>=1.3.0" pillow requests urllib3

      - name: Create Kivy-iOS directory
        run: mkdir -p ~/.kivy-ios

      - name: Cache kivy-ios
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-kivy-ios-

      - name: Build kivy-ios recipes
        if: steps.cache.outputs.cache-hit != 'true'
        run: toolchain build python3 kivy openssl pillow

      - name: Prepare sources
        run: |
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist

      - name: Create Xcode project and Pods
        run: |
          set -euxo pipefail
          toolchain create FCVV ios_src
          
          # Gestion de l'icône
          PROJ_DIR=$(find "$PWD" -name "fcvv.xcodeproj" | xargs dirname)
          mkdir -p "$PROJ_DIR/Resources"
          if [ -f "assets/logo_apk_fcvv.png" ]; then
            cp "assets/logo_apk_fcvv.png" "$PROJ_DIR/Resources/icon.png"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$PROJ_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string icon.png" "$PROJ_DIR/Info.plist" 2>/dev/null || true
          fi
          
          # Podfile
          cat > "$PROJ_DIR/Podfile" <<'EOF'
          platform :ios, '13.0'
          use_modular_headers! 
          project 'fcvv.xcodeproj'

          target 'fcvv' do
            pod 'FirebaseCore', '10.28.0'
            pod 'FirebaseMessaging', '10.28.0'
            pod 'GoogleUtilities', :modular_headers => true
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['ENABLE_MODULE_VERIFIER'] = 'NO'
                config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -ObjC'
              end
            end
          end
          EOF
          
          rm -rf "$PROJ_DIR/Pods" "$PROJ_DIR/Podfile.lock"
          cd "$PROJ_DIR" && pod install

      - name: Build simulator
        run: |
          set -euxo pipefail
          WORKSPACE_PATH=$(find "$PWD" -name "*.xcworkspace" | head -1)
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme "fcvv" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     OTHER_CFLAGS='$(inherited) -Wno-error=non-modular-include-in-framework-module' \
                     OTHER_LDFLAGS='$(inherited) -ObjC' \
                     EXCLUDED_ARCHS=x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          cd "$(dirname "$APP")"
          zip -r "$GITHUB_WORKSPACE/fcvv.zip" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-app
          path: fcvv.zip