name: Build Kivy App for iOS (FCVV)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS|iPhoneOS" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system tools
        run: |
          brew install autoconf automake libtool pkg-config cmake cocoapods rsync pigz ccache
      
          python -m pip install --upgrade pip
      
          pip install \
            "Cython==0.29.36" \
            "kivy-ios==1.3.0" \
            pillow \
            requests \
            urllib3 \
            pyyaml
      
          echo "===== Python / Cython ====="
          which python
          python --version
          which cython
          cython --version
      
          echo "===== Création de cython-2.7 ====="
          CYTHON_PATH="$(which cython)"
          ln -sf "$CYTHON_PATH" "$(dirname "$CYTHON_PATH")/cython-2.7"
      
          echo "===== Vérification ====="
          which cython-2.7
          cython-2.7 --version

      - name: Cache kivy-ios
        uses: actions/cache@v4
        with:
          path: ~/.kivy-ios
          key: ${{ runner.os }}-kivy-ios-v1.3.0-python310
          restore-keys: |
            ${{ runner.os }}-kivy-ios-v1.3.0-

      - name: Vérifier kivy-ios
        run: |
          set -euxo pipefail
        
          echo "===== Informations kivy-ios ====="
          which toolchain
        
          echo "===== Cython ====="
          which cython
          which cython-2.7
          cython-2.7 --version
        
          echo "===== Recipes ====="
          toolchain recipes
        
          echo "===== Status ====="
          toolchain status || true

      - name: Build Kivy dependencies
        run: |
          set -euxo pipefail

          toolchain build python3 kivy openssl pillow

      - name: Inspect build output
        run: |
          set -euxo pipefail
          echo "===== Vérification des recettes ====="
          toolchain status || true
          echo "===== Répertoire courant ====="
          pwd
          ls -la
          echo "===== DIST ====="
          [ -d dist ] && du -sh dist || echo "dist absent"
          [ -d dist ] && find dist -maxdepth 3 || true
          echo "===== BUILD ====="
          [ -d build ] && du -sh build || echo "build absent"
          [ -d build ] && find build -maxdepth 3 || true
          echo "===== Recherche Python ====="
          find dist -iname "*python*" 2>/dev/null || true
          find build -iname "*python*" 2>/dev/null || true
          echo "===== Recherche site-packages ====="
          find dist -iname "site-packages" 2>/dev/null || true
          find build -iname "site-packages" 2>/dev/null || true
          echo "===== Recherche yaml ====="
          find dist -iname "*yaml*" 2>/dev/null || true
          find build -iname "*yaml*" 2>/dev/null || true
          echo "===== Recherche requests ====="
          find dist -iname "*requests*" 2>/dev/null || true
          find build -iname "*requests*" 2>/dev/null || true
          echo "===== XCFramework ====="
          find dist -iname "*.xcframework" 2>/dev/null || true
          echo "===== Librairies Python ====="
          find dist -iname "libpython*" 2>/dev/null || true
          echo "===== PYTHON LIB SEARCH ====="
          find "$HOME/.kivy-ios" -type d -name "site-packages" -o -name "python3"
          find . -type d -name "site-packages"

      - name: Prepare sources
        run: |
          rm -rf ios_src
          mkdir ios_src
          rsync -a --exclude=".git" --exclude=".github" --exclude=".buildozer" --exclude="bin" --exclude="build" --exclude="dist" --exclude="ios_src" ./ ios_src/
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" > ios_src/GoogleService-Info.plist
          find ios_src -name "__pycache__" -type d -exec rm -rf {} +
          find ios_src -name "*.pyc" -delete

      - name: Create Xcode project and setup Firebase
        run: |
          set -euxo pipefail
          toolchain create FCVV ios_src
          
          # Localisation précise du projet
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          PROJ_NAME=$(basename "$PROJECT_FILE")
          
          # 1. Copie du plist dans le dossier du projet
          cp ios_src/GoogleService-Info.plist "$PROJ_DIR/"
          
          # 2. Utilisation du chemin complet pour Ruby afin d'éviter les erreurs de contexte
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"
          
          ruby -e "
          require 'xcodeproj'
          # Ouverture avec le chemin complet
          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
          target = project.targets.find { |t| t.name == 'fcvv' }
          
          # Ajout du fichier situé dans PROJ_DIR
          file = project.main_group.new_file('GoogleService-Info.plist')
          target.add_resources([file])
          project.save
          "
          
      - name: Inject Firebase into files
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "===== INJECTION FIREBASE / FCM iOS ====="
          echo "============================================================"

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun fichier .xcodeproj trouvé"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJECT_FILE")

          MAIN_FILE=$(find "$PROJ_DIR" -name "main.m" | head -1)
          APPDELEGATE_FILE=$(find . -name "SDL_uikitappdelegate.m" | head -1)
          HEADER_FILE=$(find . -name "SDL_uikitappdelegate.h" | head -1)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERREUR : main.m introuvable"
            exit 1
          fi

          if [ -z "$APPDELEGATE_FILE" ]; then
            echo "ERREUR : SDL_uikitappdelegate.m introuvable"
            exit 1
          fi

          if [ -z "$HEADER_FILE" ]; then
            echo "ERREUR : SDL_uikitappdelegate.h introuvable"
            exit 1
          fi

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "MAIN_FILE=$MAIN_FILE"
          echo "APPDELEGATE_FILE=$APPDELEGATE_FILE"
          echo "HEADER_FILE=$HEADER_FILE"


          # ============================================================
          # 1. IMPORTS FIREBASE DANS main.m
          # ============================================================

          echo ""
          echo "===== 1. IMPORTS FIREBASE main.m ====="

          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          imports = """@import UIKit;
          @import FirebaseCore;
          @import FirebaseMessaging;
          """

          if "FirebaseCore" not in content:
              content = imports + "\n" + content

          path.write_text(content)
          PY


          # ============================================================
          # 2. CONFIGURATION FIREBASE + APNS
          # ============================================================

          echo ""
          echo "===== 2. CONFIGURATION FIREBASE / APNS ====="

          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          code = r'''
          if ([FIRApp defaultApp] == nil) {
              [FIRApp configure];
              NSLog(@"[FCM iOS] Firebase configure");
          }

          if (@available(iOS 10.0, *)) {
              UNAuthorizationOptions options =
                  UNAuthorizationOptionAlert |
                  UNAuthorizationOptionSound |
                  UNAuthorizationOptionBadge;

              [[UNUserNotificationCenter currentNotificationCenter]
                  requestAuthorizationWithOptions:options
                  completionHandler:^(BOOL granted, NSError * _Nullable error) {

                      if (error) {
                          NSLog(@"[FCM iOS] Erreur permission notifications : %@", error);
                          return;
                      }

                      NSLog(@"[FCM iOS] Permission notifications : %d", granted);

                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[UIApplication sharedApplication]
                              registerForRemoteNotifications];
                      });
                  }];
          } else {
              [[UIApplication sharedApplication] registerForRemoteNotifications];
          }

          NSLog(@"[FCM iOS] Demande enregistrement APNS");
          '''

          marker = "int main(int argc, char *argv[]) {"

          if "[FIRApp configure]" not in content:
              if marker not in content:
                  raise RuntimeError(
                      "Impossible de trouver int main(int argc, char *argv[])"
                  )

              content = content.replace(
                  marker,
                  marker + "\n" + code,
                  1
              )

          path.write_text(content)
          PY


          # ============================================================
          # 3. IMPORTS DANS SDL_uikitappdelegate.m
          # ============================================================

          echo ""
          echo "===== 3. IMPORTS SDL DELEGATE ====="

          python3 - "$APPDELEGATE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          imports = """@import FirebaseMessaging;
          @import UserNotifications;
          """

          if "FirebaseMessaging" not in content:
              content = imports + "\n" + content

          if "UserNotifications" not in content:
              content = "@import UserNotifications;\n" + content

          path.write_text(content)
          PY


          # ============================================================
          # 4. INJECTION DU DELEGATE COMPLET
          #
          # IMPORTANT :
          # - premier plan : willPresentNotification
          # - clic notification : didReceiveNotificationResponse
          # - background data : didReceiveRemoteNotification
          # - APNS token -> FCM
          # ============================================================

          echo ""
          echo "===== 4. INJECTION DELEGATE FCM ====="

          python3 - "$APPDELEGATE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          # Evite les doubles injections
          if "FCVV_FCM_NOTIFICATION_HANDLER" in content:
              print("FCVV FCM delegate déjà injecté.")
              sys.exit(0)

          injection = r'''

          #pragma mark - FCVV_FCM_NOTIFICATION_HANDLER

          /*
           * ============================================================
           * FCVV - Firebase Cloud Messaging / APNS
           * ============================================================
           *
           * Gestion :
           *
           * 1. Application au premier plan
           *    -> willPresentNotification
           *
           * 2. Application en arrière-plan
           *    -> iOS affiche la notification
           *    -> didReceiveNotificationResponse au clic
           *
           * 3. Application complètement fermée
           *    -> iOS lance l'application au clic
           *    -> didReceiveNotificationResponse récupère les données
           *
           * 4. Token APNS
           *    -> transmis à Firebase Messaging
           *
           * ============================================================
           */


          - (void)application:(UIApplication *)application
          didRegisterForRemoteNotificationsWithDeviceToken:(NSData *)deviceToken
          {
              NSLog(@"[FCM iOS] APNS token reçu");

              [FIRMessaging messaging].APNSToken = deviceToken;

              [[FIRMessaging messaging]
                  tokenWithCompletion:^(NSString *token, NSError *error) {

                  if (error) {
                      NSLog(@"[FCM iOS] Erreur récupération token FCM : %@",
                            error);
                  } else {
                      NSLog(@"[FCM iOS] Token FCM : %@", token);
                  }
              }];

              if (@available(iOS 10.0, *)) {
                  [UNUserNotificationCenter currentNotificationCenter].delegate =
                      (id<UNUserNotificationCenterDelegate>)self;
              }
          }


          - (void)application:(UIApplication *)application
          didFailToRegisterForRemoteNotificationsWithError:(NSError *)error
          {
              NSLog(@"[FCM iOS] ERREUR APNS : %@", error);
          }


          /*
           * ============================================================
           * NOTIFICATION RECUE ALORS QUE L'APPLICATION EST OUVERTE
           * ============================================================
           */

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
               willPresentNotification:(UNNotification *)notification
                 withCompletionHandler:(void (^)(UNNotificationPresentationOptions options))completionHandler
          {
              NSDictionary *userInfo =
                  notification.request.content.userInfo;

              NSLog(@"[FCM iOS] ========================================");
              NSLog(@"[FCM iOS] Notification reçue AU PREMIER PLAN");
              NSLog(@"[FCM iOS] userInfo = %@", userInfo);
              NSLog(@"[FCM iOS] ========================================");

              [[FIRMessaging messaging] appDidReceiveMessage:userInfo];

              if (@available(iOS 14.0, *)) {

                  completionHandler(
                      UNNotificationPresentationOptionBanner |
                      UNNotificationPresentationOptionList |
                      UNNotificationPresentationOptionSound |
                      UNNotificationPresentationOptionBadge
                  );

              } else {

                  completionHandler(
                      UNNotificationPresentationOptionAlert |
                      UNNotificationPresentationOptionSound |
                      UNNotificationPresentationOptionBadge
                  );
              }
          }


          /*
           * ============================================================
           * CLIC SUR UNE NOTIFICATION
           *
           * C'est LA méthode importante pour :
           *
           * - application en arrière-plan
           * - application suspendue
           * - application complètement fermée
           *
           * Les données envoyées par Firebase sont dans userInfo.
           * ============================================================
           */

          - (void)userNotificationCenter:(UNUserNotificationCenter *)center
          didReceiveNotificationResponse:(UNNotificationResponse *)response
          withCompletionHandler:(void (^)(void))completionHandler
          {
              NSDictionary *userInfo =
                  response.notification.request.content.userInfo;

              NSLog(@"[FCM iOS] ========================================");
              NSLog(@"[FCM iOS] CLIC SUR NOTIFICATION");
              NSLog(@"[FCM iOS] userInfo = %@", userInfo);
              NSLog(@"[FCM iOS] ========================================");

              [[FIRMessaging messaging] appDidReceiveMessage:userInfo];


              /*
               * --------------------------------------------------------
               * Extraction des données personnalisées
               * --------------------------------------------------------
               */

              NSString *title = @"FCVV";
              NSString *body = @"";
              NSString *categorie = @"";
              NSString *matchId = @"";
              NSString *notifType = @"";


              /*
               * title / body
               *
               * Ils peuvent se trouver :
               *
               * userInfo["title"]
               * userInfo["body"]
               *
               * ou dans :
               *
               * userInfo["aps"]["alert"]["title"]
               * userInfo["aps"]["alert"]["body"]
               */

              NSString *dataTitle = userInfo[@"title"];
              NSString *dataBody = userInfo[@"body"];

              if ([dataTitle isKindOfClass:[NSString class]] &&
                  [dataTitle length] > 0) {

                  title = dataTitle;
              }

              if ([dataBody isKindOfClass:[NSString class]] &&
                  [dataBody length] > 0) {

                  body = dataBody;
              }


              NSDictionary *aps = userInfo[@"aps"];

              if ([aps isKindOfClass:[NSDictionary class]]) {

                  NSDictionary *alert = aps[@"alert"];

                  if ([alert isKindOfClass:[NSDictionary class]]) {

                      NSString *apsTitle = alert[@"title"];
                      NSString *apsBody = alert[@"body"];

                      if ([title isEqualToString:@"FCVV"] &&
                          [apsTitle isKindOfClass:[NSString class]]) {

                          title = apsTitle;
                      }

                      if ([body length] == 0 &&
                          [apsBody isKindOfClass:[NSString class]]) {

                          body = apsBody;
                      }
                  }
              }


              /*
               * --------------------------------------------------------
               * DONNÉES FCVV
               * --------------------------------------------------------
               */

              NSString *dataCategorie = userInfo[@"topic"];
              NSString *dataMatchId = userInfo[@"match_id"];
              NSString *dataNotifType = userInfo[@"notif_type"];


              if ([dataCategorie isKindOfClass:[NSString class]]) {
                  categorie = dataCategorie;
              }

              if ([dataMatchId isKindOfClass:[NSString class]]) {
                  matchId = dataMatchId;
              }

              if ([dataNotifType isKindOfClass:[NSString class]]) {
                  notifType = dataNotifType;
              }


              NSLog(@"[FCM iOS] ===== DONNEES NOTIFICATION =====");
              NSLog(@"[FCM iOS] title      = %@", title);
              NSLog(@"[FCM iOS] body       = %@", body);
              NSLog(@"[FCM iOS] topic      = %@", categorie);
              NSLog(@"[FCM iOS] match_id   = %@", matchId);
              NSLog(@"[FCM iOS] notif_type = %@", notifType);


              /*
               * --------------------------------------------------------
               * Sauvegarde temporaire dans NSUserDefaults
               *
               * Pourquoi ?
               *
               * Dans une application Kivy/SDL, Python peut démarrer
               * quelques instants APRÈS le lancement du delegate iOS.
               *
               * On ne tente donc PAS d'appeler Python directement ici.
               *
               * On sauvegarde la notification.
               *
               * Python pourra ensuite la récupérer avec :
               *
               * verifier_redirection_notification_ios()
               * --------------------------------------------------------
               */

              NSUserDefaults *defaults =
                  [NSUserDefaults standardUserDefaults];


              [defaults setObject:title
                           forKey:@"FCVV_NOTIFICATION_TITLE"];

              [defaults setObject:body
                           forKey:@"FCVV_NOTIFICATION_BODY"];

              [defaults setObject:categorie
                           forKey:@"FCVV_NOTIFICATION_TOPIC"];

              [defaults setObject:matchId
                           forKey:@"FCVV_NOTIFICATION_MATCH_ID"];

              [defaults setObject:notifType
                           forKey:@"FCVV_NOTIFICATION_TYPE"];

              [defaults setBool:YES
                          forKey:@"FCVV_NOTIFICATION_PENDING"];

              [defaults synchronize];


              NSLog(@"[FCM iOS] Notification sauvegardée pour Python");
              NSLog(@"[FCM iOS] FCVV_NOTIFICATION_PENDING = YES");


              /*
               * --------------------------------------------------------
               * Fin obligatoire du callback iOS
               * --------------------------------------------------------
               */

              completionHandler();
          }


          /*
           * ============================================================
           * NOTIFICATION SILENCIEUSE / DATA EN BACKGROUND
           *
           * Cette méthode ne doit PAS être utilisée pour compter sur
           * l'affichage d'une notification lorsque l'app est fermée.
           *
           * Elle est utile pour les silent push content-available.
           * ============================================================
           */

          - (void)application:(UIApplication *)application
          didReceiveRemoteNotification:(NSDictionary *)userInfo
          fetchCompletionHandler:(void (^)(UIBackgroundFetchResult result))completionHandler
          {
              NSLog(@"[FCM iOS] Notification distante reçue en background");
              NSLog(@"[FCM iOS] userInfo = %@", userInfo);

              [[FIRMessaging messaging] appDidReceiveMessage:userInfo];

              completionHandler(UIBackgroundFetchResultNoData);
          }

          '''

          # Cherche le dernier @end du delegate SDL
          pos = content.rfind("\n@end")

          if pos == -1:
              raise RuntimeError(
                  "Impossible de trouver @end de SDLUIKitDelegate"
              )

          content = (
              content[:pos]
              + injection
              + content[pos:]
          )

          path.write_text(content)

          print("Injection FCM iOS terminée.")
          PY


          # ============================================================
          # 5. MODIFICATION DU HEADER SDL
          # ============================================================

          echo ""
          echo "===== 5. CONFIGURATION HEADER SDL ====="

          python3 - "$HEADER_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          # ------------------------------------------------------------
          # Import UserNotifications
          # ------------------------------------------------------------

          if "#import <UserNotifications/UserNotifications.h>" not in content:

              if "#import <UIKit/UIKit.h>" in content:

                  content = content.replace(
                      "#import <UIKit/UIKit.h>",
                      "#import <UIKit/UIKit.h>\n"
                      "#import <UserNotifications/UserNotifications.h>",
                      1
                  )

              else:

                  content = (
                      "#import <UserNotifications/UserNotifications.h>\n"
                      + content
                  )


          # ------------------------------------------------------------
          # Ajout du protocole UNUserNotificationCenterDelegate
          # ------------------------------------------------------------

          old = (
              "@interface SDLUIKitDelegate : "
              "NSObject<UIApplicationDelegate>"
          )

          new = (
              "@interface SDLUIKitDelegate : "
              "NSObject<UIApplicationDelegate, "
              "UNUserNotificationCenterDelegate>"
          )

          if old in content:

              content = content.replace(old, new, 1)

          elif "UNUserNotificationCenterDelegate" not in content:

              raise RuntimeError(
                  "Impossible de trouver l'interface SDLUIKitDelegate"
              )


          path.write_text(content)

          print("Header SDL configuré.")
          PY


          # ============================================================
          # 6. VERIFICATION
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== VERIFICATION FINALE INJECTION FCM ====="
          echo "============================================================"

          echo ""
          echo "--- main.m ---"

          grep -n \
            -E "FirebaseCore|FirebaseMessaging|FIRApp|registerForRemoteNotifications" \
            "$MAIN_FILE" || true


          echo ""
          echo "--- SDL delegate imports ---"

          grep -n \
            -E "FirebaseMessaging|UserNotifications" \
            "$APPDELEGATE_FILE" | head -20 || true


          echo ""
          echo "--- APNS ---"

          grep -n \
            -E "didRegisterForRemoteNotificationsWithDeviceToken|APNS token" \
            "$APPDELEGATE_FILE" || true


          echo ""
          echo "--- Premier plan ---"

          grep -n \
            -E "willPresentNotification|PREMIER PLAN" \
            "$APPDELEGATE_FILE" || true


          echo ""
          echo "--- Clic notification ---"

          grep -n \
            -E "didReceiveNotificationResponse|CLIC SUR NOTIFICATION" \
            "$APPDELEGATE_FILE" || true


          echo ""
          echo "--- Données FCVV ---"

          grep -n \
            -E "FCVV_NOTIFICATION_|match_id|notif_type|topic" \
            "$APPDELEGATE_FILE" || true


          echo ""
          echo "--- Background ---"

          grep -n \
            -E "didReceiveRemoteNotification|Background" \
            "$APPDELEGATE_FILE" || true


          echo ""
          echo "--- Header ---"

          grep -n \
            -E "UNUserNotificationCenterDelegate|UserNotifications" \
            "$HEADER_FILE" || true


          echo ""
          echo "============================================================"
          echo "===== INJECTION FIREBASE TERMINEE ====="
          echo "============================================================"
          
           
          
      - name: Verify Injection
        run: |
          APPDELEGATE_FILE=$(find . -name "SDL_uikitappdelegate.m" | head -1)

          echo "--- main.m Firebase ---"
          grep -n "Firebase\|FIRApp\|registerForRemote" ./fcvv-ios/main.m || true

          echo "--- SDL Firebase imports ---"
          head -10 "$APPDELEGATE_FILE"

          echo "--- Callbacks FCM ---"
          grep -n "APNS token recu\|didRegisterForRemoteNotificationsWithDeviceToken\|willPresentNotification\|FIRMessaging" "$APPDELEGATE_FILE" || true

          echo "--- Structure fin SDLUIKitDelegate ---"
          grep -n "@implementation SDLUIKitDelegate\|@end" "$APPDELEGATE_FILE" | tail -10
          
          echo -e "\n--- Vérification SDL_uikitappdelegate.h ---"

          HEADER_FILE=$(find . -name "SDL_uikitappdelegate.h" | head -1)

          echo "HEADER_FILE=$HEADER_FILE"

          grep -n "@interface SDLUIKitDelegate" "$HEADER_FILE" || true
          grep -n "UNUserNotificationCenterDelegate" "$HEADER_FILE" || true
          grep -n "UserNotifications" "$HEADER_FILE" || true

          echo -e "\n--- Début du header ---"
          head -30 "$HEADER_FILE"
          
          echo -e "\n--- Vérification SDL_uikitappdelegate.h ---"

          grep -n "UserNotifications" "$HEADER_FILE" || true
          grep -n "@interface SDLUIKitDelegate" "$HEADER_FILE" || true

      - name: Configure Xcode Entitlements for Push
        run: |
          set -euxo pipefail

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          ENTITLEMENTS_PATH="$PROJ_DIR/fcvv.entitlements"
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          cat > "$ENTITLEMENTS_PATH" <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
            <key>aps-environment</key>
            <string>development</string>
            </dict>
            </plist>
          EOF

          echo "--- Contenu entitlements ---"
          cat "$ENTITLEMENTS_PATH"

          echo "--- Validation plist ---"
          plutil -lint "$ENTITLEMENTS_PATH"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')
          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          file = project.main_group.find_file_by_path('fcvv.entitlements') ||
          project.main_group.new_file('fcvv.entitlements')

          target.build_configurations.each do |config|
          config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'fcvv.entitlements'
          end

          project.save
          "

      - name: Verify Entitlements
        run: |
          echo "--- Contenu de fcvv.entitlements ---"
          cat ./fcvv-ios/fcvv.entitlements
          

      - name: Configure and Install Pods
        run: |
          set -euxo pipefail
      
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          PROJ_DIR=$(dirname "$PROJECT_FILE")
          PROJ_NAME=$(basename "$PROJECT_FILE")
      
          PLIST_FILE=$(find "$PROJ_DIR" -maxdepth 1 -name "*-Info.plist" | grep -v "GoogleService" | head -1)
      
          echo "Plist détecté : $PLIST_FILE"
      
          if [[ "$PLIST_FILE" != *"Info.plist" ]]; then
            echo "Erreur : Impossible de localiser le Info.plist principal."
            exit 1
          fi
      
          plutil -convert xml1 "$PLIST_FILE"
      
          /usr/libexec/PlistBuddy -c "Delete :CFBundleShortVersionString" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1.0" "$PLIST_FILE"
      
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST_FILE"
      
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.thomas25530.fcvvapp" "$PLIST_FILE"
      
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string FCVV" "$PLIST_FILE"
      
          if [ -d "assets/Images.xcassets" ]; then
            echo "[iOS] Installation Images.xcassets"
      
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            cp -R assets/Images.xcassets "$PROJ_DIR/fcvv/"
      
            find "$PROJ_DIR/fcvv/Images.xcassets" -maxdepth 2
            find "$PROJ_DIR/fcvv/Images.xcassets/AppIcon.appiconset"
          fi
      
          cat > "$PROJ_DIR/Podfile" <<EOF
          platform :ios, '12.0'
      
          use_frameworks!
          use_modular_headers!
      
          project '$PROJ_NAME'
      
          target 'fcvv' do
            pod 'FirebaseCore', '9.6.0'
            pod 'FirebaseMessaging', '9.6.0'
          end
          EOF
      
          cd "$PROJ_DIR"
      
          echo "===== CocoaPods ====="
          ruby --version
          pod --version
          pod repo list
      
          echo "===== Installation Pods ====="
          pod deintegrate
          pod install --verbose
      
          echo "===== Vérification ====="
          ls -la
          ls -la Pods
          ls -la *.xcworkspace
      
          sed -i '' 's/OTHER_LDFLAGS = "-all_load";/OTHER_LDFLAGS = "$(inherited) -ObjC -all_load";/g' \
            fcvv.xcodeproj/project.pbxproj

      - name: Configure iOS Launch Screen (Presplash)
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "===== CONFIGURATION DU LAUNCH SCREEN IOS ====="
          echo "============================================================"

          # ------------------------------------------------------------
          # 0. Détection du projet Xcode
          # ------------------------------------------------------------

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun fichier .xcodeproj trouvé"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJECT_FILE")
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "FULL_PROJECT_PATH=$FULL_PROJECT_PATH"

          # ------------------------------------------------------------
          # 1. Définition des chemins
          # ------------------------------------------------------------

          PRESPLASH_SOURCE="$PWD/assets/logo_apk_fcvv.png"

          APP_DIR="$PROJ_DIR/fcvv"
          ASSETS_DIR="$APP_DIR/Images.xcassets"
          IMAGESET_DIR="$ASSETS_DIR/fcvv_launch_logo.imageset"
          IMAGE_DEST="$IMAGESET_DIR/fcvv_launch_logo.png"

          # IMPORTANT :
          # LaunchScreen.storyboard est à la racine de fcvv-ios.
          LAUNCH_STORYBOARD="$PROJ_DIR/LaunchScreen.storyboard"

          echo "PRESPLASH_SOURCE=$PRESPLASH_SOURCE"
          echo "APP_DIR=$APP_DIR"
          echo "ASSETS_DIR=$ASSETS_DIR"
          echo "IMAGESET_DIR=$IMAGESET_DIR"
          echo "IMAGE_DEST=$IMAGE_DEST"
          echo "LAUNCH_STORYBOARD=$LAUNCH_STORYBOARD"

          # ------------------------------------------------------------
          # 2. Vérification image source
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 2. VERIFICATION IMAGE SOURCE ====="
          echo "============================================================"

          if [ ! -f "$PRESPLASH_SOURCE" ]; then
            echo "ERREUR : image source introuvable :"
            echo "$PRESPLASH_SOURCE"
            exit 1
          fi

          python3 - "$PRESPLASH_SOURCE" <<'PY'
          from PIL import Image
          import sys

          path = sys.argv[1]

          image = Image.open(path)

          print(f"Image source : {path}")
          print(f"Dimensions   : {image.size}")
          print(f"Mode         : {image.mode}")

          if image.size != (512, 512):
              raise SystemExit(
                  f"ERREUR : dimensions attendues 512x512, "
                  f"mais trouvées {image.size}"
              )
          PY

          # ------------------------------------------------------------
          # 3. Nettoyage physique des anciennes ressources
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 3. NETTOYAGE ANCIENNES RESSOURCES ====="
          echo "============================================================"

          rm -f "$APP_DIR/logo_apk_fcvv.png"
          rm -f "$APP_DIR/fcvv_launch_logo.png"

          rm -f "$PROJ_DIR/logo_apk_fcvv.png"
          rm -f "$PROJ_DIR/fcvv_launch_logo.png"

          rm -rf "$ASSETS_DIR/logo_apk_fcvv.imageset"
          rm -rf "$ASSETS_DIR/fcvv_launch_logo.imageset"

          rm -f "$APP_DIR/LaunchScreen.storyboard"
          rm -f "$PROJ_DIR/LaunchScreen.storyboard"

          rm -f "$PROJ_DIR/Storyboards/Launch Screen.storyboard"

          echo "Anciennes ressources physiques supprimées."

          # ------------------------------------------------------------
          # 4. Création Images.xcassets
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 4. CREATION IMAGESET ====="
          echo "============================================================"

          mkdir -p "$ASSETS_DIR"
          mkdir -p "$IMAGESET_DIR"

          if [ ! -f "$ASSETS_DIR/Contents.json" ]; then
            cat > "$ASSETS_DIR/Contents.json" <<'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi

          cp -f "$PRESPLASH_SOURCE" "$IMAGE_DEST"

          cat > "$IMAGESET_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "fcvv_launch_logo.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          echo "Imageset créé :"
          echo "$IMAGESET_DIR"

          # ------------------------------------------------------------
          # 5. Création LaunchScreen.storyboard
          #
          # IMPORTANT :
          # - exactement 1 viewController
          # - initialViewController explicitement défini
          # - image référencée par son nom d'asset
          # - aucune scène inutilisable
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 5. CREATION LAUNCHSCREEN.STORYBOARD ====="
          echo "============================================================"

          cat > "$LAUNCH_STORYBOARD" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document
              type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
              version="3.0"
              toolsVersion="23504"
              targetRuntime="iOS.CocoaTouch"
              propertyAccessControl="none"
              useAutolayout="YES"
              launchScreen="YES"
              useTraitCollections="YES"
              colorMatched="YES"
              initialViewController="LaunchScreenViewController">

              <device
                  id="retina6_12"
                  orientation="portrait"
                  appearance="light"/>

              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn
                      identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin"
                      version="23506"/>
                  <capability
                      name="documents saved in the Xcode 8 format"
                      minToolsVersion="8.0"/>
              </dependencies>

              <scenes>

                  <!-- Launch Screen -->
                  <scene sceneID="LaunchScreenScene">

                      <objects>

                          <viewController
                              id="LaunchScreenViewController"
                              sceneMemberID="viewController">

                              <view
                                  key="view"
                                  contentMode="scaleToFill"
                                  id="LaunchScreenView">

                                  <rect
                                      key="frame"
                                      x="0.0"
                                      y="0.0"
                                      width="393"
                                      height="852"/>

                                  <autoresizingMask
                                      key="autoresizingMask"
                                      widthSizable="YES"
                                      heightSizable="YES"/>

                                  <subviews>

                                      <imageView
                                          clipsSubviews="YES"
                                          userInteractionEnabled="NO"
                                          contentMode="scaleAspectFit"
                                          horizontalHuggingPriority="251"
                                          verticalHuggingPriority="251"
                                          image="fcvv_launch_logo"
                                          translatesAutoresizingMaskIntoConstraints="NO"
                                          id="LaunchLogo">

                                          <rect
                                              key="frame"
                                              x="96.5"
                                              y="326"
                                              width="200"
                                              height="200"/>

                                      </imageView>

                                  </subviews>

                                  <color
                                      key="backgroundColor"
                                      red="0.117647"
                                      green="0.227451"
                                      blue="0.541176"
                                      alpha="1"
                                      colorSpace="custom"
                                      customColorSpace="sRGB"/>

                                  <constraints>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerX"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerX"
                                          id="CenterX"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerY"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerY"
                                          id="CenterY"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="width"
                                          constant="200"
                                          id="LogoWidth"/>

                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="height"
                                          constant="200"
                                          id="LogoHeight"/>

                                  </constraints>

                              </view>

                          </viewController>

                          <placeholder
                              placeholderIdentifier="IBFirstResponder"
                              id="FirstResponder"
                              sceneMemberID="firstResponder"/>

                      </objects>

                      <point
                          key="canvasLocation"
                          x="100"
                          y="100"/>

                  </scene>

              </scenes>

              <resources>

                  <image
                      name="fcvv_launch_logo"
                      width="512"
                      height="512"/>

              </resources>

          </document>
          EOF

          echo "LaunchScreen.storyboard créé :"
          echo "$LAUNCH_STORYBOARD"

          # ------------------------------------------------------------
          # 6. Vérification immédiate du XML
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 6. VERIFICATION STRUCTURE STORYBOARD ====="
          echo "============================================================"

          echo "--- initialViewController ---"
          grep -n "initialViewController=" "$LAUNCH_STORYBOARD"

          echo "--- viewController ---"
          grep -n "<viewController" "$LAUNCH_STORYBOARD"

          echo "--- image ---"
          grep -n 'image="fcvv_launch_logo"' "$LAUNCH_STORYBOARD"

          VC_COUNT=$(grep -c '<viewController' "$LAUNCH_STORYBOARD" || true)

          echo "Nombre de viewController : $VC_COUNT"

          if [ "$VC_COUNT" -ne 1 ]; then
            echo "ERREUR : le LaunchScreen doit contenir exactement 1 viewController"
            exit 1
          fi

          if ! grep -q 'initialViewController="LaunchScreenViewController"' "$LAUNCH_STORYBOARD"; then
            echo "ERREUR : initialViewController absent ou incorrect"
            exit 1
          fi

          # ------------------------------------------------------------
          # 7. Nettoyage et configuration projet Xcode
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 7. CONFIGURATION PROJET XCODE ====="
          echo "============================================================"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts 'Target trouvé : ' + target.name

          # ----------------------------------------------------------
          # Supprimer toutes les anciennes références de LaunchScreen
          # et des anciennes images
          # ----------------------------------------------------------

          project.files.to_a.each do |file|

            path = file.path.to_s
            basename = File.basename(path)

            remove = [
              'logo_apk_fcvv.png',
              'fcvv_launch_logo.png',
              'LaunchScreen.storyboard',
              'Launch Screen.storyboard'
            ].include?(basename)

            next unless remove

            puts 'Suppression référence : ' + path

            target.resources_build_phase.files.to_a.each do |build_file|
              if build_file.file_ref == file
                target.resources_build_phase.remove_build_file(build_file)
              end
            end

            file.remove_from_project
          end

          # ----------------------------------------------------------
          # Ajouter LaunchScreen.storyboard à la racine du projet
          # ----------------------------------------------------------

          storyboard_file = project.main_group.new_file(
            'LaunchScreen.storyboard'
          )

          target.resources_build_phase.add_file_reference(
            storyboard_file,
            true
          )

          puts 'LaunchScreen.storyboard ajouté au target.'

          # ----------------------------------------------------------
          # Build settings
          # ----------------------------------------------------------

          target.build_configurations.each do |config|

            config.build_settings['UILAUNCHSTORYBOARDNAME'] = 'LaunchScreen'

            # On ne définit volontairement PAS :
            # UIMAINSTORYBOARDFILE
            #
            # Le LaunchScreen est uniquement un launch storyboard.

            config.build_settings.delete('UIMAINSTORYBOARDFILE')

            puts(
              config.name +
              ' : UILAUNCHSTORYBOARDNAME = ' +
              config.build_settings['UILAUNCHSTORYBOARDNAME'].to_s
            )

          end

          project.save

          puts 'Projet Xcode sauvegardé.'
          "

          # ------------------------------------------------------------
          # 8. Recherche Info.plist
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 8. RECHERCHE INFO.PLIST ====="
          echo "============================================================"

          PLIST_FILE=$(find "$PROJ_DIR" \
            -maxdepth 1 \
            -name "*-Info.plist" \
            ! -name "GoogleService-Info.plist" \
            -print -quit)

          if [ -z "$PLIST_FILE" ] || [ ! -f "$PLIST_FILE" ]; then
            echo "ERREUR : Info.plist introuvable"
            exit 1
          fi

          echo "Info.plist utilisé : $PLIST_FILE"

          # ------------------------------------------------------------
          # 9. Configuration Info.plist
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 9. CONFIGURATION INFO.PLIST ====="
          echo "============================================================"

          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchStoryboardName" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UILaunchStoryboardName string LaunchScreen" \
            "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchScreen" \
            "$PLIST_FILE" 2>/dev/null || true

          echo "--- UILaunchStoryboardName ---"

          /usr/libexec/PlistBuddy \
            -c "Print :UILaunchStoryboardName" \
            "$PLIST_FILE"

          echo "--- Validation plist ---"

          plutil -lint "$PLIST_FILE"

          # ------------------------------------------------------------
          # 10. Vérification physique imageset
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 10. VERIFICATION IMAGESET ====="
          echo "============================================================"

          if [ ! -d "$IMAGESET_DIR" ]; then
            echo "ERREUR : imageset absent"
            exit 1
          fi

          if [ ! -f "$IMAGE_DEST" ]; then
            echo "ERREUR : PNG absent : $IMAGE_DEST"
            exit 1
          fi

          if [ ! -f "$IMAGESET_DIR/Contents.json" ]; then
            echo "ERREUR : Contents.json absent"
            exit 1
          fi

          echo "--- Contents.json ---"
          cat "$IMAGESET_DIR/Contents.json"

          echo "--- PNG ---"
          ls -lh "$IMAGE_DEST"
          file "$IMAGE_DEST"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g format \
            -g hasAlpha \
            "$IMAGE_DEST"

          python3 - "$IMAGE_DEST" <<'PY'
          from PIL import Image
          import sys

          path = sys.argv[1]

          image = Image.open(path)

          print(f"Image finale : {path}")
          print(f"Dimensions   : {image.size}")
          print(f"Mode         : {image.mode}")

          if image.size != (512, 512):
              raise SystemExit(
                  "ERREUR : image finale non 512x512"
              )
          PY

          # ------------------------------------------------------------
          # 11. Validation ibtool
          #
          # IMPORTANT :
          # --warnings --errors --notices doit être sans warning.
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 11. VALIDATION IBTOOL ====="
          echo "============================================================"

          xcrun ibtool --version

          echo "--- ibtool warnings/errors/notices ---"

          if ! xcrun ibtool \
              --warnings \
              --errors \
              --notices \
              "$LAUNCH_STORYBOARD"; then

            echo ""
            echo "ERREUR : ibtool signale un problème dans LaunchScreen.storyboard"
            exit 1
          fi

          echo ""
          echo "ibtool : aucune erreur bloquante."

          # ------------------------------------------------------------
          # 12. Compilation isolée du storyboard
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 12. COMPILATION STORYBOARD ====="
          echo "============================================================"

          TEST_STORYBOARD_DIR="/tmp/LaunchScreen.storyboardc"

          rm -rf "$TEST_STORYBOARD_DIR"

          if ! xcrun ibtool \
              --compile "$TEST_STORYBOARD_DIR" \
              "$LAUNCH_STORYBOARD"; then

            echo "ERREUR : compilation LaunchScreen.storyboard impossible"
            exit 1
          fi

          echo "Storyboard compilé avec succès."

          if [ ! -d "$TEST_STORYBOARD_DIR" ]; then
            echo "ERREUR : storyboardc absent après compilation"
            exit 1
          fi

          find "$TEST_STORYBOARD_DIR" \
            -maxdepth 3 \
            -print | sort

          # ------------------------------------------------------------
          # 13. Vérification Info.plist storyboard compilé
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 13. STORYBOARD COMPILE ====="
          echo "============================================================"

          STORYBOARD_PLIST="$TEST_STORYBOARD_DIR/Info.plist"

          if [ ! -f "$STORYBOARD_PLIST" ]; then
            echo "ERREUR : Info.plist du storyboard compilé absent"
            exit 1
          fi

          file "$STORYBOARD_PLIST"

          plutil -p "$STORYBOARD_PLIST"

          plutil -lint "$STORYBOARD_PLIST"

          # ------------------------------------------------------------
          # 14. Vérification Xcode finale
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 14. VERIFICATION XCODE FINALE ====="
          echo "============================================================"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts '===== Build Settings ====='

          target.build_configurations.each do |config|

            puts(
              config.name +
              ' : UILAUNCHSTORYBOARDNAME = ' +
              config.build_settings['UILAUNCHSTORYBOARDNAME'].to_s
            )

            if config.build_settings['UIMAINSTORYBOARDFILE']
              puts(
                config.name +
                ' : ATTENTION UIMAINSTORYBOARDFILE = ' +
                config.build_settings['UIMAINSTORYBOARDFILE'].to_s
              )
            end

          end

          puts ''
          puts '===== Ressources target ====='

          launch_count = 0

          target.resources_build_phase.files_references.each do |file|

            path = file.real_path.to_s

            puts path

            if File.basename(path) == 'LaunchScreen.storyboard'
              launch_count += 1
            end

          end

          puts ''
          puts 'Nombre de LaunchScreen.storyboard dans Resources : ' + launch_count.to_s

          if launch_count != 1
            raise(
              'ERREUR : attendu exactement 1 LaunchScreen.storyboard dans Resources, trouvé ' +
              launch_count.to_s
            )
          end

          puts 'LaunchScreen.storyboard correctement présent dans le target.'

          puts ''
          puts '===== Vérification anciennes références ====='

          old_found = false

          project.files.to_a.each do |file|

            path = file.path.to_s
            basename = File.basename(path)

            if basename == 'logo_apk_fcvv.png'
              puts 'ERREUR : ancienne référence logo_apk_fcvv.png : ' + path
              old_found = true
            end

            if basename == 'Launch Screen.storyboard'
              puts 'ERREUR : ancienne référence Launch Screen.storyboard : ' + path
              old_found = true
            end

          end

          raise 'Anciennes références détectées' if old_found

          puts 'Aucune ancienne référence détectée.'
          "

          # ------------------------------------------------------------
          # 15. Vérification finale des fichiers
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== 15. VERIFICATION FINALE DES FICHIERS ====="
          echo "============================================================"

          echo "--- LaunchScreen.storyboard ---"
          ls -lh "$LAUNCH_STORYBOARD"

          echo ""
          echo "--- Imageset ---"
          find "$IMAGESET_DIR" \
            -maxdepth 1 \
            -type f \
            -print | sort

          echo ""
          echo "--- Recherche anciennes ressources ---"

          OLD_FILES=$(find "$PROJ_DIR" \
            \( -name "logo_apk_fcvv.png" \
            -o -name "Launch Screen.storyboard" \) \
            -print)

          if [ -n "$OLD_FILES" ]; then
            echo "ERREUR : anciennes ressources encore présentes :"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "Aucune ancienne ressource trouvée."

          # ------------------------------------------------------------
          # 16. Résumé final
          # ------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "===== RESUME LAUNCH SCREEN ====="
          echo "============================================================"

          echo "Storyboard : $LAUNCH_STORYBOARD"
          echo "Image      : $IMAGE_DEST"
          echo "Info.plist : $PLIST_FILE"
          echo ""
          echo "initialViewController : OK"
          echo "viewController unique  : OK"
          echo "Image 512x512          : OK"
          echo "Imageset               : OK"
          echo "Info.plist             : OK"
          echo "ibtool                 : OK"
          echo "Compilation storyboard : OK"
          echo "Référence Xcode        : OK"
          echo ""
          echo "============================================================"
          echo "===== CONFIGURATION LAUNCH SCREEN TERMINEE ====="
          echo "============================================================"

      
      - name: Debug Project State
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "===== DEBUG ÉTAT DU PROJET iOS AVANT BUILD ====="
          echo "============================================================"

          # ============================================================
          # 0. Détection projet
          # ============================================================

          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun .xcodeproj trouvé"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJECT_FILE")
          FULL_PROJECT_PATH="$PWD/$PROJECT_FILE"

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "FULL_PROJECT_PATH=$FULL_PROJECT_PATH"

          # ============================================================
          # 1. Arborescence projet
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 1. ARBORESCENCE PROJET ====="
          echo "============================================================"

          find "$PROJ_DIR" -maxdepth 4 -print | sort

          # ============================================================
          # 2. Launch Screen - fichiers
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 2. LAUNCH SCREEN ====="
          echo "============================================================"

          LAUNCH_STORYBOARD="$PROJ_DIR/LaunchScreen.storyboard"

          echo "--- Recherche des LaunchScreen.storyboard ---"

          find "$PROJ_DIR" \
            \( -name "LaunchScreen.storyboard" \
            -o -name "Launch Screen.storyboard" \) \
            -print

          if [ -f "$LAUNCH_STORYBOARD" ]; then

            echo ""
            echo "LaunchScreen.storyboard TROUVÉ :"
            echo "$LAUNCH_STORYBOARD"

            echo ""
            echo "--- Taille du storyboard ---"
            wc -c "$LAUNCH_STORYBOARD"

            echo ""
            echo "--- Type du fichier ---"
            file "$LAUNCH_STORYBOARD"

          else

            echo ""
            echo "ERREUR : LaunchScreen.storyboard ABSENT"
            exit 1

          fi

          # ============================================================
          # 3. Contenu XML COMPLET du LaunchScreen
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 3. XML LAUNCHSCREEN.STORYBOARD ====="
          echo "============================================================"

          cat "$LAUNCH_STORYBOARD"

          # ============================================================
          # 4. Analyse structure storyboard
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 4. STRUCTURE DU STORYBOARD ====="
          echo "============================================================"

          echo "--- document ---"

          grep -n \
            -E "<document|initialViewController=" \
            "$LAUNCH_STORYBOARD" || true

          echo ""
          echo "--- viewController ---"

          grep -n \
            -E "<viewController|sceneMemberID=\"viewController\"" \
            "$LAUNCH_STORYBOARD" || true

          echo ""
          echo "--- scenes ---"

          grep -n \
            -E "<scene|</scene>" \
            "$LAUNCH_STORYBOARD" || true

          echo ""
          echo "--- IDs ---"

          grep -n \
            -E 'id="[A-Za-z0-9]+"' \
            "$LAUNCH_STORYBOARD" || true

          echo ""
          echo "--- Références initialViewController ---"

          grep -n \
            -E "initialViewController" \
            "$LAUNCH_STORYBOARD" || true

          # ============================================================
          # 5. Vérification image dans storyboard
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 5. IMAGE DU LAUNCH SCREEN ====="
          echo "============================================================"

          grep -n \
            -E "fcvv_launch_logo|logo_apk_fcvv|image=" \
            "$LAUNCH_STORYBOARD" || true

          # ============================================================
          # 6. Validation storyboard avec ibtool
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 6. VALIDATION IBTOOL ====="
          echo "============================================================"

          echo "--- ibtool version ---"

          xcrun ibtool --version || true

          echo ""
          echo "--- ibtool warnings/errors/notices ---"

          xcrun ibtool \
            --warnings \
            --errors \
            --notices \
            "$LAUNCH_STORYBOARD" || true

          # ============================================================
          # 7. Compilation isolée du storyboard
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 7. COMPILATION TEST DU STORYBOARD ====="
          echo "============================================================"

          TEST_STORYBOARD_DIR="/tmp/LaunchScreen.storyboardc"

          rm -rf "$TEST_STORYBOARD_DIR"

          echo "Compilation vers : $TEST_STORYBOARD_DIR"

          if xcrun ibtool \
            --compile "$TEST_STORYBOARD_DIR" \
            "$LAUNCH_STORYBOARD"
          then
            echo ""
            echo "Storyboard compilé avec succès."
          else
            echo ""
            echo "ERREUR : ibtool n'a pas réussi à compiler LaunchScreen.storyboard"
            exit 1
          fi

          echo ""
          echo "--- Contenu storyboardc compilé ---"

          find "$TEST_STORYBOARD_DIR" \
            -maxdepth 3 \
            -print | sort

          echo ""
          echo "--- Taille storyboardc ---"

          du -ah "$TEST_STORYBOARD_DIR" || true

          # ============================================================
          # 8. Info.plist du storyboard compilé
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 8. INFO.PLIST DU STORYBOARD COMPILE ====="
          echo "============================================================"

          STORYBOARD_PLIST="$TEST_STORYBOARD_DIR/Info.plist"

          if [ -f "$STORYBOARD_PLIST" ]; then

            echo "Info.plist storyboard trouvé :"
            echo "$STORYBOARD_PLIST"

            echo ""
            echo "--- Type ---"
            file "$STORYBOARD_PLIST"

            echo ""
            echo "--- plutil ---"
            plutil -p "$STORYBOARD_PLIST"

            echo ""
            echo "--- Validation ---"
            plutil -lint "$STORYBOARD_PLIST"

          else

            echo "ATTENTION : aucun Info.plist dans storyboardc"

          fi

          # ============================================================
          # 9. Assets / Images.xcassets
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 9. ASSETS ====="
          echo "============================================================"

          ASSETS_DIR="$PROJ_DIR/fcvv/Images.xcassets"
          IMAGESET="$ASSETS_DIR/fcvv_launch_logo.imageset"
          LAUNCH_IMAGE="$IMAGESET/fcvv_launch_logo.png"

          echo "--- Images.xcassets ---"

          if [ -d "$ASSETS_DIR" ]; then

            find "$ASSETS_DIR" \
              -maxdepth 3 \
              -print | sort

          else

            echo "ERREUR : Images.xcassets absent"

          fi

          echo ""
          echo "--- Imageset ---"

          if [ -d "$IMAGESET" ]; then

            echo "Imageset trouvé : $IMAGESET"

            ls -lah "$IMAGESET"

            echo ""
            echo "--- Contents.json ---"

            cat "$IMAGESET/Contents.json"

          else

            echo "ERREUR : imageset absent : $IMAGESET"

          fi

          echo ""
          echo "--- PNG ---"

          if [ -f "$LAUNCH_IMAGE" ]; then

            echo "PNG trouvé : $LAUNCH_IMAGE"

            ls -lah "$LAUNCH_IMAGE"

            echo ""
            echo "--- file ---"

            file "$LAUNCH_IMAGE"

            echo ""
            echo "--- sips ---"

            sips \
              -g pixelWidth \
              -g pixelHeight \
              -g format \
              -g hasAlpha \
              "$LAUNCH_IMAGE" || true

          else

            echo "ERREUR : PNG absent : $LAUNCH_IMAGE"

          fi

          # ============================================================
          # 10. Info.plist source
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 10. INFO.PLIST SOURCE ====="
          echo "============================================================"

          PLIST_FILE=$(find "$PROJ_DIR" \
            -maxdepth 1 \
            -name "*-Info.plist" \
            ! -name "GoogleService-Info.plist" \
            -print -quit)

          if [ -n "$PLIST_FILE" ] && [ -f "$PLIST_FILE" ]; then

            echo "Info.plist trouvé : $PLIST_FILE"

            echo ""
            echo "--- Contenu ---"

            /usr/libexec/PlistBuddy \
              -c "Print" \
              "$PLIST_FILE" || true

            echo ""
            echo "--- UILaunchStoryboardName ---"

            /usr/libexec/PlistBuddy \
              -c "Print :UILaunchStoryboardName" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- UIMainStoryboardFile ---"

            /usr/libexec/PlistBuddy \
              -c "Print :UIMainStoryboardFile" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- NSMainStoryboardFile ---"

            /usr/libexec/PlistBuddy \
              -c "Print :NSMainStoryboardFile" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- UIApplicationSceneManifest ---"

            /usr/libexec/PlistBuddy \
              -c "Print :UIApplicationSceneManifest" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- UISceneConfigurations ---"

            /usr/libexec/PlistBuddy \
              -c "Print :UIApplicationSceneManifest:UISceneConfigurations" \
              "$PLIST_FILE" 2>/dev/null || echo "(absent)"

            echo ""
            echo "--- Validation ---"

            plutil -lint "$PLIST_FILE"

          else

            echo "ATTENTION : aucun Info.plist source trouvé"

          fi

          # ============================================================
          # 11. project.pbxproj - LaunchScreen
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 11. PROJECT.PBXPROJ ====="
          echo "============================================================"

          echo "--- Références LaunchScreen ---"

          grep -n -E \
            "LaunchScreen|Launch Screen" \
            "$PROJECT_FILE/project.pbxproj" || true

          echo ""
          echo "--- Build settings storyboard ---"

          grep -n -E \
            "UILAUNCHSTORYBOARDNAME|UIMAINSTORYBOARDFILE|INFOPLIST_FILE" \
            "$PROJECT_FILE/project.pbxproj" || true

          echo ""
          echo "--- OTHER_LDFLAGS ---"

          grep -n \
            "OTHER_LDFLAGS" \
            "$PROJECT_FILE/project.pbxproj" || true

          # ============================================================
          # 12. Build Settings Xcode
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 12. BUILD SETTINGS XCODE ====="
          echo "============================================================"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          puts 'Target : ' + target.name
          puts ''

          target.build_configurations.each do |config|

            puts '===== Configuration ' + config.name + ' ====='

            keys = [
              'PRODUCT_NAME',
              'PRODUCT_BUNDLE_IDENTIFIER',
              'INFOPLIST_FILE',
              'UILAUNCHSTORYBOARDNAME',
              'UIMAINSTORYBOARDFILE',
              'SWIFT_VERSION',
              'IPHONEOS_DEPLOYMENT_TARGET',
              'TARGETED_DEVICE_FAMILY',
              'SDKROOT',
              'OTHER_LDFLAGS',
              'OTHER_SWIFT_FLAGS',
              'GCC_PREPROCESSOR_DEFINITIONS'
            ]

            keys.each do |key|

              value = config.build_settings[key]

              puts key + ' = ' + value.to_s

            end

            puts ''

          end
          "

          # ============================================================
          # 13. Ressources target
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 13. RESSOURCES TARGET FCVV ====="
          echo "============================================================"

          ruby -e "
          require 'xcodeproj'

          project = Xcodeproj::Project.open('$FULL_PROJECT_PATH')

          target = project.targets.find { |t| t.name == 'fcvv' }

          raise 'Target fcvv introuvable' unless target

          target.resources_build_phase.files_references.each do |file|

            puts file.real_path.to_s

          end
          "

          # ============================================================
          # 14. Recherche SDL
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 14. SDL ====="
          echo "============================================================"

          grep -Rni \
            -E "SDL_UIKitRunApp|SDLMain|SDL_main|SDL_SetMainReady|SDLAppDelegate" \
            "$PROJ_DIR" \
            --include="*.m" \
            --include="*.mm" \
            --include="*.h" \
            --include="*.swift" \
            --include="*.plist" \
            --exclude-dir=Pods \
            --exclude-dir=DerivedData \
            --exclude-dir=build \
            2>/dev/null || true

          # ============================================================
          # 15. UIApplication / UIScene
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 15. UIAPPLICATION / UISCENE ====="
          echo "============================================================"

          grep -Rni \
            -E "UIApplicationMain|UIApplicationDelegate|UISceneDelegate|UISceneConfiguration|configurationForConnectingSceneSession" \
            "$PROJ_DIR" \
            --include="*.m" \
            --include="*.mm" \
            --include="*.h" \
            --include="*.swift" \
            --include="*.plist" \
            --exclude-dir=Pods \
            --exclude-dir=DerivedData \
            --exclude-dir=build \
            2>/dev/null || true

          # ============================================================
          # 16. Sources iOS
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 16. FICHIERS SOURCE IOS ====="
          echo "============================================================"

          find "$PROJ_DIR" \
            \( -name "*.swift" \
            -o -name "*.m" \
            -o -name "*.mm" \
            -o -name "*.h" \) \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print | sort

          # ============================================================
          # 17. main.m
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 17. MAIN.M ====="
          echo "============================================================"

          if [ -f "$PROJ_DIR/main.m" ]; then

            cat "$PROJ_DIR/main.m"

          else

            echo "main.m absent"

          fi

          # ============================================================
          # 18. bridge.m / bridge.h
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 18. BRIDGE ====="
          echo "============================================================"

          if [ -f "$PROJ_DIR/bridge.m" ]; then
            echo "--- bridge.m ---"
            cat "$PROJ_DIR/bridge.m"
          fi

          if [ -f "$PROJ_DIR/bridge.h" ]; then
            echo ""
            echo "--- bridge.h ---"
            cat "$PROJ_DIR/bridge.h"
          fi

          # ============================================================
          # 19. Firebase
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 19. FIREBASE ====="
          echo "============================================================"

          if [ -d "$PROJ_DIR/Pods" ]; then

            find "$PROJ_DIR/Pods" \
              -iname "*Firebase*" \
              -print 2>/dev/null || true

          else

            echo "Dossier Pods absent"

          fi

          # ============================================================
          # 20. Podfile.lock
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 20. PODFILE.LOCK ====="
          echo "============================================================"

          if [ -f "$PROJ_DIR/Podfile.lock" ]; then

            cat "$PROJ_DIR/Podfile.lock"

          else

            echo "Podfile.lock absent"

          fi

          # ============================================================
          # 21. Workspaces
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 21. WORKSPACES ====="
          echo "============================================================"

          find . -name "*.xcworkspace" -print

          # ============================================================
          # 22. Résumé diagnostic
          # ============================================================

          echo ""
          echo "============================================================"
          echo "===== 22. RESUME DIAGNOSTIC ====="
          echo "============================================================"

          echo ""
          echo "--- LaunchScreen.storyboard ---"

          if [ -f "$LAUNCH_STORYBOARD" ]; then
            echo "OK : présent"
          else
            echo "ERREUR : absent"
          fi

          echo ""
          echo "--- initialViewController ---"

          if grep -q "initialViewController=" "$LAUNCH_STORYBOARD"; then
            echo "OK : initialViewController trouvé"
            grep -n "initialViewController=" "$LAUNCH_STORYBOARD"
          else
            echo "ATTENTION : aucun initialViewController trouvé"
          fi

          echo ""
          echo "--- viewController ---"

          VC_COUNT=$(grep -c "<viewController" "$LAUNCH_STORYBOARD" || true)

          echo "Nombre de <viewController> : $VC_COUNT"

          if [ "$VC_COUNT" -eq 0 ]; then
            echo "ERREUR : aucun UIViewController dans LaunchScreen.storyboard"
          fi

          echo ""
          echo "--- image ---"

          if [ -f "$LAUNCH_IMAGE" ]; then
            echo "OK : fcvv_launch_logo.png présent"
          else
            echo "ATTENTION : image absente"
          fi

          echo ""
          echo "--- storyboard compilation ---"

          if [ -d "$TEST_STORYBOARD_DIR" ]; then
            echo "OK : storyboard compilable"
          else
            echo "ERREUR : storyboardc absent après compilation test"
          fi

          echo ""
          echo "============================================================"
          echo "===== FIN DEBUG ÉTAT DU PROJET AVANT BUILD ====="
          echo "============================================================"
      
      
      - name: Build for Real Device
        run: |
          set -euxo pipefail
          WORKSPACE_PATH=$(find "$PWD/fcvv-ios" -name "*.xcworkspace" | head -1)
        
          xcodebuild clean build \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CLANG_ENABLE_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa for Real Device
        run: |
          # 1. Trouver le chemin du .app compilé pour appareil physique
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "fcvv.app" -type d | grep "Build/Products/Debug-iphoneos" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Erreur: fcvv.app introuvable pour appareil physique"
            exit 1
          fi

          echo "Création du dossier Payload pour le .ipa..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          echo "Compression en .ipa..."
          zip -r fcvv.ipa Payload

          # Nettoyage
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: fcvv-ipa
          path: fcvv.ipa
