          project_dir = ENV['PROJECT_DIR']
          entitlements_path = ENV['ENTITLEMENTS']
          target_name = ENV['TARGET_NAME']

          project = Xcodeproj::Project.open(project_path)

          # --------------------------------------------------------
          # Target
          # --------------------------------------------------------

          target = project.targets.find do |t|
            t.name == target_name
          end

          unless target
            puts "❌ Target '#{target_name}' introuvable"
            puts ""
            puts "Targets disponibles :"

            project.targets.each do |t|
              puts "  - #{t.name}"
            end

            exit 1
          end

          puts "✓ Target trouvé : #{target.name}"

          # --------------------------------------------------------
          # Référence du fichier entitlements
          # --------------------------------------------------------

          relative_entitlements =
            Pathname.new(entitlements_path)
              .relative_path_from(Pathname.new(project_dir))
              .to_s

          file_ref = project.files.find do |f|
            f.path == relative_entitlements ||
            f.path == File.basename(entitlements_path)
          end

          unless file_ref
            file_ref = project.main_group.new_file(
              entitlements_path
            )

            puts "✓ fcvv.entitlements ajouté au projet"
          else
            puts "✓ fcvv.entitlements déjà présent"
          end

          # --------------------------------------------------------
          # CODE_SIGN_ENTITLEMENTS
          # --------------------------------------------------------

          target.build_configurations.each do |config|

            config.build_settings[
              "CODE_SIGN_ENTITLEMENTS"
            ] = "fcvv.entitlements"

            config.build_settings[
              "CODE_SIGNING_ALLOWED"
            ] = "YES"

            puts "✓ #{config.name}"
            puts "    CODE_SIGN_ENTITLEMENTS = fcvv.entitlements"
            puts "    CODE_SIGNING_ALLOWED   = YES"
          end

          project.save

          puts "✓ Projet Xcode sauvegardé"
          RUBY

          # --------------------------------------------------------
          # Vérification plist
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "  VÉRIFICATION ENTITLEMENTS"
          echo "============================================================"

          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "❌ Entitlements non créé"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy \
              -c "Print :aps-environment" \
              "$ENTITLEMENTS" >/dev/null 2>&1; then

            echo "❌ aps-environment absent"
            exit 1
          fi

          CURRENT_APNS=$(
            /usr/libexec/PlistBuddy \
              -c "Print :aps-environment" \
              "$ENTITLEMENTS"
          )

          if [ "$CURRENT_APNS" != "$APNS_ENVIRONMENT" ]; then
            echo "❌ Mauvais environnement APNs"
            echo "   Attendu : $APNS_ENVIRONMENT"
            echo "   Trouvé  : $CURRENT_APNS"
            exit 1
          fi

          echo "✓ aps-environment = $CURRENT_APNS"

          # --------------------------------------------------------
          # Vérification Xcode
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "  VÉRIFICATION CODE SIGNING"
          echo "============================================================"

          BUILD_SETTINGS="$(
            xcodebuild \
              -project "$XCODEPROJ" \
              -target "$TARGET_NAME" \
              -showBuildSettings \
              2>/dev/null
          )"

          if ! echo "$BUILD_SETTINGS" |
              grep -q "CODE_SIGN_ENTITLEMENTS = fcvv.entitlements"; then

            echo "❌ CODE_SIGN_ENTITLEMENTS incorrect"
            echo "$BUILD_SETTINGS" |
              grep "CODE_SIGN_ENTITLEMENTS" || true
            exit 1
          fi

          echo "✓ CODE_SIGN_ENTITLEMENTS = fcvv.entitlements"

          # --------------------------------------------------------
          # Vérification de la présence de Push Notifications dans
          # le fichier entitlements
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "  CONFIGURATION APNs TERMINÉE"
          echo "============================================================"

          echo "✓ Target       : $TARGET_NAME"
          echo "✓ Entitlements : fcvv.entitlements"
          echo "✓ APNs         : $APNS_ENVIRONMENT"
          echo "✓ Signing      : activé"
      
      
      # ============================================================
      # 11. CONFIGURE PODS + INFO.PLIST
      # ============================================================
      - name: Configure and Install Pods
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Recherche du projet Xcode ====="
          PROJECT_FILE=$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -name "*.xcodeproj" \
              -type d \
              -print \
              -quit
          )
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : aucun fichier .xcodeproj trouvé."
            find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -print
            exit 1
          fi
          # Chemins ABSOLUS partout.
          PROJ_DIR="$(dirname "$PROJECT_FILE")"
          PROJ_NAME="$(basename "$PROJECT_FILE")"
          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          echo "PROJ_NAME=$PROJ_NAME"
          if [ ! -d "$PROJ_DIR" ]; then
            echo "ERREUR : dossier projet introuvable : $PROJ_DIR"
            exit 1
          fi
          cd "$PROJ_DIR"
          # ========================================================
          # 1. Info.plist
          # ========================================================
          PLIST_FILE=$(
            find "$PROJ_DIR" \
              -maxdepth 1 \
              -name "*-Info.plist" \
              ! -name "GoogleService-Info.plist" \
              -type f \
              -print \
              -quit
          )
          if [ -z "$PLIST_FILE" ]; then
            echo "ERREUR : Info.plist principal introuvable."
            find "$PROJ_DIR" -maxdepth 1 -name "*.plist" -print
            exit 1
          fi
          echo "Info.plist = $PLIST_FILE"
          plutil -convert xml1 "$PLIST_FILE"

          # ========================================================
          # Status Bar iOS
          # ========================================================
          
          /usr/libexec/PlistBuddy \
            -c "Delete :UIStatusBarHidden" \
            "$PLIST_FILE" 2>/dev/null || true
          
          /usr/libexec/PlistBuddy \
            -c "Add :UIStatusBarHidden bool false" \
            "$PLIST_FILE"
          
          /usr/libexec/PlistBuddy \
            -c "Delete :UIViewControllerBasedStatusBarAppearance" \
            "$PLIST_FILE" 2>/dev/null || true
          
          /usr/libexec/PlistBuddy \
            -c "Add :UIViewControllerBasedStatusBarAppearance bool false" \
            "$PLIST_FILE"
          
          echo "===== STATUS BAR SETTINGS ====="
          
          /usr/libexec/PlistBuddy \
            -c "Print :UIStatusBarHidden" \
            "$PLIST_FILE"
          
          /usr/libexec/PlistBuddy \
            -c "Print :UIViewControllerBasedStatusBarAppearance" \
            "$PLIST_FILE"

          # ========================================================
          # 1B. FORCE KIVY WINDOWED MODE
          # ========================================================
          echo "===== FORCE IOS_IS_WINDOWED=True dans main.m ====="

          MAIN_M_FILE=$(
            find "$PROJ_DIR" \
              -name "main.m" \
              -type f \
              -print \
              -quit
          )

          if [ -z "$MAIN_M_FILE" ]; then
            echo "ERREUR : main.m introuvable."
            find "$PROJ_DIR" \
              -name "*.m" \
              -type f \
              -print
            exit 1
          fi

          echo "main.m trouvé : $MAIN_M_FILE"

          # Remplace toute valeur existante par True
          python3 - "$MAIN_M_FILE" <<'PY'
          import sys
          import re
          
          path = sys.argv[1]
          
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          
          pattern = r'putenv\(\s*"IOS_IS_WINDOWED\s*=\s*(?:True|False)"\s*\);'
          
          replacement = 'putenv("IOS_IS_WINDOWED=True");'
          
          content_new, count = re.subn(pattern, replacement, content)
          
          if count == 0:
              # Si la ligne n'existe pas, on l'insère après l'import UIKit
              marker = '#import <UIKit/UIKit.h>'
          
              if marker not in content_new:
                  raise SystemExit(
                      "ERREUR : impossible de trouver '#import <UIKit/UIKit.h>' dans main.m"
                  )
          
              content_new = content_new.replace(
                  marker,
                  marker + '\n\n// Force Kivy/SDL to keep the iOS status bar visible\n'
                           'putenv("IOS_IS_WINDOWED=True");',
                  1
              )
          
              print("Ligne IOS_IS_WINDOWED ajoutée.")
          else:
              print(f"{count} ligne(s) IOS_IS_WINDOWED corrigée(s).")
          
          with open(path, "w", encoding="utf-8") as f:
              f.write(content_new)
          PY

          echo "===== VERIFICATION main.m ====="
          grep -n -C 3 "IOS_IS_WINDOWED" "$MAIN_M_FILE"

          if ! grep -q 'putenv("IOS_IS_WINDOWED=True");' "$MAIN_M_FILE"; then
            echo "ERREUR : IOS_IS_WINDOWED=True n'a pas été injecté correctement."
            exit 1
          fi

          echo "OK : IOS_IS_WINDOWED=True est forcé."

          # ========================================================
          # 2. Version
          # ========================================================
          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleShortVersionString" \
            "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string ${APP_VERSION}" \
            "$PLIST_FILE"
          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleVersion" \
            "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" \
            "$PLIST_FILE"
          
          # ========================================================
          # 2bis. Privacy - Camera
          # ========================================================

          echo "===== INFO.PLIST AVANT MODIFICATION ====="
          plutil -lint "$PLIST_FILE"
          plutil -p "$PLIST_FILE"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" \
            "$PLIST_FILE" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Camera access may be used by an integrated component of this app." \
            "$PLIST_FILE"

          echo "===== Vérification NSCameraUsageDescription ====="

          plutil -extract NSCameraUsageDescription raw \
            "$PLIST_FILE"
          
          # ========================================================
          # 3. Bundle ID
          # ========================================================
          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string ${APP_BUNDLE_ID}" \
            "$PLIST_FILE"
          # ========================================================
          # 4. Display Name
          # ========================================================
          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string FCVV" \
            "$PLIST_FILE"
          plutil -lint "$PLIST_FILE"
          # ========================================================
          # 5. Images.xcassets
          # ========================================================
          if [ -d "$GITHUB_WORKSPACE/assets/Images.xcassets" ]; then
            echo "===== Installation Images.xcassets ====="
            rm -rf "$PROJ_DIR/fcvv/Images.xcassets"
            mkdir -p "$PROJ_DIR/fcvv"
            cp -R \
              "$GITHUB_WORKSPACE/assets/Images.xcassets" \
              "$PROJ_DIR/fcvv/Images.xcassets"
          fi
          # ========================================================
          # 6. Podfile
          # ========================================================
          echo "===== Création du Podfile ====="
          cat > "$PROJ_DIR/Podfile" <<'EOF'
          platform :ios, '15.0'
          use_frameworks! :linkage => :static
          
          project 'fcvv.xcodeproj'
          
          target 'fcvv' do
            pod 'FirebaseCore', '12.19.0'
            pod 'FirebaseMessaging', '12.19.0'
          end
          
          post_install do |installer|
          
            default_toolchain =
              '/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain'
          
            default_swift_lib =
              "#{default_toolchain}/usr/lib/swift/$(PLATFORM_NAME)"
          
            installer.pods_project.targets.each do |target|
          
              target.build_configurations.each do |config|
          
                # Toujours chercher les bibliothèques Swift
                # dans le toolchain XcodeDefault.
                config.build_settings['LIBRARY_SEARCH_PATHS'] = [
                  '$(inherited)',
                  default_swift_lib
                ]
          
                # Pas de signature pour les Pods.
                config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
                config.build_settings.delete('PROVISIONING_PROFILE')
          
                config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
          
                config.build_settings.delete('DEVELOPMENT_TEAM')
                config.build_settings.delete('CODE_SIGN_IDENTITY')
          
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
          
              end
          
            end
          
          end
          EOF
          echo "===== PODFILE ====="
          cat "$PROJ_DIR/Podfile"
          # ========================================================
          # 7. Nettoyage CocoaPods
          # ========================================================
          echo "===== Nettoyage CocoaPods ====="
          cd "$PROJ_DIR"
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock
          # ========================================================
          # 8. Installation CocoaPods
          # ========================================================
          echo "===== pod install ====="
          pod install --repo-update
          echo "===== Vérification LIBRARY_SEARCH_PATHS ====="
          grep -R "LIBRARY_SEARCH_PATHS" \
            "$PROJ_DIR/Pods/Target Support Files/Pods-fcvv" \
            || true
          
          echo "===== Recherche swiftCompatibility56 ====="
          
          find \
            "/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain" \
            -name "libswiftCompatibility56*" \
            -o \
            -name "libswiftCompatibilityPacks*" \
            || true
          grep -A 3 "FirebaseCore (" Podfile.lock
          grep -A 3 "FirebaseMessaging (" Podfile.lock
          grep -R "LIBRARY_SEARCH_PATHS" Pods
          # ========================================================
          # 9. Vérification Pods
          # ========================================================
          echo "===== Vérification CocoaPods ====="
          if [ ! -d "$PROJ_DIR/Pods" ]; then
            echo "ERREUR : dossier Pods absent."
            ls -la "$PROJ_DIR"
            exit 1
          fi
          if [ ! -d "$PROJ_DIR/Pods/Target Support Files/Pods-fcvv" ]; then
            echo "ERREUR : support files Pods-fcvv absents."
            find "$PROJ_DIR/Pods" \
              -maxdepth 3 \
              -type d \
              -print || true
            exit 1
          fi
          if [ ! -f "$PROJ_DIR/Podfile.lock" ]; then
            echo "ERREUR : Podfile.lock absent."
            exit 1
          fi
          # ========================================================
          # 10. Firebase
          # ========================================================
          test -d "$PROJ_DIR/Pods/FirebaseCore" || {
            echo "ERREUR : FirebaseCore absent."
            exit 1
          }
          test -d "$PROJ_DIR/Pods/FirebaseMessaging" || {
            echo "ERREUR : FirebaseMessaging absent."
            exit 1
          }
          echo "FirebaseCore OK"
          echo "FirebaseMessaging OK"
          # ========================================================
          # 11. Workspace
          # ========================================================
          WORKSPACE_PATH="$PROJ_DIR/fcvv.xcworkspace"
          if [ ! -d "$WORKSPACE_PATH" ]; then
            echo "ERREUR : fcvv.xcworkspace introuvable."
            find "$PROJ_DIR" \
              -maxdepth 1 \
              -name "*.xcworkspace" \
              -print
            exit 1
          fi
          echo "Workspace = $WORKSPACE_PATH"
          # ========================================================
          # 12. Liste Xcode
          # ========================================================
          xcodebuild \
            -list \
            -workspace "$WORKSPACE_PATH"
          # ========================================================
          # 13. xcconfig CocoaPods
          # ========================================================
          DEBUG_XCCONFIG="$PROJ_DIR/Pods/Target Support Files/Pods-fcvv/Pods-fcvv.debug.xcconfig"
          RELEASE_XCCONFIG="$PROJ_DIR/Pods/Target Support Files/Pods-fcvv/Pods-fcvv.release.xcconfig"
          test -f "$DEBUG_XCCONFIG" || {
            echo "ERREUR : xcconfig Debug absent."
            exit 1
          }
          test -f "$RELEASE_XCCONFIG" || {
            echo "ERREUR : xcconfig Release absent."
            exit 1
          }
          echo "===== DEBUG XCCONFIG ====="
          cat "$DEBUG_XCCONFIG"
          echo "===== RELEASE XCCONFIG ====="
          cat "$RELEASE_XCCONFIG"
          # ========================================================
          # 14. $(inherited)
          # ========================================================
          echo "===== Correction des build settings ====="
          ruby - "$PROJECT_FILE" <<'RUBY'
          require 'xcodeproj'
          
          project_path = ARGV[0]
          
          project =
            Xcodeproj::Project.open(project_path)
          
          target =
            project.targets.find { |t| t.name == 'fcvv' }
          
          raise 'Target fcvv introuvable' unless target
          
          puts "Target fcvv trouvé."
          
          # ============================================================
          # CHEMIN SWIFT XCODE 26.6
          # ============================================================
          
          swift_toolchain =
            '/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)'
          
          puts "Swift toolchain = #{swift_toolchain}"
          
          target.build_configurations.each do |config|
          
            settings = config.build_settings
          
            puts "===== #{config.name} ====="
          
            # ==========================================================
            # LIBRARY_SEARCH_PATHS
            # ==========================================================
          
            library_paths = settings['LIBRARY_SEARCH_PATHS']
          
            library_paths =
              if library_paths.nil?
                []
              elsif library_paths.is_a?(Array)
                library_paths
              else
                [library_paths.to_s]
              end
          
            library_paths.unshift('$(inherited)') unless
              library_paths.include?('$(inherited)')
          
            library_paths << swift_toolchain unless
              library_paths.include?(swift_toolchain)
          
            settings['LIBRARY_SEARCH_PATHS'] = library_paths
          
            puts "LIBRARY_SEARCH_PATHS = #{library_paths.inspect}"
          
            # ==========================================================
            # AUTRES SETTINGS AVEC $(inherited)
            # ==========================================================
          
            %w[
              GCC_PREPROCESSOR_DEFINITIONS
              HEADER_SEARCH_PATHS
              OTHER_LDFLAGS
            ].each do |key|
          
              value = settings[key]
          
              next if value.nil?
          
              values =
                value.is_a?(Array) ? value : [value.to_s]
          
              unless values.any? do |v|
                v.to_s.include?('$(inherited)')
              end
          
                values.unshift('$(inherited)')
                settings[key] = values
          
                puts "Ajout $(inherited) à #{key}"
              end
          
            end
          
          end
          
          project.save
          
          puts "Build settings corrigés."
          RUBY
          # ========================================================
          # 15. Vérification finale
          # ========================================================
          echo "===== Build settings finaux ====="
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Debug \
            -showBuildSettings \
            | grep -E \
              'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|CODE_SIGNING_ALLOWED|OTHER_LDFLAGS|HEADER_SEARCH_PATHS|GCC_PREPROCESSOR_DEFINITIONS' \
              || true
          echo "===== CocoaPods configuré avec succès ====="
      # ============================================================
      # 12. CONFIGURE LAUNCH SCREEN
      # ============================================================
      - name: Configure iOS Launch Screen
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcodeproj"
          if [ ! -d "$PROJECT_FILE" ]; then
            echo "ERREUR : projet Xcode introuvable : $PROJECT_FILE"
            find "$GITHUB_WORKSPACE" \
              -name "*.xcodeproj" \
              -print
            exit 1
          fi
          PROJ_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJ_DIR=$PROJ_DIR"
          APP_DIR="$PROJ_DIR/fcvv"
          ASSETS_DIR="$APP_DIR/Images.xcassets"
          IMAGESET_DIR="$ASSETS_DIR/fcvv_launch_logo.imageset"
          IMAGE_DEST="$IMAGESET_DIR/fcvv_launch_logo.png"
          PRESPLASH_SOURCE="$GITHUB_WORKSPACE/assets/logo_apk_fcvv.png"
          LAUNCH_STORYBOARD="$PROJ_DIR/LaunchScreen.storyboard"
          # --------------------------------------------------------
          # Vérification image
          # --------------------------------------------------------
          if [ ! -f "$PRESPLASH_SOURCE" ]; then
            echo "ERREUR : image introuvable : $PRESPLASH_SOURCE"
            exit 1
          fi
          python3 - "$PRESPLASH_SOURCE" <<'PY'
          from PIL import Image
          import sys
          image = Image.open(sys.argv[1])
          if image.size != (512, 512):
              raise SystemExit(
                  f"ERREUR : dimensions attendues 512x512, "
                  f"trouvées {image.size}"
              )
          PY
          # --------------------------------------------------------
          # Nettoyage
          # --------------------------------------------------------
          rm -f \
            "$APP_DIR/logo_apk_fcvv.png" \
            "$APP_DIR/fcvv_launch_logo.png" \
            "$PROJ_DIR/logo_apk_fcvv.png" \
            "$PROJ_DIR/fcvv_launch_logo.png" \
            "$APP_DIR/LaunchScreen.storyboard" \
            "$PROJ_DIR/LaunchScreen.storyboard" \
            "$PROJ_DIR/Storyboards/Launch Screen.storyboard"
          rm -rf \
            "$ASSETS_DIR/logo_apk_fcvv.imageset" \
            "$ASSETS_DIR/fcvv_launch_logo.imageset"
          mkdir -p "$ASSETS_DIR"
          mkdir -p "$IMAGESET_DIR"
          # --------------------------------------------------------
          # Assets catalog
          # --------------------------------------------------------
          if [ ! -f "$ASSETS_DIR/Contents.json" ]; then
            cat > "$ASSETS_DIR/Contents.json" <<'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi
          cp "$PRESPLASH_SOURCE" "$IMAGE_DEST"
          cat > "$IMAGESET_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "fcvv_launch_logo.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          # --------------------------------------------------------
          # LaunchScreen.storyboard
          # --------------------------------------------------------
          cat > "$LAUNCH_STORYBOARD" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document
              type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
              version="3.0"
              toolsVersion="23504"
              targetRuntime="iOS.CocoaTouch"
              propertyAccessControl="none"
              useAutolayout="YES"
              launchScreen="YES"
              useTraitCollections="YES"
              colorMatched="YES"
              initialViewController="LaunchScreenViewController">
              <device
                  id="retina6_12"
                  orientation="portrait"
                  appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn
                      identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin"
                      version="23506"/>
                  <capability
                      name="documents saved in the Xcode 8 format"
                      minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="LaunchScreenScene">
                      <objects>
                          <viewController
                              id="LaunchScreenViewController"
                              sceneMemberID="viewController">
                              <view
                                  key="view"
                                  contentMode="scaleToFill"
                                  id="LaunchScreenView">
                                  <rect
                                      key="frame"
                                      x="0.0"
                                      y="0.0"
                                      width="393"
                                      height="852"/>
                                  <autoresizingMask
                                      key="autoresizingMask"
                                      widthSizable="YES"
                                      heightSizable="YES"/>
                                  <subviews>
                                      <imageView
                                          clipsSubviews="YES"
                                          userInteractionEnabled="NO"
                                          contentMode="scaleAspectFit"
                                          horizontalHuggingPriority="251"
                                          verticalHuggingPriority="251"
                                          image="fcvv_launch_logo"
                                          translatesAutoresizingMaskIntoConstraints="NO"
                                          id="LaunchLogo">
                                          <rect
                                              key="frame"
                                              x="96.5"
                                              y="326"
                                              width="200"
                                              height="200"/>
                                      </imageView>
                                  </subviews>
                                  <color
                                      key="backgroundColor"
                                      red="0.117647"
                                      green="0.227451"
                                      blue="0.541176"
                                      alpha="1"
                                      colorSpace="custom"
                                      customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerX"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerX"
                                          id="CenterX"/>
                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="centerY"
                                          secondItem="LaunchScreenView"
                                          secondAttribute="centerY"
                                          id="CenterY"/>
                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="width"
                                          constant="200"
                                          id="LogoWidth"/>
                                      <constraint
                                          firstItem="LaunchLogo"
                                          firstAttribute="height"
                                          constant="200"
                                          id="LogoHeight"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder
                              placeholderIdentifier="IBFirstResponder"
                              id="FirstResponder"
                              sceneMemberID="firstResponder"/>
                      </objects>
                      <point
                          key="canvasLocation"
                          x="100"
                          y="100"/>
                  </scene>
              </scenes>
              <resources>
                  <image
                      name="fcvv_launch_logo"
                      width="512"
                      height="512"/>
              </resources>
          </document>
          EOF
          # --------------------------------------------------------
          # Validation storyboard
          # --------------------------------------------------------
          VC_COUNT=$(
            grep -c '<viewController' "$LAUNCH_STORYBOARD" || true
          )
          if [ "$VC_COUNT" -ne 1 ]; then
            echo "ERREUR : LaunchScreen doit avoir 1 viewController."
            exit 1
          fi
          grep -q \
            'initialViewController="LaunchScreenViewController"' \
            "$LAUNCH_STORYBOARD"
          grep -q \
            'image="fcvv_launch_logo"' \
            "$LAUNCH_STORYBOARD"
          # --------------------------------------------------------
          # Configuration Xcode
          # --------------------------------------------------------
          ruby - "$PROJECT_FILE" <<'RUBY'
          require 'xcodeproj'
          project_path = ARGV[0]
          project =
            Xcodeproj::Project.open(project_path)
          target =
            project.targets.find { |t| t.name == 'fcvv' }
          raise 'Target fcvv introuvable' unless target
          # Supprimer anciennes références.
          project.files.to_a.each do |file|
            basename =
              File.basename(file.path.to_s)
            next unless [
              'logo_apk_fcvv.png',
              'fcvv_launch_logo.png',
              'LaunchScreen.storyboard',
              'Launch Screen.storyboard'
            ].include?(basename)
            target.resources_build_phase.files.to_a.each do |build_file|
              if build_file.file_ref == file
                target.resources_build_phase.remove_build_file(
                  build_file
                )
              end
            end
            file.remove_from_project
          end
          # Vérifier si le storyboard existe déjà.
          storyboard_file =
            project.files.to_a.find do |file|
              File.basename(
                file.path.to_s
              ) == 'LaunchScreen.storyboard'
            end
          unless storyboard_file
            storyboard_file =
              project.main_group.new_file(
                'LaunchScreen.storyboard'
              )
          end
          already_in_resources =
            target.resources_build_phase.files.to_a.any? do |build_file|
              build_file.file_ref == storyboard_file
            end
          unless already_in_resources
            target.resources_build_phase.add_file_reference(
              storyboard_file,
              true
            )
          end
          target.build_configurations.each do |config|
            config.build_settings['UILAUNCHSTORYBOARDNAME'] =
              'LaunchScreen'
            config.build_settings.delete(
              'UIMAINSTORYBOARDFILE'
            )
          end
          project.save
          RUBY
          # --------------------------------------------------------
          # Info.plist
          # --------------------------------------------------------
          PLIST_FILE=$(
            find "$PROJ_DIR" \
              -maxdepth 1 \
              -name "*-Info.plist" \
              ! -name "GoogleService-Info.plist" \
              -type f \
              -print \
              -quit
          )
          if [ -z "$PLIST_FILE" ]; then
            echo "ERREUR : Info.plist introuvable."
            exit 1
          fi
          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchStoryboardName" \
            "$PLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :UILaunchStoryboardName string LaunchScreen" \
            "$PLIST_FILE"
          /usr/libexec/PlistBuddy \
            -c "Delete :UILaunchScreen" \
            "$PLIST_FILE" 2>/dev/null || true
          plutil -lint "$PLIST_FILE"
          # --------------------------------------------------------
          # Validation ressources
          # --------------------------------------------------------
          test -f "$IMAGE_DEST"
          test -f "$IMAGESET_DIR/Contents.json"
          test -f "$LAUNCH_STORYBOARD"
          # --------------------------------------------------------
          # ibtool
          # --------------------------------------------------------
          xcrun ibtool \
            --warnings \
            --errors \
            --notices \
            "$LAUNCH_STORYBOARD"
          TEST_STORYBOARD_DIR="/tmp/FCVV-LaunchScreen.storyboardc"
          rm -rf "$TEST_STORYBOARD_DIR"
          xcrun ibtool \
            --compile "$TEST_STORYBOARD_DIR" \
            "$LAUNCH_STORYBOARD"
          STORYBOARD_PLIST="$TEST_STORYBOARD_DIR/Info.plist"
          if [ ! -f "$STORYBOARD_PLIST" ]; then
            echo "ERREUR : storyboard compilé invalide."
            exit 1
          fi
          plutil -lint "$STORYBOARD_PLIST"
          echo "Launch Screen configuré avec succès."
      # ============================================================
      # 13. VERIFY WORKSPACE / SCHEME
      # ============================================================
      - name: Verify Xcode workspace
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="$GITHUB_WORKSPACE/fcvv-ios"
          WORKSPACE_PATH="$PROJ_DIR/fcvv.xcworkspace"
          if [ ! -d "$WORKSPACE_PATH" ]; then
            echo "ERREUR : workspace introuvable : $WORKSPACE_PATH"
            find "$GITHUB_WORKSPACE" \
              -name "*.xcworkspace" \
              -print
            exit 1
          fi
          echo "Workspace = $WORKSPACE_PATH"
          echo "===== TARGETS / SCHEMES ====="
          xcodebuild \
            -list \
            -workspace "$WORKSPACE_PATH"
          echo "===== BUILD SETTINGS ====="
          xcodebuild \
            -showBuildSettings \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            > /tmp/fcvv-build-settings.txt
          echo "===== SIGNATURE ====="
          grep \
            -E \
            'CODE_SIGN|CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER' \
            /tmp/fcvv-build-settings.txt \
            || true
          echo "===== FIREBASE ====="
          grep \
            -E \
            'Firebase|GoogleService' \
            /tmp/fcvv-build-settings.txt \
            || true
      
      # ============================================================
      # 13bis. DEBUG CERTIFICATE
      # ============================================================
      - name: Debug Apple Distribution certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
      
          P12_FILE="$RUNNER_TEMP/fcvv-distribution.p12"
      
          echo "Décodage du certificat..."
      
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12_FILE"
      
          echo "Taille du fichier décodé :"
          ls -lh "$P12_FILE"
      
          echo "Vérification PKCS#12 avec OpenSSL..."
      
          openssl pkcs12 \
            -info \
            -in "$P12_FILE" \
            -noout \
            -passin env:P12_PASSWORD
      
          echo "============================================================"
          echo "CERTIFICAT PKCS#12 VALIDE SUR LE RUNNER"
          echo "============================================================"
          echo "============================================================"

      
      
      
      # ============================================================
      # 13bis. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # ============================================================
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      
      # ============================================================
      # 13ter. INSTALL PROVISIONING PROFILE
      # ============================================================
      - name: Install App Store provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision"
          if [ ! -s "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision" ]; then
            echo "ERREUR : provisioning profile vide."
            exit 1
          fi
          echo "Provisioning profile installé."
          # --------------------------------------------------------
          # Extraction des informations du profil
          # --------------------------------------------------------
          security cms \
            -D \
            -i "$PROFILE_DIR/FCVV_AppStore_Distribution.mobileprovision" \
            > "$RUNNER_TEMP/fcvv-profile.plist"
          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/fcvv-profile.plist"
          )
          
          
          PROFILE_APS_ENVIRONMENT=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$RUNNER_TEMP/fcvv-profile.plist" \
              2>/dev/null || true
          )
          
          echo "Profile APNs Environment = $PROFILE_APS_ENVIRONMENT"
          
          if [ "$PROFILE_APS_ENVIRONMENT" != "production" ]; then
            echo "ERREUR : le provisioning profile n'est pas configuré pour APNs production."
            exit 1
          fi
          echo "Profile Name = $PROFILE_NAME"
          echo "Profile UUID = $PROFILE_UUID"
          echo "Profile App ID = $PROFILE_APP_ID"
          if [ "$PROFILE_NAME" != "FCVV AppStore Distribution" ]; then
            echo "ERREUR : nom du provisioning profile inattendu."
            exit 1
          fi
          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}" ]; then
            echo "ERREUR : App ID du provisioning profile incorrect."
            exit 1
          fi
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Provisioning profile validé."
      
      # ============================================================
      # 13quater. CONFIGURE RELEASE CODE SIGNING
      # ============================================================
      - name: Configure Release code signing
        shell: bash
        run: |
          set -euo pipefail
      
          PROJECT_FILE="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcodeproj"
          WORKSPACE_PATH="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcworkspace"
      
          if [ ! -d "$PROJECT_FILE" ]; then
            echo "ERREUR : projet Xcode introuvable : $PROJECT_FILE"
            exit 1
          fi
      
          if [ ! -d "$WORKSPACE_PATH" ]; then
            echo "ERREUR : workspace introuvable : $WORKSPACE_PATH"
            exit 1
          fi
      
          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "WORKSPACE_PATH=$WORKSPACE_PATH"
      
          ruby - "$PROJECT_FILE" \
            "$APPLE_TEAM_ID" \
            "$APP_BUNDLE_ID" \
            "$PROVISIONING_PROFILE_NAME" <<'RUBY'
      
          require 'xcodeproj'
      
          project_path = ARGV[0]
          team_id      = ARGV[1]
          bundle_id    = ARGV[2]
          profile_name = ARGV[3]
      
          project = Xcodeproj::Project.open(project_path)
      
          target = project.targets.find { |t| t.name == 'fcvv' }
      
          raise 'Target fcvv introuvable' unless target
      
          puts "Target application trouvé : #{target.name}"
      
          target.build_configurations.each do |config|
      
            puts ""
            puts "============================================================"
            puts "CONFIGURATION : #{config.name}"
            puts "============================================================"
      
            # Bundle ID
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] =
              bundle_id
      
            # Team
            config.build_settings['DEVELOPMENT_TEAM'] =
              team_id
      
            # Modules
            config.build_settings['CLANG_ENABLE_MODULES'] =
              'YES'
      
            if config.name == 'Release'
      
              puts "Configuration Release : signature Distribution"
      
              # --------------------------------------------------------
              # SIGNATURE MANUELLE DISTRIBUTION
              # --------------------------------------------------------
      
              config.build_settings['CODE_SIGN_STYLE'] =
                'Manual'
      
              config.build_settings['CODE_SIGN_IDENTITY'] =
                'Apple Distribution'
      
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] =
                'Apple Distribution'
      
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] =
                profile_name
      
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] =
                profile_name
      
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] =
                'fcvv.entitlements'
      
              puts "CODE_SIGN_STYLE = #{config.build_settings['CODE_SIGN_STYLE']}"
              puts "CODE_SIGN_IDENTITY = #{config.build_settings['CODE_SIGN_IDENTITY']}"
              puts "CODE_SIGN_IDENTITY[sdk=iphoneos*] = #{config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]']}"
              puts "PROVISIONING_PROFILE_SPECIFIER = #{config.build_settings['PROVISIONING_PROFILE_SPECIFIER']}"
              puts "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] = #{config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]']}"
              puts "DEVELOPMENT_TEAM = #{config.build_settings['DEVELOPMENT_TEAM']}"
              puts "PRODUCT_BUNDLE_IDENTIFIER = #{config.build_settings['PRODUCT_BUNDLE_IDENTIFIER']}"
      
            else
      
              puts "Configuration #{config.name} : suppression du provisioning manuel"
      
              config.build_settings.delete(
                'PROVISIONING_PROFILE'
              )
      
              config.build_settings.delete(
                'PROVISIONING_PROFILE_SPECIFIER'
              )
      
              config.build_settings.delete(
                'PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'
              )
      
              config.build_settings.delete(
                'CODE_SIGN_IDENTITY[sdk=iphoneos*]'
              )
      
            end
      
          end
      
          project.save
      
          puts ""
          puts "============================================================"
          puts "CONFIGURATION RELEASE TERMINÉE"
          puts "============================================================"
      
          RUBY
      
          echo ""
          echo "============================================================"
          echo "     VERIFICATION DU PROJECT.PBXPROJ"
          echo "============================================================"
      
          grep -n \
            -E \
            'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER' \
            "$PROJECT_FILE/project.pbxproj" \
            || true
      
          # ==========================================================
          # VERIFICATION
          # ==========================================================
      
          echo ""
          echo "============================================================"
          echo "        VERIFICATION SIGNATURE APPLICATION"
          echo "============================================================"
      
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE|CODE_SIGN_ENTITLEMENTS|CLANG_ENABLE_MODULES' \
              || true
      
          echo ""
          echo "============================================================"
          echo "        VERIFICATION PODS"
          echo "============================================================"
      
          echo "Recherche d'un provisioning profile dans les Pods..."
      
          if grep -R \
            -n \
            -E \
            'PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE[[:space:]]*=' \
            "$GITHUB_WORKSPACE/fcvv-ios/Pods" \
            --include="*.xcconfig" \
            --include="project.pbxproj" \
            2>/dev/null; then
      
            echo ""
            echo "ERREUR : un provisioning profile est encore présent dans Pods."
            exit 1
      
          else
      
            echo "OK : aucun provisioning profile manuel trouvé dans les Pods."
      
          fi

      
      - name: Diagnose Firebase Swift linker
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="$GITHUB_WORKSPACE/fcvv-ios"
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"
          xcodebuild -version
          swift --version
          xcrun --find swift
          xcrun --find clang
          echo "============================================================"
          echo "SDK"
          echo "============================================================"
          xcrun --sdk iphoneos --show-sdk-path
          find \
            /Applications/Xcode_26.6.app \
            -name "libswiftCompatibility56*" \
            -print
          echo "============================================================"
          echo "SWIFT COMPATIBILITY LIBRARIES"
          echo "============================================================"
          find /Applications/Xcode_26.6.app \
            -name "libswiftCompatibility*" \
            -print \
            || true
          echo "============================================================"
          echo "FIREBASE PODS"
          echo "============================================================"
          find "$PROJ_DIR/Pods" \
            -maxdepth 3 \
            -type f \
            \( -name "*.podspec" -o -name "*.xcconfig" \) \
            -print \
            | sort
          echo "============================================================"
          echo "FIREBASE VERSIONS"
          echo "============================================================"
          grep -R \
            -n \
            "FirebaseCore" \
            "$PROJ_DIR/Podfile.lock" \
            || true
          grep -R \
            -n \
            "FirebaseMessaging" \
            "$PROJ_DIR/Podfile.lock" \
            || true
          echo "============================================================"
          echo "SUSPICIOUS SWIFT / METAL REFERENCES"
          echo "============================================================"
          grep -R \
            -n \
            "MobileAsset.MetalToolchain\|swiftCompatibility\|UIUtilities\|SwiftUICore" \
            "$PROJ_DIR" \
            --include="project.pbxproj" \
            --include="*.xcconfig" \
            --include="Podfile" \
            --include="Podfile.lock" \
            || true
          echo "============================================================"
          echo "FIREBASECOREINTERNAL"
          echo "============================================================"
          find "$PROJ_DIR/Pods" \
            -iname "*FirebaseCoreInternal*" \
            -print
          echo "============================================================"
          echo "FIREBASE FRAMEWORKS"
          echo "============================================================"
          find "$PROJ_DIR/Pods" \
            -name "*.framework" \
            | grep Fi*ebase \
            || true
          echo "============================*==============================="
          echo "SEARCH IN PODS"
          echo "========*==================================*================"
          grep -R "swiftCompatibility" "$PROJ_DIR/Pods" || true
          grep -R "UIUtilities" "$PROJ_DIR/Pods" || true
          grep -R "SwiftUICore" "$PROJ_DIR/Pods" || true
          
          echo "============================================================"
          echo "LINK FLAGS"
          echo "============================================================"
          xcodebuild \
            -workspace "$PROJ_DIR/fcvv.xcworkspace" \
            -scheme fcvv \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            > "$RUNNER_TEMP/fcvv-settings.txt"
          grep -E \
            "LIBRARY_SEARCH_PATHS|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|SWIFT_VERSION|SWIFT_OBJC_INTERFACE_HEADER_NAME|CLANG_ENABLE_MODULES" \
            "$RUNNER_TEMP/fcvv-settings.txt" \
            || true
            
      - name: Check Swift libraries
        shell: bash
        run: |
          set -euxo pipefail
      
          echo "=== SWIFT ==="
          xcrun swift --version
      
          echo "=== SWIFT TOOLCHAIN ==="
          xcrun --find swift
      
          echo "=== SWIFT LIBRARIES ==="
          find /Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift \
            -maxdepth 2 \
            -type f \
            | grep -E 'swiftCompatibility|libswiftCore' \
            | head -50
      # ============================================================
      # 18. ARCHIVE DEVICE / IPHONEOS
      # ============================================================
      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_PATH="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcworkspace"
          PROJECT_FILE="$GITHUB_WORKSPACE/fcvv-ios/fcvv.xcodeproj/project.pbxproj"
          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/FCVV.xcarchive"
          ARCHIVE_LOG="$GITHUB_WORKSPACE/build/archive.log"

          # ============================================================
          # NETTOYAGE
          # ============================================================
          echo "============================================================"
          echo "          NETTOYAGE DERIVED DATA"
          echo "============================================================"

          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          echo "✓ DerivedData nettoyé"
          echo "✓ build/ CONSERVÉ"

          cd "$GITHUB_WORKSPACE/fcvv-ios"

          # ============================================================
          # INFORMATIONS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             ARCHIVE IPHONEOS FCVV"
          echo "============================================================"

          echo ""
          echo "===== IDENTITÉS DE SIGNATURE ====="

          security find-identity \
            -v \
            -p codesigning \
            signing_temp.keychain

          # ============================================================
          # BUILD SETTINGS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                 BUILD SETTINGS FCVV"
          echo "============================================================"

          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_NAME}" \
            CLANG_ENABLE_MODULES=YES \
            | grep -E \
              'TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS|CLANG_ENABLE_MODULES|SDKROOT|IPHONEOS_DEPLOYMENT_TARGET|LIBRARY_SEARCH_PATHS|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS' \
            || true

          # ============================================================
          # RSYNC
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     VERIFICATION RSYNC"
          echo "============================================================"

          echo "PATH = $PATH"

          command -v rsync || true
          rsync --version || true
          /usr/bin/rsync --version || true
          type -a rsync || true

          # ============================================================
          # SDL SOURCE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL SOURCE AVANT ARCHIVE"
          echo "============================================================"

          echo ""
          echo "===== TOUTES LES COPIES SDL_uikitappdelegate.m ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -print

          echo ""
          echo "===== FCVV DANS LES SOURCES SDL ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -exec grep -Hn \
              "fcvvConfigureFirebaseAndNotifications" {} \; \
            || true

          echo ""
          echo "===== STRINGS [FCVV] DANS LES SOURCES SDL ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SDL_uikitappdelegate.m" \
            -exec grep -Hn \
              "\[FCVV\]" {} \; \
            || true

          # ============================================================
          # OBJET SDL_uikitappdelegate.o
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL_UKITAPPDELEGATE.O"
          echo "============================================================"

          SDL_OBJ="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64/SDL2-2.28.5/Xcode/SDL/build/SDL.build/Release-iphoneos/Static Library-iOS.build/Objects-normal/arm64/SDL_uikitappdelegate.o"

          if [ -f "$SDL_OBJ" ]; then

            echo ""
            echo "Objet trouvé :"
            echo "$SDL_OBJ"

            echo ""
            echo "===== CHAÎNES FCVV DANS .O ====="

            strings "$SDL_OBJ" \
              | grep -E "\[FCVV\]|fcvvConfigureFirebaseAndNotifications|Firebase|APNs" \
              || true

            echo ""
            echo "===== SYMBOLES FCVV DANS .O ====="

            nm "$SDL_OBJ" \
              | grep -i fcvv \
              || true

          else
            echo "⚠️ SDL_uikitappdelegate.o introuvable"
          fi

          # ============================================================
          # ARTEFACTS SDL2
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             ARTEFACTS SDL2 IPHONEOS"
          echo "============================================================"

          SDL_DEVICE_DIR="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64"

          if [ -d "$SDL_DEVICE_DIR" ]; then

            echo ""
            echo "Répertoire SDL device :"
            echo "$SDL_DEVICE_DIR"

            echo ""
            echo "===== FICHIERS SDL ====="

            find "$SDL_DEVICE_DIR" \
              -type f \
              \( \
                -name "*.a" \
                -o -name "*.framework" \
                -o -name "*.xcframework" \
                -o -name "*.dylib" \
                -o -name "*.o" \
              \) \
              -print

          else
            echo "⚠️ Répertoire SDL device introuvable :"
            echo "$SDL_DEVICE_DIR"
          fi

          # ============================================================
          # RECHERCHE LIBSDL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             RECHERCHE LIBRAIRIES SDL"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/build" \
            -type f \
            \( \
              -name "libSDL*.a" \
              -o -name "SDL*.framework" \
              -o -name "SDL*.xcframework" \
              -o -name "libSDL*.dylib" \
            \) \
            -print \
            || true

          # ============================================================
          # STRINGS FCVV DANS LES ARTEFACTS SDL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "       [FCVV] DANS LES ARTEFACTS SDL2"
          echo "============================================================"

          SDL_ARTIFACT_FOUND=0
          SDL_FCVV_FOUND=0

          while IFS= read -r SDL_ARTIFACT; do

            SDL_ARTIFACT_FOUND=1

            echo ""
            echo "------------------------------------------------------------"
            echo "Artefact : $SDL_ARTIFACT"
            echo "------------------------------------------------------------"

            file "$SDL_ARTIFACT" || true

            if strings "$SDL_ARTIFACT" 2>/dev/null \
              | grep -E \
                "\[FCVV\]|Initialisation Firebase|Autorisation notifications|registerForRemoteNotifications|fcvvConfigureFirebaseAndNotifications" \
              | sort -u
            then
              echo "✓✓✓ FCVV TROUVÉ DANS CET ARTEFACT SDL ✓✓✓"
              SDL_FCVV_FOUND=1
            else
              echo "⚠️ aucune chaîne FCVV dans cet artefact"
            fi

          done < <(
            find "$GITHUB_WORKSPACE/build" \
              -type f \
              \( \
                -name "libSDL*.a" \
                -o -name "libSDL*.dylib" \
              \) \
              -print
          )

          if [ "$SDL_ARTIFACT_FOUND" -eq 0 ]; then
            echo ""
            echo "⚠️ Aucun libSDL*.a / libSDL*.dylib trouvé."
            echo "Il faut probablement chercher un framework SDL2."
          fi

          # ============================================================
          # XCFRAMEWORK SDL UTILISÉ PAR XCODE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             XCFRAMEWORK UTILISÉ PAR XCODE"
          echo "============================================================"

          SDL_XCFRAMEWORK="$GITHUB_WORKSPACE/dist/xcframework/libSDL2.xcframework"

          echo ""
          echo "===== CONTENU XCFRAMEWORK ====="

          find "$SDL_XCFRAMEWORK" \
            -type f \
            | sort \
            || true

          echo ""
          echo "===== FCVV DANS LES .A DU XCFRAMEWORK ====="

          find "$SDL_XCFRAMEWORK" \
            -type f \
            -name "*.a" \
            | while read -r LIB; do

                echo ""
                echo "------------------------------------------------------------"
                echo "$LIB"
                echo "------------------------------------------------------------"

                strings "$LIB" \
                  | grep -E "\[FCVV\]|fcvvConfigureFirebaseAndNotifications|registerForRemoteNotifications" \
                  || true

              done

          # ============================================================
          # REFERENCES SDL DANS XCODE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             REFERENCES SDL DANS XCODE"
          echo "============================================================"

          echo ""
          echo "===== SDL DANS project.pbxproj ====="

          grep -n \
            -E "SDL2|libSDL|SDL.framework|SDL2.framework" \
            "$PROJECT_FILE" \
            | head -100 \
            || true

          echo ""
          echo "===== build/sdl2 DANS LE PROJET ====="

          grep -Rni \
            "build/sdl2" \
            "$GITHUB_WORKSPACE/fcvv-ios" \
            | head -100 \
            || true

          echo ""
          echo "===== SDL_uikitappdelegate.m DANS project.pbxproj ====="

          grep -n \
            "SDL_uikitappdelegate.m" \
            "$PROJECT_FILE" \
            || true

          # ============================================================
          # ARCHIVE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     XCODEBUILD ARCHIVE"
          echo "============================================================"

          echo "Log complet : $ARCHIVE_LOG"

          mkdir -p "$(dirname "$ARCHIVE_LOG")"

          xcodebuild archive \
            -verbose \
            -workspace "$WORKSPACE_PATH" \
            -scheme fcvv \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            MARKETING_VERSION="${APP_VERSION}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_NAME}" \
            CLANG_ENABLE_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$ARCHIVE_LOG"

          # ============================================================
          # VERIFICATION ARCHIVE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION ARCHIVE"
          echo "============================================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ ERREUR : archive absente."
            exit 1
          fi

          if [ ! -d "$ARCHIVE_PATH/Products/Applications/fcvv.app" ]; then
            echo "❌ ERREUR : fcvv.app absente."
            exit 1
          fi

          echo "✓ Archive créée : $ARCHIVE_PATH"
          echo "✓ fcvv.app présente"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

          # ============================================================
          # SDL DANS ARCHIVE.LOG
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             SDL DANS ARCHIVE.LOG"
          echo "============================================================"

          echo ""
          echo "===== SDL_uikitappdelegate.m ====="

          grep -n \
            "SDL_uikitappdelegate.m" \
            "$ARCHIVE_LOG" \
            || true

          echo ""
          echo "===== build/sdl2 ====="

          grep -n \
            "build/sdl2" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          echo ""
          echo "===== iphoneos-arm64 ====="

          grep -n \
            "iphoneos-arm64" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          echo ""
          echo "===== libSDL ====="

          grep -n \
            -E "libSDL|SDL2.framework|SDL2.xcframework" \
            "$ARCHIVE_LOG" \
            | head -100 \
            || true

          # ============================================================
          # BINAIRE FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION BINAIRE FINAL"
          echo "============================================================"

          APP_PATH="$ARCHIVE_PATH/Products/Applications/fcvv.app"
          APP_BINARY="$APP_PATH/fcvv"

          if [ ! -f "$APP_BINARY" ]; then
            echo "❌ ERREUR : binaire final introuvable :"
            echo "$APP_BINARY"
            exit 1
          fi

          echo "✓ Binaire final trouvé :"
          echo "$APP_BINARY"

          file "$APP_BINARY"

          # ============================================================
          # FCVV DANS BINAIRE FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                 FCVV DANS BINAIRE FINAL"
          echo "============================================================"

          FCVV_STRINGS=$(
            strings "$APP_BINARY" \
              | grep -E \
                "\[FCVV\]|Initialisation Firebase|Autorisation notifications|registerForRemoteNotifications|fcvvConfigureFirebaseAndNotifications" \
              | sort -u \
              || true
          )

          if [ -z "$FCVV_STRINGS" ]; then
            echo "⚠️ AUCUNE chaîne FCVV dans le binaire final."
          else
            echo "✓✓✓ FCVV TROUVÉ DANS LE BINAIRE FINAL ✓✓✓"
            echo ""
            echo "$FCVV_STRINGS"
          fi

          # ============================================================
          # FIREBASE
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     FIREBASE FINAL"
          echo "============================================================"

          strings "$APP_BINARY" \
            | grep -E \
              "Firebase|FIRApp|FIRMessaging" \
            | head -50 \
            || true

          # ============================================================
          # NOTIFICATIONS
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                NOTIFICATIONS FINAL"
          echo "============================================================"

          strings "$APP_BINARY" \
            | grep -E \
              "registerForRemoteNotifications|requestAuthorization|UNUserNotificationCenter|UNUserNotificationCenterDelegate" \
            | head -50 \
            || true

          # ============================================================
          # DIAGNOSTIC FINAL
          # ============================================================
          echo ""
          echo "============================================================"
          echo "                     DIAGNOSTIC FINAL"
          echo "============================================================"

          echo ""
          echo "SDL_FCVV_FOUND = $SDL_FCVV_FOUND"

          if [ "$SDL_FCVV_FOUND" -eq 1 ]; then
            echo "✓ Le code FCVV est présent dans un artefact SDL2."
            echo "→ Le problème est probablement le linkage de cet artefact dans fcvv."
          else
            echo "⚠️ Le code FCVV n'est présent dans aucun artefact SDL2 détecté."
            echo "→ Le .m modifié n'est probablement pas recompilé dans SDL2."
          fi

          if [ -n "$FCVV_STRINGS" ]; then
            echo "✓ Le code FCVV est présent dans le binaire final."
          else
            echo "⚠️ Le code FCVV n'est PAS présent dans le binaire final."
          fi

          echo ""
          echo "============================================================"
          echo "                      CHEMINS FINAUX"
          echo "============================================================"

          echo ""
          echo "============================================================"
          echo "               COMPARAISON SDL COMPLETE"
          echo "============================================================"
          echo ""
          echo "source SDL_uikitappdelegate.m : OUI"

          echo ""
          echo "Recherche FCVV dans SDL_uikitappdelegate.o"

          strings "$SDL_OBJ" 2>/dev/null \
            | grep -q "\[FCVV\]"

          if [ $? -eq 0 ]; then
            echo "✓ FCVV présent dans SDL_uikitappdelegate.o"
          else
            echo "❌ FCVV absent de SDL_uikitappdelegate.o"
          fi

          echo ""
          echo "Recherche FCVV dans libSDL2.a"

          SDL_LIB="$GITHUB_WORKSPACE/build/sdl2/iphoneos-arm64/SDL2-2.28.5/Xcode/SDL/build/Release-iphoneos/libSDL2.a"
          strings "$SDL_LIB" 2>/dev/null \
            | grep -q "\[FCVV\]"

          if [ $? -eq 0 ]; then
            echo "✓ FCVV présent dans libSDL2.a"
          else
            echo "❌ FCVV absent de libSDL2.a"
          fi

          echo ""
          echo "Recherche FCVV dans le binaire final"

          if [ -n "$FCVV_STRINGS" ]; then
            echo "✓ FCVV présent dans fcvv.app"
          else
            echo "❌ FCVV absent dans fcvv.app"
          fi

          echo ""
          echo "Archive :"
          echo "$ARCHIVE_PATH"

          echo ""
          echo "Binaire :"
          echo "$APP_BINARY"

          echo ""
          echo "Log Xcode :"
          echo "$ARCHIVE_LOG"

          echo ""
          echo "============================================================"
          echo "                     FIN ÉTAPE 18"
          echo "============================================================"
          
      
      # ============================================================
      # 19. EXPORT IPA
      # ============================================================
      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail

          # ==========================================================
          # IMPORTANT :
          # Utiliser uniquement les outils système Apple pour
          # le processus d'export Xcode.
          # ==========================================================
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"

          echo "============================================================"
          echo "              ENVIRONNEMENT EXPORT XCODE"
          echo "============================================================"

          echo "PATH=$PATH"

          echo ""
          echo "===== RSYNC UTILISÉ ====="
          command -v rsync
          rsync --version | head -n 5

          echo ""
          echo "===== RSYNC APPLE EXPLICITE ====="
          /usr/bin/rsync --version | head -n 5

          echo ""
          echo "===== XCODEBUILD ====="
          command -v xcodebuild
          xcodebuild -version

          echo ""
          echo "===== TYPE RSYNC ====="
          type -a rsync || true

          # ==========================================================
          # Variables
          # ==========================================================
          EXPORT_DIR="$GITHUB_WORKSPACE/build/export"
          EXPORT_OPTIONS="$GITHUB_WORKSPACE/build/ExportOptions.plist"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          # ==========================================================
          # Vérification de l'archive
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "             VERIFICATION ARCHIVE"
          echo "============================================================"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERREUR : archive introuvable : $ARCHIVE_PATH"
            exit 1
          fi

          APP_PATH="$ARCHIVE_PATH/Products/Applications/fcvv.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERREUR : application introuvable dans l'archive :"
            echo "$APP_PATH"

            find "$ARCHIVE_PATH" \
              -maxdepth 5 \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Archive : $ARCHIVE_PATH"
          echo "Application : $APP_PATH"

          # ==========================================================
          # Signature
          # ==========================================================
          echo ""
          echo "===== CODE SIGNATURE DE L'ARCHIVE ====="

          codesign -dvvv "$APP_PATH" 2>&1 | \
            grep -E \
              'Identifier=|Authority=|TeamIdentifier=|Signature=' \
              || true

          # ==========================================================
          # Entitlements
          # ==========================================================
          echo ""
          echo "===== ENTITLEMENTS DE L'ARCHIVE ====="

          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true

          # ==========================================================
          # Provisioning profile
          # ==========================================================
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then

            echo ""
            echo "===== PROVISIONING PROFILE DE L'ARCHIVE ====="

            PROFILE_PLIST="$RUNNER_TEMP/archive-profile.plist"

            security cms \
              -D \
              -i "$APP_PATH/embedded.mobileprovision" \
              -o "$PROFILE_PLIST"

            echo "Profile Name :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              "$PROFILE_PLIST" \
              || true

            echo "Application Identifier :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$PROFILE_PLIST" \
              || true

            echo "Team Identifier :"
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.team-identifier' \
              "$PROFILE_PLIST" \
              || true

            echo "Expiration :"
            /usr/libexec/PlistBuddy \
              -c 'Print :ExpirationDate' \
              "$PROFILE_PLIST" \
              || true

          else
            echo "ATTENTION : aucun embedded.mobileprovision trouvé."
          fi

          # ==========================================================
          # Création ExportOptions.plist
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "              CREATION EXPORT OPTIONS"
          echo "============================================================"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>

              <key>uploadSymbols</key>
              <true/>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          # ==========================================================
          # Validation plist
          # ==========================================================
          echo ""
          echo "===== VALIDATION EXPORT OPTIONS ====="

          plutil -lint "$EXPORT_OPTIONS"

          echo ""
          echo "===== EXPORT OPTIONS ====="
          cat "$EXPORT_OPTIONS"

          # ==========================================================
          # Export
          # ==========================================================
          echo ""
          echo "============================================================"
          echo "                    EXPORT IPA"
          echo "============================================================"

          set +e

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          EXPORT_STATUS=${PIPESTATUS[0]}

          set -e

          # ==========================================================
          # DIAGNOSTIC EN CAS D'ÉCHEC
          # ==========================================================
          if [ "$EXPORT_STATUS" -ne 0 ]; then

            echo ""
            echo "============================================================"
            echo "              EXPORT IPA EN ECHEC"
            echo "============================================================"

            echo ""
            echo "===== CODE RETOUR XCODEBUILD ====="
            echo "$EXPORT_STATUS"

            echo ""
            echo "===== LOG XCODEBUILD ====="
            cat "$GITHUB_WORKSPACE/build/export.log" || true

            echo ""
            echo "===== DISTRIBUTION LOGS SOUS RUNNER_TEMP ====="

            find "$RUNNER_TEMP" \
              -type d \
              -name "*.xcdistributionlogs" \
              -print \
              2>/dev/null || true

            echo ""
            echo "===== DISTRIBUTION LOGS SOUS /var/folders ====="

            find /var/folders \
              -type d \
              -name "*.xcdistributionlogs" \
              -print \
              2>/dev/null || true

            # ======================================================
            # Recherche du dernier distribution log Xcode
            # ======================================================
            echo ""
            echo "===== RECHERCHE DU DISTRIBUTION LOG XCODE ====="

            DISTRIBUTION_LOG=$(
              find /var/folders \
                -type d \
                -name "*.xcdistributionlogs" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1
            )

            if [ -n "$DISTRIBUTION_LOG" ] && [ -d "$DISTRIBUTION_LOG" ]; then

              echo ""
              echo "Distribution log trouvé :"
              echo "$DISTRIBUTION_LOG"

              echo ""
              echo "===== CONTENU DU DISTRIBUTION LOG ====="

              find "$DISTRIBUTION_LOG" \
                -maxdepth 3 \
                -type f \
                -print \
                2>/dev/null \
                || true

              echo ""
              echo "===== ERREURS DISTRIBUTION ====="

              grep -RniE \
                'error|failed|failure|invalid|provision|signing|certificate|codesign|copy|rsync|extended-attributes|permission|operation not permitted' \
                "$DISTRIBUTION_LOG" \
                2>/dev/null \
                | head -n 300 \
                || true

              echo ""
              echo "===== IDEDistributionPipeline.log ====="

              PIPELINE_LOG="$DISTRIBUTION_LOG/IDEDistributionPipeline.log"

              if [ -f "$PIPELINE_LOG" ]; then
                cat "$PIPELINE_LOG"
              else
                echo "IDEDistributionPipeline.log introuvable."
              fi

            else

              echo "Aucun .xcdistributionlogs trouvé sous /var/folders."

            fi

          fi

          # ==========================================================
          # Recherche IPA
          # ==========================================================
          IPA_PATH=$(
            find "$EXPORT_DIR" \
              -maxdepth 1 \
              -name "*.ipa" \
              -type f \
              -print \
              -quit
          )

          if [ -z "$IPA_PATH" ]; then

            echo ""
            echo "ERREUR : aucun .ipa généré."

            echo ""
            echo "===== CONTENU DE EXPORT_DIR ====="

            find "$EXPORT_DIR" \
              -maxdepth 3 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo ""
          echo "IPA = $IPA_PATH"

          # ==========================================================
          # Copie finale
          # ==========================================================
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          FINAL_IPA="$GITHUB_WORKSPACE/artifacts/FCVV-${APP_VERSION}-${GITHUB_RUN_NUMBER}.ipa"

          cp "$IPA_PATH" "$FINAL_IPA"

          echo "FINAL_IPA=$FINAL_IPA" >> "$GITHUB_ENV"

          echo ""
          echo "============================================================"
          echo "              IPA CRÉÉ AVEC SUCCÈS"
          echo "============================================================"

          ls -lh "$FINAL_IPA"
      
      
      # ============================================================
      # 20. VERIFY IPA
      # ============================================================
      - name: Verify signed IPA
        shell: bash
        run: |
          set -euo pipefail
          echo "===== IPA ====="
          ls -lh "$FINAL_IPA"
          unzip -q -o \
            "$FINAL_IPA" \
            -d "$RUNNER_TEMP/fcvv-ipa-check"
          APP_PATH=$(
            find "$RUNNER_TEMP/fcvv-ipa-check/Payload" \
              -maxdepth 1 \
              -name "*.app" \
              -type d \
              -print \
              -quit
          )
          if [ -z "$APP_PATH" ]; then
            echo "ERREUR : .app absente de l'IPA."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          echo "===== BUNDLE ID ====="
          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )
          echo "$BUNDLE_ID"
          if [ "$BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "ERREUR : Bundle ID incorrect."
            exit 1
          fi
          echo "===== VERSION ====="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist"
          echo "===== BUILD ====="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"
          echo "===== CODE SIGNATURE ====="
          codesign \
            -dvvv \
            "$APP_PATH" \
            2>&1 | grep -E \
              'Identifier=|Authority=|TeamIdentifier=' \
              || true
          echo "===== ENTITLEMENTS ====="
          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/dev/null \
            | plutil -p - \
            || true
          echo "IPA signé vérifié."
      
      
      # ============================================================
      # 21. UPLOAD SIGNED IPA ARTIFACT
      # ============================================================
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcvv-ipa-${{ github.run_number }}
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
      
      # ============================================================
      # 22. INSTALL TRANSPORTER
      # ============================================================
      - name: Install Transporter
        run: |
          curl -fsSL \
            "https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/" \
            -o /tmp/itmstransporter.pkg
      
          sudo installer \
            -pkg /tmp/itmstransporter.pkg \
            -target /
      
          /usr/local/itms/bin/iTMSTransporter -help
      
      
      # ============================================================
      # 20bis. DIAGNOSTIC CAMERA / PRIVACY API
      # ============================================================
      - name: Diagnose camera API references
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "       DIAGNOSTIC API CAMERA DANS L'IPA"
          echo "============================================================"

          CHECK_DIR="$RUNNER_TEMP/fcvv-camera-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$FINAL_IPA" -d "$CHECK_DIR"

          APP_PATH=$(find "$CHECK_DIR/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERREUR : .app introuvable"
            exit 1
          fi

          echo "APP = $APP_PATH"

          echo ""
          echo "============================================================"
          echo "BINAIRES"
          echo "============================================================"

          find "$APP_PATH" \
            -type f \
            \( -perm -111 -o -name "*.dylib" -o -name "*.framework" \) \
            -print \
            | sort

          echo ""
          echo "============================================================"
          echo "RECHERCHE AVCAPTURE / CAMERA"
          echo "============================================================"

          find "$APP_PATH" \
            -type f \
            \( -perm -111 -o -name "*.dylib" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo ""
            echo "----- $FILE -----"

            strings "$FILE" 2>/dev/null |
              grep -Ei \
                'AVCapture|AVFoundation|camera|videocapture|capturedevice|capturesession' \
              | sort -u \
              || true

          done

          echo ""
          echo "============================================================"
          echo "FRAMEWORKS EMBARQUES"
          echo "============================================================"

          find "$APP_PATH/Frameworks" \
            -maxdepth 2 \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo ""
          echo "============================================================"
          echo "LINK AVFOUNDATION"
          echo "============================================================"

          find "$APP_PATH" \
            -type f \
            \( -perm -111 -o -name "*.dylib" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo ""
            echo "----- $FILE -----"

            otool -L "$FILE" 2>/dev/null |
              grep -Ei 'AVFoundation|CoreMedia|CoreVideo' \
              || true

          done

          echo ""
          echo "============================================================"
          echo "INFO.PLIST FINAL"
          echo "============================================================"

          plutil -p "$APP_PATH/Info.plist"

          echo ""
          echo "============================================================"
          echo "CAMERA USAGE DESCRIPTION"
          echo "============================================================"

          /usr/libexec/PlistBuddy \
            -c "Print :NSCameraUsageDescription" \
            "$APP_PATH/Info.plist" \
            2>/dev/null \
            || echo "NSCameraUsageDescription ABSENT"

          echo ""
          echo "============================================================"
          echo "DIAGNOSTIC TERMINE"
          echo "============================================================"
      
      # ============================================================
      # 23. UPLOAD TESTFLIGHT
      # ============================================================
      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.FINAL_IPA }}
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          backend: transporter
          wait-for-processing: true
          uses-non-exempt-encryption: false
